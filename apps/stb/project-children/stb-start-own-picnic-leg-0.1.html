<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan-to-Build · Start Your Own · Picnic table leg 0.1</title>
<meta name="description" content="Measure a broken picnic table leg, define it yourself, and see exactly what eight of them cost.">
<style>
:root{
  --paper:#F5F0E6; --paper2:#FBF7EF; --surface:#FFFDF8; --stage:#EFE7D8;
  --ink:#2A1E13; --ink2:#6E5C48; --ink3:#9C8A75;
  --line:#E7DCC9; --line2:#D5C5A9;
  --accent:#A85A2A; --accent2:#8A4520; --tint:#F7E9D6;
  --good:#5C7A45; --goodtint:#EDF1E4;
  --shadow:0 1px 2px rgba(60,40,20,.05),0 8px 24px -12px rgba(60,40,20,.18);
  --lift:0 2px 4px rgba(60,40,20,.06),0 18px 40px -16px rgba(60,40,20,.28);
  --r:16px;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#14110D; --paper2:#1A1612; --surface:#211C16; --stage:#241E17;
    --ink:#F4EDE1; --ink2:#BDAC97; --ink3:#8B7B68;
    --line:#332B21; --line2:#4A3E2F;
    --accent:#E09A5F; --accent2:#F2B47C; --tint:#2B2118;
    --good:#8FB06B; --goodtint:#1E2418;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
    --lift:0 2px 6px rgba(0,0,0,.5),0 22px 46px -18px rgba(0,0,0,.85);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font:16px/1.6 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  background-image:radial-gradient(1100px 520px at 10% -10%,rgba(168,90,42,.055),transparent 60%),
                   radial-gradient(900px 440px at 94% 2%,rgba(120,90,50,.05),transparent 62%);
  background-attachment:fixed}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1140px;margin:0 auto;padding:26px 22px 76px}

/* ── the thin line that says where you are ── */
.rail{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 26px}
.rail .back{font-size:13.5px;color:var(--ink2);background:none;border:0;cursor:pointer;
  padding:7px 11px;border-radius:9px;font-weight:600;transition:.15s}
.rail .back:hover{background:var(--surface);color:var(--ink)}
.rail .steps{display:flex;align-items:center;gap:7px;margin-left:auto;flex-wrap:wrap}
.rail .s{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink3);
  border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 6px}
.rail .s i{width:19px;height:19px;border-radius:50%;background:var(--line);color:var(--surface);
  font-style:normal;font-size:11px;font-weight:700;display:grid;place-items:center;line-height:1}
.rail .s.on{border-color:var(--accent);color:var(--accent2);background:var(--tint);font-weight:650}
.rail .s.on i{background:var(--accent);color:#fff}
.rail .s.done i{background:var(--good);color:#fff}
@media (prefers-color-scheme:dark){.rail .s.on i,.rail .s.done i{color:#1a1208}}

.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin:0 0 16px}
h1{font-size:clamp(30px,4.8vw,46px);line-height:1.05;letter-spacing:-.026em;margin:0 0 14px;font-weight:640}
h1 em{font-style:normal;color:var(--accent)}
h1 .q{color:var(--ink3);font-weight:400}
.lede{font-size:clamp(16px,1.9vw,18.5px);line-height:1.55;color:var(--ink2);max-width:56ch;margin:0}
.lede b{color:var(--ink);font-weight:650}

.step{display:flex;align-items:center;gap:12px;margin:40px 0 15px}
.step .n{width:27px;height:27px;flex:none;border-radius:50%;background:var(--accent);color:#fff;
  font-size:13px;font-weight:700;display:grid;place-items:center;line-height:1;
  box-shadow:0 2px 7px -2px rgba(168,90,42,.55)}
.step .n.done{background:var(--good);box-shadow:0 2px 7px -2px rgba(92,122,69,.55)}
.step h2{font-size:20px;letter-spacing:-.014em;margin:0;font-weight:650}
.step .sub{margin-left:auto;font-size:13.5px;color:var(--ink3)}
@media (prefers-color-scheme:dark){.step .n{color:#1a1208}}

/* ── cards ── */
.grid3,.grid2{display:grid;gap:16px}
.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{position:relative;display:block;width:100%;text-align:left;cursor:pointer;padding:0;font:inherit;color:inherit;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);
  transition:transform .2s cubic-bezier(.2,.7,.3,1),box-shadow .2s,border-color .2s}
.card:hover{transform:translateY(-3px);box-shadow:var(--lift);border-color:var(--line2)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.card.on{border-color:var(--accent);box-shadow:var(--lift),inset 0 0 0 1px var(--accent)}
.card .pic{display:block;width:100%;height:auto;background:linear-gradient(170deg,var(--paper2),var(--stage))}
.card .body{padding:14px 16px 16px}
.card.plain{display:flex;align-items:center}
.card.plain .body{padding:20px 22px}
.card .body b{display:block;font-size:16.5px;font-weight:650;letter-spacing:-.012em;margin-bottom:3px}
.card .body span{display:block;font-size:13.5px;line-height:1.45;color:var(--ink3)}
.card .tick{position:absolute;top:12px;right:12px;width:27px;height:27px;border-radius:50%;
  background:var(--accent);display:none;place-items:center;box-shadow:0 2px 9px -2px rgba(0,0,0,.4)}
.card.on .tick{display:grid}
.card .tick svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-color-scheme:dark){.card .tick svg{stroke:#1a1208}}
.card .flag{position:absolute;top:12px;left:12px;font-size:10.5px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;padding:5px 9px;border-radius:999px;background:var(--surface);
  border:1px solid var(--line2);color:var(--ink3)}
.card .flag.warm{border-color:var(--accent);color:var(--accent2);background:var(--tint)}

/* ── buttons ── */
.btn{font:inherit;font-size:15px;font-weight:650;padding:13px 26px;border-radius:12px;cursor:pointer;
  border:1px solid var(--accent);background:var(--accent);color:#fff;min-height:46px;
  box-shadow:0 2px 10px -2px rgba(168,90,42,.55);transition:.16s}
.btn:hover{filter:brightness(1.07);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:disabled{background:var(--surface);color:var(--ink3);border-color:var(--line);box-shadow:none;cursor:not-allowed;transform:none;filter:none}
@media (prefers-color-scheme:dark){.btn{color:#1a1208}}
.btn.ghost{background:transparent;color:var(--ink2);border-color:var(--line);box-shadow:none;font-weight:550}
.btn.ghost:hover{border-color:var(--line2);color:var(--ink);filter:none}
.btn.sm{font-size:13.5px;padding:9px 17px;border-radius:10px;min-height:40px}
.gobar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:34px 0 0;padding:18px 20px;
  border-radius:var(--r);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.gobar .sum{flex:1;min-width:230px;font-size:14.5px;color:var(--ink2)}
.gobar .sum b{color:var(--ink);font-weight:650}
.gobar .sum strong{display:block;color:var(--ink);font-weight:650;font-size:16px;margin-bottom:2px}

/* ── the bench ── */
.bench{display:grid;grid-template-columns:minmax(0,1fr) 358px;gap:20px;align-items:start}
.results{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start;margin:18px 0 0}
.results .panel{margin:0}
.stage{background:var(--stage);border:1px solid var(--line);border-radius:var(--r);padding:14px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35);overflow:hidden}
@media (prefers-color-scheme:dark){.stage{box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}}
.stage svg{width:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.stage [data-grab]{cursor:grab}
.stage [data-grab]:active{cursor:grabbing}
.stage [data-grab]:focus{outline:none}
.stage [data-grab]:focus .grip{stroke-width:3.2}
.viewseg{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
.viewseg button{border:1px solid var(--line);background:var(--surface);color:var(--ink2);border-radius:10px;
  padding:9px 14px;cursor:pointer;min-height:42px;font-size:13.5px;transition:.15s}
.viewseg button:hover{border-color:var(--line2);color:var(--ink)}
.viewseg button.on{border-color:var(--accent);background:var(--tint);color:var(--accent2);font-weight:650}
.readout{display:flex;flex-wrap:wrap;gap:8px 18px;margin:14px 2px 0;font-size:14px;color:var(--ink2)}
.readout b{color:var(--ink);font-weight:650;font-variant-numeric:tabular-nums}
.readout span.i{white-space:nowrap}
.readout .sep{color:var(--line2)}

/* ── panels and controls ── */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 17px;margin:0 0 14px;box-shadow:var(--shadow)}
.panel h3{font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--ink3);margin:0 0 13px;
  display:flex;align-items:center;gap:8px}
.panel h3 .badge{margin-left:auto;font-size:9.5px;letter-spacing:.06em;padding:3px 7px;border-radius:5px;
  border:1px solid var(--line2);color:var(--ink3);font-weight:700}
.panel h3 .badge.src{border-color:var(--good);color:var(--good);background:var(--goodtint)}
.dim{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.dim:last-child{margin-bottom:0}
.dim .lab{flex:1;min-width:0;font-size:14.5px}
.dim .lab i{display:block;font-style:normal;font-size:12px;color:var(--ink3);margin-top:1px}
.stepper{display:inline-flex;align-items:center;gap:2px;background:var(--paper2);border:1px solid var(--line);border-radius:10px;padding:3px}
.stepper button{width:34px;height:34px;border:0;background:transparent;color:var(--ink2);cursor:pointer;
  font-size:17px;line-height:1;border-radius:7px;transition:.13s;font-family:inherit}
.stepper button:hover{background:var(--surface);color:var(--accent)}
.stepper button:disabled{opacity:.3;cursor:not-allowed;background:none}
.stepper .v{min-width:70px;text-align:center;font-size:14.5px;font-weight:650;font-variant-numeric:tabular-nums}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.pill{font:inherit;font-size:12.5px;padding:8px 11px;min-height:40px;border-radius:9px;cursor:pointer;
  border:1px solid var(--line);background:var(--paper2);color:var(--ink2);transition:.13s}
.pill:hover{border-color:var(--line2);color:var(--ink)}
.pill.on{border-color:var(--accent);background:var(--tint);color:var(--accent2);font-weight:650}
.pill.ghosted{border-style:dashed;color:var(--ink3)}

/* drop-down tools */
.tool{margin:0 0 12px}
.tool:last-child{margin-bottom:0}
.tool label{display:block;font-size:14px;margin:0 0 6px;color:var(--ink)}
.tool label i{display:block;font-style:normal;font-size:12px;color:var(--ink3);margin-top:1px}
.selwrap{position:relative}
.selwrap select{width:100%;appearance:none;-webkit-appearance:none;font-size:14px;padding:11px 36px 11px 12px;
  min-height:46px;border-radius:10px;border:1px solid var(--line2);background:var(--paper2);color:var(--ink);cursor:pointer}
.selwrap select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px var(--tint)}
.selwrap select:disabled{cursor:default;color:var(--ink);opacity:1;background:var(--goodtint);border-color:var(--good)}
.selwrap:after{content:"";position:absolute;right:14px;top:50%;width:8px;height:8px;pointer-events:none;
  border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);transform:translateY(-70%) rotate(45deg)}
.selwrap.locked:after{display:none}
.selwrap .lock{position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none;
  font-size:9.5px;font-weight:700;letter-spacing:.06em;color:var(--good)}
.exact input{width:100%;max-width:160px;font:inherit;font-size:13.5px;font-variant-numeric:tabular-nums;
  padding:10px;border:1px solid var(--line2);border-radius:9px;background:var(--paper2);color:var(--ink);min-height:42px}
.exact input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px var(--tint)}

.factlock{display:flex;align-items:center;gap:10px;padding:10px 12px;margin:0 0 8px;border-radius:10px;
  background:var(--goodtint);border:1px solid var(--good)}
.factlock:last-of-type{margin-bottom:0}
.factlock .t{flex:1;min-width:0}
.factlock .t b{display:block;font-size:13.5px;font-weight:600;line-height:1.35}
.factlock .t i{display:block;font-style:normal;font-size:11.5px;color:var(--ink3);margin-top:1px}
.factlock .src{font-size:9.5px;font-weight:700;letter-spacing:.06em;color:var(--good);flex:none;align-self:flex-start;margin-top:2px}
.factdone{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.factdone:last-of-type{border-bottom:0}
.factdone .t{flex:1;min-width:0}
.factdone .t b{display:block;font-size:14px;font-weight:600;line-height:1.35}
.factdone .t i{display:block;font-style:normal;font-size:11.5px;color:var(--ink3);margin-top:1px}
.factdone .chg{font:inherit;font-size:12px;color:var(--ink3);background:none;border:1px solid var(--line);
  border-radius:8px;padding:6px 10px;min-height:34px;cursor:pointer;flex:none}
.factdone .chg:hover{border-color:var(--accent);color:var(--accent2)}
.link{color:var(--accent2);font-weight:650;text-decoration:underline;text-underline-offset:2px}
.hint{font-size:12.5px;line-height:1.55;color:var(--ink3);margin:10px 0 0}
.hint b{color:var(--ink2)}
.said{margin:0 0 14px;padding:13px 15px;border-radius:12px;background:var(--goodtint);border:1px solid var(--good)}
.said>b{display:block;font-size:14.5px}
.said span b{font-weight:650;color:var(--ink)}
.said span{display:block;font-size:13px;color:var(--ink2);margin-top:3px}
.note{margin:14px 0 0;padding:13px 15px;border:1px dashed var(--line2);border-radius:12px;background:var(--paper2);
  font-size:13.5px;line-height:1.55;color:var(--ink2)}
.note b{color:var(--ink)}

/* ── the numbers ── */
.cut{width:100%;border-collapse:collapse;font-size:13.5px}
.cut th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);
  font-weight:700;padding:0 0 8px;border-bottom:1px solid var(--line)}
.cut td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:baseline}
.cut tr:last-child td{border-bottom:0}
.cut td.q{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2);white-space:nowrap}
.cut td.n{font-weight:600}
.cut td.d{color:var(--ink2);font-variant-numeric:tabular-nums}
.buy{display:flex;align-items:baseline;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.buy .w{flex:1;min-width:0}
.buy .w i{display:block;font-style:normal;font-size:12px;color:var(--ink3)}
.buy .p{font-variant-numeric:tabular-nums;color:var(--ink2)}
.total{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:14px 0 0;
  padding:13px 15px;border-radius:11px;background:var(--tint);border:1px solid var(--line2)}
.total span{font-size:13px;color:var(--accent2);font-weight:600}
.total b{font-size:23px;font-weight:650;color:var(--accent2);font-variant-numeric:tabular-nums;letter-spacing:-.015em}

/* ── confirm ── */
.object{margin:0;padding:22px 24px;border-radius:var(--r);border:1px solid var(--line2);background:var(--surface);box-shadow:var(--lift)}
.object .eye{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin:0 0 8px}
.object h2{margin:0 0 6px;font-size:27px;letter-spacing:-.02em;font-weight:650}
.object .idline{font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--accent2);margin:0 0 18px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:9px}
.facts div{border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:var(--paper2)}
.facts b{display:block;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.facts span{display:block;margin-top:4px;font-size:13.5px}
.facts div.changed{border-color:var(--accent);background:var(--tint)}
.facts div.changed span{color:var(--accent2);font-weight:650}
.crosslink{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:20px 0 0;padding:17px 19px;
  border-radius:var(--r);border:1px solid var(--line2);background:var(--paper2)}
.crosslink .c{flex:1;min-width:250px;font-size:13.5px;color:var(--ink2)}
.crosslink .c b{display:block;color:var(--ink);font-size:15px;font-weight:650;margin-bottom:2px}
.prooflinks{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.prooflinks a{display:inline-flex;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:9px;
  background:var(--surface);color:var(--accent2);font-size:12.5px;font-weight:650;text-decoration:none;min-height:40px}
.prooflinks a:hover{border-color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.fold{margin:16px 0 0;border:1px solid var(--line);border-radius:12px;background:var(--paper2);overflow:hidden}
.fold summary{cursor:pointer;list-style:none;padding:13px 15px;font-size:13.5px;font-weight:650;color:var(--ink2);
  display:flex;align-items:center;gap:9px}
.fold summary::-webkit-details-marker{display:none}
.fold summary:before{content:"";width:7px;height:7px;border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);
  transform:rotate(-45deg);transition:transform .18s;flex:none;margin-left:2px}
.fold[open] summary:before{transform:rotate(45deg)}
.fold .in{padding:0 15px 15px;font-size:13px;line-height:1.65;color:var(--ink2)}
.fold .in b{color:var(--ink)}
pre.spec{margin:0;padding:15px 16px;border-radius:10px;background:var(--surface);border:1px solid var(--line);
  font:12px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink2);white-space:pre-wrap;max-height:340px;overflow:auto}

.flash{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(8px);opacity:0;
  background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:999px;font-size:14px;font-weight:600;
  pointer-events:none;transition:.22s;box-shadow:0 10px 30px -8px rgba(0,0,0,.4);z-index:50}
.flash.show{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{margin:52px 0 0;font-size:12.5px;line-height:1.7;color:var(--ink3);max-width:74ch}
.foot b{color:var(--ink2)}

@media (max-width:980px){.bench,.results,.grid3,.grid2{grid-template-columns:1fr}}
@media (max-width:560px){.wrap{padding:20px 14px 60px}.step .sub{width:100%;margin-left:39px}.rail .steps{margin-left:0;width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<!-- Store capability, material resolution, modeled work, and economics come only from the System bounded Store membrane. -->

</head>
<body>
<div class="wrap" id="app"></div>
<div class="flash" id="flash"></div>
<script>
/* ── shared core ─────────────────────────────────────────────────────────── */
/* ═══════════════════════════════════════════════════════════════════════════
   SHARED CORE — compiled byte-identically into both journeys.

   Both pages describe the same physical object. The definition id is computed
   here, from the physical facts only, so "grab a board" and "outdoor build"
   arrive at the same id when they arrive at the same part. What differs
   between them is how each fact came to be known, and that rides on the
   request as provenance rather than in the object's identity.
   ═══════════════════════════════════════════════════════════════════════════ */
"use strict";

var $=function(i){return document.getElementById(i)};
function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function money(v){return '$'+(Math.round(v*100)/100).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',')}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function q4(v){return Math.round(v*4)/4}
function fmt(v){
  if(v==null||!isFinite(v))return '—';
  var n=Math.abs(v)<1e-10?0:v, n32=Math.round(n*32)/32;
  if(Math.abs(n-n32)<1e-8){

  if(ev.status && ev.status!=='SUPPORTABLE')u.push('STORE_'+String(ev.status));
  var mat=ev.materialResolution;
  if(!mat||mat.status!=='MAPPED')u.push((mat&&mat.code)||'STORE_MATERIAL_RESOLUTION_UNAVAILABLE');

         get:function(){return Math.tan((Number(P.angleDegrees)||0)*Math.PI/180)},

      +' fill="none" stroke="var(--accent)" stroke-width="1.6"/>');
    o.push('<text x="'+(ax-dir*(r*0.74)-11)+'" y="'+(ay+r*0.95)+'" font-size="13" font-weight="700"'
      +' fill="var(--accent2)" font-family="ui-sans-serif,sans-serif">'+fmt(ang)+'°</text>');

      +' stroke="var(--good)"/><text x="'+(topR+1)+'" y="'+(yT-17)+'" text-anchor="middle" font-size="10"'
      +' font-weight="700" letter-spacing=".05em" fill="var(--good)"'
      +' font-family="ui-sans-serif,sans-serif">'+esc(P.angleSource||'FIXED')+'</text></g>');
  o.push('</svg>');
  return o.join('');
}

/* The end frame. Two legs actually crossing, at the angle you set — because
   the crossing is the reason both ends carry the same cut. */
function drawFrame(P){
  var ang=clamp(Number(P.angleDegrees)||0,0,45), rad=ang*Math.PI/180;
  var vw=760, vh=430, yTop=88, yCross=152, yFoot=344, cx=380;
  var dTop=Math.tan(rad)*(yCross-yTop), dFoot=Math.tan(rad)*(yFoot-yCross);
  var TANMAX=Math.tan(45*Math.PI/180);
  GEO={vw:vw,vh:vh,handles:{
    /* pull the foot out: x sits at cx − tan(angle)·run, so tan is what moves */
    ang:{axis:'x',o:cx,s:-(yFoot-yCross),min:0,max:TANMAX,
         get:function(){return Math.tan((Number(P.angleDegrees)||0)*Math.PI/180)},
         set:function(v){P.angleDegrees=Math.round(Math.atan(clamp(v,0,TANMAX))*180/Math.PI*2)/2}}
  }};
  if(P.angleLocked)GEO={vw:vw,vh:vh,handles:{}};
  var lw=Math.max(10,Math.min(22,stock(P.stockClass).w*2.6));
  var o=['<svg viewBox="0 0 '+vw+' '+vh+'" role="img" aria-label="the end frame, two legs crossing">'];
  function label(x,y,txt,anchor,cls){
    var wpx=String(txt).length*6.3+12;
    var lx=anchor==='end'?x-wpx:(anchor==='middle'?x-wpx/2:x);
    return '<rect x="'+lx+'" y="'+(y-11)+'" width="'+wpx+'" height="17" rx="5" fill="var(--stage)" opacity=".9"/>'
      +'<text x="'+x+'" y="'+y+'" text-anchor="'+(anchor||'start')+'" font-size="11.5"'
      +' fill="'+(cls||'var(--ink3)')+'" font-family="ui-sans-serif,sans-serif">'+esc(txt)+'</text>';
  }
  o.push('<text x="46" y="26" font-size="11" font-weight="700" letter-spacing=".09em" fill="var(--ink3)"'
    +' font-family="ui-sans-serif,sans-serif">THE END FRAME · TWO OF THESE LEGS, CROSSED</text>');
  o.push('<ellipse cx="'+cx+'" cy="'+(yFoot+9)+'" rx="'+(dFoot+80)+'" ry="7" fill="url(#drop)" opacity=".55"/>');
  function legPath(sign){return 'M'+(cx+sign*dTop)+' '+yTop+'L'+(cx-sign*dFoot)+' '+yFoot}
  /* the far leg first, then the near one, so the crossing reads as a crossing */
  o.push('<path d="'+legPath(-1)+'" stroke="'+GRAIN.lumber.dark+'" stroke-width="'+lw+'" stroke-linecap="butt" opacity=".85"/>');
  o.push('<path d="'+legPath(1)+'" stroke="var(--accent)" stroke-width="'+lw+'" stroke-linecap="butt"/>');
  o.push('<path d="'+legPath(1)+'" stroke="rgba(255,248,236,.16)" stroke-width="'+(lw*.32)+'" stroke-linecap="butt"/>');
  /* the feet are cut flat, so mask everything below the ground */
  o.push('<rect x="0" y="'+yFoot+'" width="'+vw+'" height="'+(vh-yFoot)+'" fill="var(--stage)"/>');
  o.push('<line x1="46" y1="'+yFoot+'" x2="'+(vw-46)+'" y2="'+yFoot+'" stroke="var(--line2)"/>');
  /* tabletop and seat rail, so it is recognisably a picnic table */
  o.push('<rect x="'+(cx-170)+'" y="'+(yTop-20)+'" width="340" height="18" rx="2" fill="url(#face-lumber)" stroke="rgba(70,45,20,.35)"/>');
  var ySeat=yCross+92, seatHalf=Math.tan(rad)*(ySeat-yCross)+64;
  o.push('<rect x="'+(cx-seatHalf)+'" y="'+ySeat+'" width="'+(seatHalf*2)+'" height="14" rx="2"'
    +' fill="url(#face-lumber)" stroke="rgba(70,45,20,.3)" opacity=".94"/>');
  /* plumb, and the angle read off it */
  o.push('<path d="M'+(cx+dTop)+' '+yTop+'v'+(yFoot-yTop)+'" stroke="var(--ink3)" stroke-dasharray="3 4" opacity=".6"/>');
  o.push(label(cx+dTop+8,yTop+20,'plumb'));
  o.push('<circle cx="'+cx+'" cy="'+yCross+'" r="5.5" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>');
  o.push('<path d="M'+(cx-9)+' '+yCross+'H'+(cx-96)+'" stroke="var(--ink3)" stroke-width="1" opacity=".5"/>');
  o.push(label(cx-102,yCross+4,'they cross here','end'));
  if(ang>0){
    var r=58, a0=[cx+dTop,yFoot-r], a1=[cx+dTop-r*Math.sin(rad),yFoot-r*Math.cos(rad)];
    o.push('<path d="M'+a0[0]+' '+a0[1]+'A'+r+' '+r+' 0 0 0 '+a1[0]+' '+a1[1]+'" fill="none"'
      +' stroke="var(--accent)" stroke-width="1.6"/>');
    o.push('<text x="'+(cx+dTop-r*0.62)+'" y="'+(yFoot-r*0.55)+'" text-anchor="middle" font-size="14"'
      +' font-weight="700" fill="var(--accent2)" font-family="ui-sans-serif,sans-serif">'+fmt(ang)+'°</text>');
  }
  o.push('<text x="'+(cx-dFoot)+'" y="'+(yFoot+26)+'" text-anchor="middle" font-size="12" font-weight="700"'
    +' fill="var(--accent2)" font-family="ui-sans-serif,sans-serif">THIS LEG</text>');
  o.push('<text x="'+(cx+dFoot)+'" y="'+(yFoot+26)+'" text-anchor="middle" font-size="12" fill="var(--ink3)"'
    +' font-family="ui-sans-serif,sans-serif">and its pair</text>');
  if(!P.angleLocked)o.push(grip('ang',cx-dFoot,yFoot-24,false,'leg angle',fmt(ang)));
  var tables=Number(P.quantity)/4;
  o.push('<text x="'+(vw-46)+'" y="'+(vh-16)+'" text-anchor="end" font-size="11" fill="var(--ink3)"'
    +' font-family="ui-sans-serif,sans-serif">'+Number(P.quantity)+' legs · '
    +(tables===Math.round(tables)?tables+' table'+(tables===1?'':'s'):'not a whole number of tables')
    +(P.angleLocked?' · the angle belongs to '+esc(P.angleSource||'the plan'):' · drag the foot to change the angle')
    +'</text>');
  o.push('</svg>');
  return o.join('');
}

/* The boards she buys, with the legs nested into them at the real angle.
   The first cut costs a triangle; after that every leg starts where the last
   one finished. That is why an inch longer can still be the same two boards. */
function drawNesting(P){
  var plan=nestPlan(P), s=stock(P.stockClass);
  var vw=760, ML=36, MR=36, IW=vw-ML-MR;
  if(!plan){
    return '<svg viewBox="0 0 '+vw+' 140" role="img" aria-label="no parent board">'
      +'<text x="'+ML+'" y="76" font-size="14" fill="var(--ink3)" font-family="ui-sans-serif,sans-serif">'
      +'No board Store Zero offers in this size is long enough. Shorten it, or pick a wider board.</text></svg>';
  }
  var r=plan.r, S=r.stockLengthIn, SC=IW/S, BH=clamp(s.w*7,46,80), gap=62, y=68, o=[];
  var sk=plan.skew*SC;
  o.push('<svg viewBox="0 0 '+vw+' 0" role="img" aria-label="your legs nested into the boards you buy">');
  o.push('<text x="'+ML+'" y="24" font-size="11" font-weight="700" letter-spacing=".09em" fill="var(--ink3)"'
    +' font-family="ui-sans-serif,sans-serif">'+r.quantity+' × '+esc(s.label)+' × '+S
    +' IN — WHAT THE '+Number(P.quantity)+' LEGS COME OUT OF</text>');
  plan.rows.forEach(function(rw,i){
    var x0=ML, top=y, bot=y+BH;
    o.push('<ellipse cx="'+(ML+IW/2)+'" cy="'+(bot+8)+'" rx="'+(IW/2)+'" ry="5" fill="url(#drop)" opacity=".5"/>');
    o.push('<rect x="'+ML+'" y="'+top+'" width="'+IW+'" height="'+BH+'" rx="2"'
      +' fill="rgba(150,118,72,.10)" stroke="var(--line2)" stroke-dasharray="4 4"/>');
    /* the triangle the first cut throws away */
    if(sk>0.6){
      o.push('<path d="M'+ML+' '+top+'L'+(ML+sk)+' '+top+'L'+ML+' '+bot+'Z" fill="rgba(150,118,72,.20)"/>');
      o.push('<path d="M'+(ML+sk)+' '+top+'L'+ML+' '+bot+'" stroke="var(--accent)" stroke-dasharray="2 3" opacity=".6"/>');
    }
    var c=0, tops=[];
    rw.row.forEach(function(len,j){
      var xb=ML+c*SC, xe=ML+(c+len)*SC;
      var d='M'+(xb+sk)+' '+top+'L'+(xe+sk)+' '+top+'L'+xe+' '+bot+'L'+xb+' '+bot+'Z';
      o.push('<path d="'+d+'" fill="url(#face-lumber)"/>');
      o.push('<clipPath id="cn'+i+'-'+j+'"><path d="'+d+'"/></clipPath>');
      o.push('<g clip-path="url(#cn'+i+'-'+j+')"><rect x="'+(xb-4)+'" y="'+top+'" width="'+(xe-xb+sk+8)
        +'" height="'+BH+'" fill="url(#grain-lumber)" opacity=".85"/></g>');
      o.push('<path d="'+d+'" fill="none" stroke="rgba(70,45,20,.36)"/>');
      tops.push('<path d="M'+(xe+sk)+' '+(top-8)+'L'+xe+' '+(bot+8)+'" stroke="var(--accent)"'
        +' stroke-dasharray="2 3" opacity=".65"/>');
      if(xe-xb>62)o.push('<text x="'+((xb+xe)/2+sk/2)+'" y="'+(top+BH/2+4.5)+'" text-anchor="middle"'
        +' font-size="12.5" font-weight="650" fill="rgba(60,38,16,.66)" font-family="ui-sans-serif,sans-serif">'
        +fmt(len)+' in</text>');
      c+=len;
    });
    o.push(tops.join(''));
    var lw=rw.left*SC, lx=ML+c*SC+sk;
    if(lw>0.6){
      o.push('<text x="'+(lx+lw/2)+'" y="'+(top+BH/2+4)+'" text-anchor="middle" font-size="11" fill="var(--ink3)"'
        +' font-family="ui-sans-serif,sans-serif">'
        +(lw>78?eighths(rw.left)+' in left over':(lw>32?eighths(rw.left)+' in':''))+'</text>');
    }
    o.push('<text x="'+ML+'" y="'+(top-16)+'" font-size="10" font-weight="700" letter-spacing=".08em"'
      +' fill="var(--ink3)" font-family="ui-sans-serif,sans-serif">BOARD '+(i+1)+' · '+rw.row.length+' LEGS</text>');
    if(!rw.fits)
      o.push('<text x="'+(ML+IW)+'" y="'+(top-16)+'" text-anchor="end" font-size="10.5" font-weight="700"'
        +' fill="var(--accent2)" font-family="ui-sans-serif,sans-serif">DOES NOT FIT AT THIS ANGLE</text>');
    y+=BH+gap;
  });
  var vh=y-gap+40;
  o.push('<text x="'+ML+'" y="'+(vh-8)+'" font-size="11" fill="var(--ink3)" font-family="ui-sans-serif,sans-serif">'
    +(plan.skew>0.05
      ? 'Only the first cut costs a triangle. After that each leg starts where the last one ended.'
      : 'Square ends, so the legs sit end to end.')+'</text>');
  o[0]=o[0].replace('viewBox="0 0 '+vw+' 0"','viewBox="0 0 '+vw+' '+vh+'"');
  o.push('</svg>');
  return o.join('');
}

/* How far the slanted end reaches across the board. This is the number that
   makes an angled cut cost more board than a square one — but only once. */
function skewOf(P){
  var s=stock(P.stockClass);
  var W=(P.cutPlane==='bevel-thickness')?s.t:s.w;
  return W*Math.tan((Number(P.angleDegrees)||0)*Math.PI/180);
}
/* Parallel angled ends nest: every leg after the first starts where the last
   one finished, so the run is the sum of the lengths plus one triangle. The
   shared resolver counts by finished length, which gets the board count right
   and the offcut slightly generous — so the true run is checked here. */
function nestPlan(P){
  var r=resolveMaterial(P);
  if(!r||r.status!=='MAPPED'||r.form!=='board')return null;
  var sk=Number(r.endAllowanceIn);
  if(!isFinite(sk))sk=skewOf(P);
  var sourceRows=Array.isArray(r.rows)?r.rows:[];
  var rows=sourceRows.map(function(row){
    var count=Math.max(0,Number(row.parts)||0);
    var parts=[];for(var i=0;i<count;i++)parts.push(Number(P.finishedLength));
    var sum=Number(row.sum);if(!isFinite(sum))sum=count*Number(P.finishedLength);
    var run=Number(row.run);if(!isFinite(run))run=sum+sk;
    return {row:parts,sum:sum,run:run,left:r.stockLengthIn-run,fits:run<=r.stockLengthIn+1e-6};
  });
  return {r:r,skew:sk,rows:rows,fits:rows.length>0&&rows.every(function(x){return x.fits})};
}

function buildBridge(cfg){
  function def(){
    var d=physicalDemand(cfg.part());
    d.definitionId=definitionId(d);
    d.sourceAuthority=cfg.sourceAuthority;
    return JSON.parse(JSON.stringify(d));
  }
  function demand(){
    var P=cfg.part(), d=physicalDemand(P), c=storeContract();
    var base={protocol:'stb.store-handoff/0.1',projectId:cfg.projectId,projectClass:cfg.projectClass,
      definitionId:definitionId(d),physicalDemand:d,sourceAuthority:cfg.sourceAuthority,
      unresolvedConditions:unresolvedConditions(P)};
    if(c&&typeof c.createComparisonHandoff==='function'){
      try{return c.createComparisonHandoff(base)}catch(e){}
    }
    return base;
  }
  window.STBProjectBridge={
    version:'stb.project-bridge/0.1',
    projectId:cfg.projectId, projectClass:cfg.projectClass, sourceAuthority:cfg.sourceAuthority,
    getDefinition:def, getDefinitionId:function(){return definitionId(physicalDemand(cfg.part()))},
    getStoreDemand:demand,
    getSnapshot:function(){
      var P=cfg.part(), d=physicalDemand(P), r=resolveMaterial(P);
      return {projectId:cfg.projectId, projectClass:cfg.projectClass, sourceAuthority:cfg.sourceAuthority,
        screen:cfg.screen(), definitionId:definitionId(d), definition:def(),
        confirmed:cfg.confirmed()?{definitionId:cfg.confirmed().id,payload:cfg.confirmed()}:null,
        currentMatchesConfirmed:!!(cfg.confirmed()&&cfg.confirmed().id===definitionId(d)),
        material:r&&r.status==='MAPPED'?{sku:r.storeSku,quantity:r.quantity,total:r.materialTotal}:null,
        unresolvedConditions:unresolvedConditions(P),
        storeDemand:demand()};
    }
  };
  return window.STBProjectBridge;
}

/* ═══════════ 9 · THE DRAG ENGINE ═══════════ */
function svgRect(){
  var st=$('stage'), sv=st?st.querySelector('svg'):null;
  return sv&&sv.getBoundingClientRect?sv.getBoundingClientRect():null;
}
function applyDrag(cx,cy,redraw){
  if(!grab||!GEO||!GEO.handles[grab])return;
  var H=GEO.handles[grab], r=svgRect();
  if(!r||!r.width||!r.height)return;
  var v=H.axis==='x'
    ? ((cx-r.left)*(GEO.vw/r.width)-H.o)/H.s
    : ((cy-r.top)*(GEO.vh/r.height)-H.o)/H.s;
  if(!isFinite(v))return;
  H.set(clamp(v,H.min,H.max));
  redraw();
}
function installDrag(redraw,commit){
  function start(t,x,y){
    grab=t.getAttribute('data-grab'); focusKey=grab;
    /* deliberately no applyDrag here: touching a handle must never change a value */
  }
  document.addEventListener('mousedown',function(e){
    var t=e.target.closest&&e.target.closest('[data-grab]'); if(!t)return;
    e.preventDefault(); start(t,e.clientX,e.clientY);
  });
  document.addEventListener('mousemove',function(e){ if(grab)applyDrag(e.clientX,e.clientY,redraw) });

  document.addEventListener('touchstart',function(e){
    var t=e.target.closest&&e.target.closest('[data-grab]'); if(!t)return;
    e.preventDefault(); start(t,e.touches[0].clientX,e.touches[0].clientY);

    var t=e.target.closest&&e.target.closest('[data-grab]'); if(!t)return;
    var k=t.getAttribute('data-grab'), H=GEO&&GEO.handles[k]; if(!H)return;
    var dir=0;

    e.preventDefault();

    var span=H.max-H.min, step=(k==='ang'?span/90:0.25)*(e.shiftKey?4:1);
    focusKey=k;
    H.set(clamp(cur+dir*step,H.min,H.max));

}

}
document.addEventListener('click',function(e){
  var t=e.target.closest&&e.target.closest('[data-stock],[data-view],[data-step],[data-set],[data-qty],[data-taller],[data-reopen]');
  if(!t)return;
  if(t.dataset.reopen){OPENED[t.dataset.reopen]=true;render();return}
  if(t.dataset.stock)A.P.stockClass=t.dataset.stock;
  else if(t.dataset.view)A.view=t.dataset.view;
  else if(t.dataset.qty){A.quantity=+t.dataset.qty;A.P.quantity=+t.dataset.qty}
  else if(t.dataset.taller!=null)A.wantTaller=!A.wantTaller;
  else if(t.dataset.step){var a=t.dataset.step.split(':');setKey(a[0],currentOf(a[0])+ +a[1])}
  else if(t.dataset.set){var b=t.dataset.set.split(':');setKey(b[0],+b[1])}
  render();
});
document.addEventListener('change',function(e){
  var sel=e.target.closest&&e.target.closest('[data-fact],[data-sel]');
  if(sel){
    if(sel.dataset.fact){
      A.P[sel.dataset.fact]=sel.value||null;
      OPENED[sel.dataset.fact]=false;
      if(sel.dataset.fact==='endIdentity'&&sel.value!=='both')A.P.endRelation=null;
    } else A[sel.dataset.sel]=sel.value;
    render(); return;
  }
  var el=e.target.closest&&e.target.closest('[data-exact]');
  if(!el)return;
  var v=parseDimension(el.value);
  if(v==null||!isFinite(v)){flash('Try a number like 32 3/4');render();return}
  setKey(el.getAttribute('data-exact'),v); render();
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;
  var el=e.target.closest&&e.target.closest('[data-exact]'); if(!el)return;
  e.preventDefault(); el.dispatchEvent(new Event('change',{bubbles:true}));
});
installDrag(redraw,function(){render()});
window.A=A;
render();

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan-to-Build · Start Your Own 0.11 · Definition to Doing</title>
<style>
:root{
  --paper:#F5F0E6; --paper2:#FBF7EF; --surface:#FFFDF8; --stage:#EFE7D8;
  --ink:#2A1E13; --ink2:#6E5C48; --ink3:#9C8A75;
  --line:#E7DCC9; --line2:#D5C5A9;
  --accent:#A85A2A; --accent2:#8A4520; --tint:#F7E9D6;
  --good:#5C7A45;
  --shadow:0 1px 2px rgba(60,40,20,.05),0 8px 24px -12px rgba(60,40,20,.18);
  --lift:0 2px 4px rgba(60,40,20,.06),0 18px 40px -16px rgba(60,40,20,.26);
  --r:16px;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#14110D; --paper2:#1A1612; --surface:#211C16; --stage:#241E17;
    --ink:#F4EDE1; --ink2:#BDAC97; --ink3:#8B7B68;
    --line:#332B21; --line2:#4A3E2F;
    --accent:#E09A5F; --accent2:#F2B47C; --tint:#2B2118;
    --good:#8FB06B;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
    --lift:0 2px 6px rgba(0,0,0,.5),0 22px 46px -18px rgba(0,0,0,.85);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font:16px/1.6 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1100px 520px at 10% -10%,rgba(168,90,42,.06),transparent 60%),
                   radial-gradient(900px 440px at 94% 2%,rgba(120,90,50,.05),transparent 62%);
  background-attachment:fixed}
.wrap{max-width:1160px;margin:0 auto;padding:28px 22px 80px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin:0 0 18px}
h1{font-size:clamp(32px,5.4vw,52px);line-height:1.03;letter-spacing:-.028em;margin:0 0 14px;font-weight:640}
h1 em{font-style:normal;color:var(--accent)}
.lede{font-size:clamp(16px,1.9vw,18.5px);line-height:1.55;color:var(--ink2);max-width:54ch;margin:0}
.step{display:flex;align-items:center;gap:12px;margin:44px 0 16px}
.step .n{width:27px;height:27px;flex:none;border-radius:50%;background:var(--accent);color:#fff;
  font-size:13px;font-weight:700;display:grid;place-items:center;line-height:1;
  box-shadow:0 2px 7px -2px rgba(168,90,42,.6)}
.step .n.done{background:var(--good);box-shadow:0 2px 7px -2px rgba(92,122,69,.6)}
.step h2{font-size:20.5px;letter-spacing:-.014em;margin:0;font-weight:650}
.step .sub{margin-left:auto;font-size:13.5px;color:var(--ink3)}
@media (prefers-color-scheme:dark){.step .n{color:#1a1208}}

.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{position:relative;display:block;width:100%;text-align:left;cursor:pointer;padding:0;font:inherit;color:inherit;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);
  transition:transform .2s cubic-bezier(.2,.7,.3,1),box-shadow .2s,border-color .2s}
.card:hover{transform:translateY(-3px);box-shadow:var(--lift);border-color:var(--line2)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.card.on{border-color:var(--accent);box-shadow:var(--lift),inset 0 0 0 1px var(--accent)}
.card .pic{display:block;width:100%;height:auto;background:linear-gradient(170deg,var(--paper2),var(--stage))}
.card .body{padding:14px 16px 16px}
.card .body b{display:block;font-size:16.5px;font-weight:650;letter-spacing:-.012em;margin-bottom:3px}
.card .body span{display:block;font-size:13.5px;line-height:1.45;color:var(--ink3)}
.card .tick{position:absolute;top:12px;right:12px;width:27px;height:27px;border-radius:50%;
  background:var(--accent);display:none;place-items:center;box-shadow:0 2px 9px -2px rgba(0,0,0,.45)}
.card.on .tick{display:grid}
.card .tick svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-color-scheme:dark){.card .tick svg{stroke:#1a1208}}

.sizes{display:flex;flex-wrap:wrap;gap:9px;margin:16px 0 0}
.size{font:inherit;font-size:13.5px;padding:8px 15px 8px 10px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);color:var(--ink2);
  display:inline-flex;align-items:center;gap:9px;transition:.15s}
.size:hover{border-color:var(--line2);color:var(--ink);transform:translateY(-1px)}
.size.on{border-color:var(--accent);background:var(--tint);color:var(--accent2);font-weight:650}
.size svg{display:block;border-radius:4px;flex:none}

.gobar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:38px 0 0;padding:18px 20px;
  border-radius:var(--r);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.gobar .sum{flex:1;min-width:230px;font-size:14.5px;color:var(--ink2)}
.gobar .sum b{color:var(--ink);font-weight:650}
.btn{font:inherit;font-size:15px;font-weight:650;padding:13px 26px;border-radius:12px;cursor:pointer;
  border:1px solid var(--accent);background:var(--accent);color:#fff;
  box-shadow:0 2px 10px -2px rgba(168,90,42,.55);transition:.16s}
.btn:hover{filter:brightness(1.07);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:disabled{background:var(--surface);color:var(--ink3);border-color:var(--line);box-shadow:none;
  cursor:not-allowed;transform:none;filter:none}
@media (prefers-color-scheme:dark){.btn{color:#1a1208}}
.btn.ghost{background:transparent;color:var(--ink2);border-color:var(--line);box-shadow:none;font-weight:550}
.btn.ghost:hover{border-color:var(--line2);color:var(--ink);filter:none}
.btn.sm{font-size:13.5px;padding:9px 17px;border-radius:10px}

/* ── bench ── */
.top{display:flex;align-items:center;gap:14px;margin:0 0 22px;flex-wrap:wrap}
.top h1{font-size:clamp(26px,3.4vw,34px);margin:0}
.top .crumb{font:inherit;font-size:13.5px;color:var(--ink2);background:none;border:0;cursor:pointer;
  padding:7px 12px;border-radius:9px;transition:.15s}
.top .crumb:hover{background:var(--surface);color:var(--ink)}
.bench{display:grid;grid-template-columns:minmax(0,1fr) 352px;gap:20px;align-items:start}
.results{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start;margin:20px 0 0}
.results .panel{margin:0}
.stage{background:var(--stage);border:1px solid var(--line);border-radius:var(--r);padding:14px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35);overflow:hidden}
@media (prefers-color-scheme:dark){.stage{box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}}
.stage svg{width:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.stage [data-grab]{cursor:grab}
.stage [data-grab]:active{cursor:grabbing}
.stage [data-grab]:focus{outline:none}
.stage [data-grab]:focus .grip{stroke-width:3}
.readout{display:flex;flex-wrap:wrap;gap:8px 20px;margin:14px 2px 0;font-size:14px;color:var(--ink2)}
.readout b{color:var(--ink);font-weight:650;font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 17px;margin:0 0 14px;box-shadow:var(--shadow)}
.panel h3{font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--ink3);
  margin:0 0 13px}
.dimblock{margin:0 0 15px;padding-bottom:1px}
.dimblock:last-child{margin-bottom:0}
.dim{display:flex;align-items:center;gap:10px;margin:0 0 7px}
.dim:last-child{margin-bottom:0}
.dim .lab{flex:1;min-width:0;font-size:14.5px}
.dim .lab i{display:block;font-style:normal;font-size:12px;color:var(--ink3);margin-top:1px}
.dimmeta{display:flex;align-items:center;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-left:min(42%,150px)}
.exact{display:flex;align-items:center;gap:7px;min-width:0;flex:1}
.exact label{font-size:11px;color:var(--ink3);white-space:nowrap}
.exact input{width:100%;min-width:92px;max-width:150px;font:inherit;font-size:13.5px;font-variant-numeric:tabular-nums;
  padding:7px 9px;border:1px solid var(--line2);border-radius:8px;background:var(--paper2);color:var(--ink);outline:none}
.exact input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--tint)}
.exact input.invalid{border-color:var(--accent);box-shadow:0 0 0 2px var(--tint)}
.status{font:inherit;font-size:10.5px;font-weight:700;letter-spacing:.055em;text-transform:uppercase;padding:7px 9px;border-radius:8px;cursor:pointer;
  border:1px solid var(--line2);background:var(--paper2);color:var(--ink3);white-space:nowrap}
.status.confirmed{border-color:var(--good);color:var(--good);background:var(--surface)}
.status.checking{border-style:dashed;color:var(--accent2)}
.resolution{margin:0;padding:13px 14px;border:1px dashed var(--accent);border-radius:11px;background:var(--tint)}
.resolution b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent2);margin-bottom:7px}
.resolution .fact{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;padding:3px 0;color:var(--ink2)}
.resolution .fact strong{font-weight:650;color:var(--ink);font-variant-numeric:tabular-nums}
@media (max-width:560px){.dim{align-items:flex-start}.dimmeta{margin-left:0;justify-content:stretch}.exact{flex:1 1 160px}.status{flex:0 0 auto}}
.stepper{display:inline-flex;align-items:center;gap:2px;background:var(--paper2);border:1px solid var(--line);
  border-radius:10px;padding:3px}
.stepper button{width:30px;height:30px;border:0;background:transparent;color:var(--ink2);cursor:pointer;
  font-size:17px;line-height:1;border-radius:7px;transition:.13s;font-family:inherit}
.stepper button:hover{background:var(--surface);color:var(--accent)}
.stepper button:disabled{opacity:.3;cursor:not-allowed;background:none}
.stepper .v{min-width:66px;text-align:center;font-size:14.5px;font-weight:650;font-variant-numeric:tabular-nums}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.pill{font:inherit;font-size:12.5px;padding:6px 11px;border-radius:8px;cursor:pointer;
  border:1px solid var(--line);background:var(--paper2);color:var(--ink2);transition:.13s}
.pill:hover{border-color:var(--line2);color:var(--ink)}
.pill.on{border-color:var(--accent);background:var(--tint);color:var(--accent2);font-weight:650}
.cut{width:100%;border-collapse:collapse;font-size:13.5px}
.cut th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);
  font-weight:700;padding:0 0 8px;border-bottom:1px solid var(--line)}
.cut td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:baseline}
.cut tr:last-child td{border-bottom:0}
.cut td.q{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2);white-space:nowrap}
.cut td.n{font-weight:600}
.cut td.d{color:var(--ink2);font-variant-numeric:tabular-nums}
.buy{display:flex;align-items:baseline;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.buy:last-of-type{border-bottom:0}
.buy .w{flex:1;min-width:0}
.buy .w i{display:block;font-style:normal;font-size:12px;color:var(--ink3)}
.buy .p{font-variant-numeric:tabular-nums;color:var(--ink2)}
.total{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:14px 0 0;
  padding:13px 15px;border-radius:11px;background:var(--tint);border:1px solid var(--line2)}
.total span{font-size:13px;color:var(--accent2);font-weight:600}
.total b{font-size:23px;font-weight:650;color:var(--accent2);font-variant-numeric:tabular-nums;letter-spacing:-.015em}
.flowstack{display:grid;grid-template-columns:1fr;gap:14px;margin:20px 0 0}
.flowpanel{margin:0}
.flowline{display:grid;grid-template-columns:minmax(150px,.8fr) minmax(0,1.6fr);gap:14px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.flowline:last-child{border-bottom:0}
.flowline .k{color:var(--ink3);font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.flowline .v{color:var(--ink2)}
.flowline .v b{color:var(--ink);font-weight:650}
.oplist{display:grid;gap:9px}
.oprow{display:grid;grid-template-columns:minmax(110px,.75fr) minmax(130px,.9fr) minmax(0,1.6fr);gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.oprow:last-child{border-bottom:0}
.oprow .part{font-weight:650;color:var(--ink)}
.oprow .op{font-size:11px;font-weight:750;letter-spacing:.055em;color:var(--accent2)}
.oprow .detail{color:var(--ink2)}
.oprow.unresolved{padding:12px;border:1px dashed var(--accent);border-radius:10px;background:var(--tint)}
.basisgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.basisbox{border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--paper2)}
.basisbox .k{display:block;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);margin-bottom:3px}
.basisbox b{font-size:14px;font-weight:650;color:var(--ink)}
.costbig{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 10px;padding:14px 15px;border-radius:11px;background:var(--tint);border:1px solid var(--line2)}
.costbig span{font-size:12px;font-weight:650;color:var(--accent2)}
.costbig b{font-size:26px;color:var(--accent2);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.handoff{margin:20px 0 0;padding:18px 20px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.handoffhead{display:flex;align-items:flex-start;gap:16px;justify-content:space-between;flex-wrap:wrap}
.handoffhead .copy{flex:1;min-width:250px}
.handoffhead .copy b{display:block;font-size:17px;margin-bottom:2px}
.handoffhead .copy span{display:block;font-size:13.5px;color:var(--ink2);max-width:68ch}
.version{display:inline-block;font:11px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;padding:6px 8px;border:1px solid var(--line2);border-radius:8px;background:var(--paper2);color:var(--ink2)}
.storeanswer{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.storestatus{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.07em;padding:6px 8px;border-radius:8px;border:1px solid var(--line2);color:var(--ink2);background:var(--paper2);margin-bottom:8px}
.storestatus.supported{border-color:var(--good);color:var(--good);background:var(--surface)}
.storestatus.resolve{border-color:var(--accent);color:var(--accent2);background:var(--tint)}
.storestatus.unsupported{border-color:var(--accent);color:var(--accent2);background:var(--surface)}
.authority{margin:13px 0 0;padding:12px 13px;border-top:1px solid var(--line);font-size:11.5px;line-height:1.7;color:var(--ink3)}
.authority b{color:var(--ink2)}
.spinefold{margin:10px 0 0;border-top:1px solid var(--line);padding:10px 2px 0;color:var(--ink3);font-size:12px}
.spinefold summary{cursor:pointer;list-style:none;font-weight:650;color:var(--ink2);width:max-content}
.spinefold summary::-webkit-details-marker{display:none}
.spinefold summary:after{content:"  +";color:var(--accent)}
.spinefold[open] summary:after{content:"  –"}
.spinebody{padding:10px 2px 2px;max-width:850px;line-height:1.6}
.storesummary{margin:10px 0 0;font-size:15px;line-height:1.55;color:var(--ink2)}
@media (max-width:700px){.flowline,.oprow{grid-template-columns:1fr;gap:3px}.basisgrid{grid-template-columns:1fr}}
.opbuilder{display:grid;gap:10px}
.opchoice{border:1px solid var(--line);border-radius:11px;padding:12px 13px;background:var(--paper2)}
.opchoice.on{border-color:var(--accent);background:var(--tint)}
.opchoice .hd{display:flex;align-items:center;justify-content:space-between;gap:12px}
.opchoice .hd b{font-size:14px}
.opfields{display:grid;gap:11px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.opfield>span{display:block;font-size:10.5px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.opbuttons{display:flex;gap:6px;flex-wrap:wrap}
.opbuttons button{border:1px solid var(--line);background:var(--surface);color:var(--ink2);border-radius:8px;padding:7px 9px;font-size:12px;cursor:pointer}
.opbuttons button.on{border-color:var(--accent);background:var(--tint);color:var(--accent2);font-weight:700}
.opangleinput{width:96px;padding:7px 8px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);color:var(--ink)}
.opwarn{border:1px dashed var(--accent);background:var(--tint);border-radius:9px;padding:9px 11px;color:var(--accent2);font-size:12px;line-height:1.5}
.angle-drawing{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.angle-drawing svg{width:100%;display:block;background:var(--paper2);border:1px solid var(--line);border-radius:10px}
.angle-key{display:flex;gap:12px;flex-wrap:wrap;margin-top:7px;font-size:11px;color:var(--ink3)}
.project-return{border:0;background:transparent;color:var(--ink2);font-weight:650;padding:6px 0;cursor:pointer}
.hint{font-size:12px;line-height:1.5;color:var(--ink3);margin:10px 0 0}
.done-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:22px 0 0;padding:18px 20px;
  border-radius:var(--r);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.done-bar .t{flex:1;min-width:240px}
.done-bar .t b{display:block;font-size:16px;font-weight:650;margin-bottom:2px}
.done-bar .t span{font-size:13.5px;color:var(--ink3)}
pre.spec{margin:14px 0 0;padding:15px 16px;border-radius:12px;background:var(--paper2);border:1px solid var(--line);
  font:12.5px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink2);white-space:pre-wrap;
  max-height:330px;overflow:auto}
.flash{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(8px);opacity:0;
  background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:999px;font-size:14px;font-weight:600;
  pointer-events:none;transition:.22s;box-shadow:0 10px 30px -8px rgba(0,0,0,.4);z-index:50}
.flash.show{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{margin:56px 0 0;font-size:12.5px;line-height:1.65;color:var(--ink3);max-width:72ch}
@media (max-width:980px){ .bench{grid-template-columns:1fr} .results{grid-template-columns:1fr} }
@media (max-width:860px){ .grid3{grid-template-columns:1fr} }

<script>
"use strict";
var $=function(i){return document.getElementById(i)};
function esc(s){return (''+s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function money(v){return '$'+(Math.round(v*100)/100).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',')}
function fmt(v){
  if(v==null||!isFinite(v))return '—';
  var n=Math.abs(v)<1e-10?0:v, n32=Math.round(n*32)/32;
  if(Math.abs(n-n32)<1e-8){
    var sign=n32<0?'-':'', a=Math.abs(n32), w=Math.floor(a), e=Math.round((a-w)*32), d=32;
    if(e===0)return sign+''+w;
    if(e===32)return sign+''+(w+1);
    while(e%2===0){e/=2;d/=2}
    return sign+(w?w+' ':'')+e+'/'+d;
  }
  return (Math.round(n*10000)/10000).toString();
}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function q4(v){return Math.round(v*4)/4}
function same(a,b){return Math.abs(a-b)<1e-8}

/* ═══════════════ 1 · THE WOOD ═══════════════
   One grain recipe per grade, used by the cards, the chips and the piece on the
   bench, so the thing you picked is the thing you see all the way through. */
var GRAIN={
  lumber  :{f1:'#EFE0BC',f2:'#E0CCA2',top:'#F3E7C8',end:'#D8C49B',ring:'#C0A87C',
            line:'rgba(150,118,70,.34)',dark:'#B79D72',knot:'#AE8A54'},
  hardwood:{f1:'#D29A5E',f2:'#B87C42',top:'#DCA96C',end:'#C08B52',ring:'#96612F',
            line:'rgba(108,60,24,.36)',dark:'#9A6733',knot:'#7A4820'},

/* gradients + grain patterns, one set per grade, injected once */
function woodDefs(){
  var out='<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>';
  Object.keys(GRAIN).forEach(function(k){
    var g=GRAIN[k];
    out+='<linearGradient id="face-'+k+'" x1="0" y1="0" x2="0" y2="1">'
       +'<stop offset="0" stop-color="'+g.f1+'"/><stop offset="1" stop-color="'+g.f2+'"/></linearGradient>'
       +'<linearGradient id="top-'+k+'" x1="0" y1="0" x2="1" y2="1">'
       +'<stop offset="0" stop-color="'+g.top+'"/><stop offset="1" stop-color="'+g.f1+'"/></linearGradient>'
       +'<linearGradient id="end-'+k+'" x1="0" y1="0" x2="1" y2="1">'
       +'<stop offset="0" stop-color="'+g.end+'"/><stop offset="1" stop-color="'+g.dark+'"/></linearGradient>'
       /* straight grain, for faces seen flat */
       +'<pattern id="grain-'+k+'" width="46" height="13" patternUnits="userSpaceOnUse">'
       +'<path d="M0 3 Q12 1.2 23 3.2 T46 2.6" fill="none" stroke="'+g.line+'" stroke-width="1"/>'
       +'<path d="M0 8.4 Q14 10.2 26 8 T46 9" fill="none" stroke="'+g.line+'" stroke-width=".8" opacity=".75"/>'
       +'<path d="M0 12 Q18 11 30 12.4 T46 11.6" fill="none" stroke="'+g.line+'" stroke-width=".6" opacity=".5"/>'
       +'</pattern>'
       /* ply layers, for sheet edges */
       +'<pattern id="ply-'+k+'" width="6" height="5" patternUnits="userSpaceOnUse">'
       +'<rect width="6" height="2.5" fill="'+g.f1+'"/><rect y="2.5" width="6" height="2.5" fill="'+g.dark+'"/>'
       +'</pattern>';
  });
  out+='<radialGradient id="drop" cx=".5" cy=".5" r=".5">'
     +'<stop offset="0" stop-color="rgba(70,45,20,.30)"/><stop offset="1" stop-color="rgba(70,45,20,0)"/>'
     +'</radialGradient></defs></svg>';
  return out;
}

/* ── the board portrait on the grade cards: a real board, in the round ── */
function boardPortrait(kind){
  var g=GRAIN[kind], hard=(kind==='hardwood');
  var x0=54,x1=292,yT=62,yB=108,dx=30,dy=-19;               /* isometric box */
  var o=[];
  o.push('<svg class="pic" viewBox="0 0 340 150" role="img" aria-hidden="true">');
  o.push('<ellipse cx="192" cy="122" rx="122" ry="14" fill="url(#drop)"/>');
  /* top face */
  o.push('<path d="M'+x0+' '+yT+'L'+(x0+dx)+' '+(yT+dy)+'L'+(x1+dx)+' '+(yT+dy)+'L'+x1+' '+yT+'Z" fill="url(#top-'+kind+')"/>');
  o.push('<g clip-path="url(#ctop-'+kind+')">');
  for(var i=1;i<5;i++){
    var t=i/5, ax=x0+dx*t, ay=yT+dy*t;
    o.push('<path d="M'+(ax+6)+' '+ay+' L'+(x1+dx*t-6)+' '+(ay)+'" stroke="'+g.line+'" stroke-width=".9" opacity=".6"/>');
  }
  o.push('</g>');
  o.push('<clipPath id="ctop-'+kind+'"><path d="M'+x0+' '+yT+'L'+(x0+dx)+' '+(yT+dy)+'L'+(x1+dx)+' '+(yT+dy)+'L'+x1+' '+yT+'Z"/></clipPath>');
  /* front face */
  o.push('<rect x="'+x0+'" y="'+yT+'" width="'+(x1-x0)+'" height="'+(yB-yT)+'" fill="url(#face-'+kind+')"/>');
  o.push('<clipPath id="cface-'+kind+'"><rect x="'+x0+'" y="'+yT+'" width="'+(x1-x0)+'" height="'+(yB-yT)+'"/></clipPath>');
  o.push('<g clip-path="url(#cface-'+kind+')">');
  if(hard){
    /* straight grain running the length, then the cathedral rises out of it */
    o.push('<rect x="'+x0+'" y="'+yT+'" width="'+(x1-x0)+'" height="'+(yB-yT)+'" fill="url(#grain-'+kind+')" opacity=".55"/>');
    /* cathedral figure — nested arches, the thing that makes hardwood worth paying for */
    for(var a=0;a<5;a++){
      var w=34+a*17, cx=152, top=yB-6-a*7.5;
      o.push('<path d="M'+(cx-w)+' '+(yB+3)+' C'+(cx-w*.5)+' '+top+' '+(cx+w*.5)+' '+top+' '+(cx+w)+' '+(yB+3)+'"'
        +' fill="none" stroke="'+g.line+'" stroke-width="'+(1.5-a*.14)+'"/>');
      o.push('<path d="M'+(cx-w+62)+' '+(yB+3)+' C'+(cx-w*.5+62)+' '+(top+4)+' '+(cx+w*.5+62)+' '+(top+4)+' '+(cx+w+62)+' '+(yB+3)+'"'
        +' fill="none" stroke="'+g.line+'" stroke-width="'+(1.2-a*.1)+'" opacity=".62"/>');
    }
    /* ray fleck */
    for(var r=0;r<16;r++){
      var rx=x0+12+((r*37)%(x1-x0-20)), ry=yT+6+((r*23)%(yB-yT-12));
      o.push('<line x1="'+rx+'" y1="'+ry+'" x2="'+(rx+5)+'" y2="'+(ry+1)+'" stroke="rgba(255,238,210,.20)" stroke-width="1.1"/>');
    }
  } else {
    o.push('<rect x="'+x0+'" y="'+yT+'" width="'+(x1-x0)+'" height="'+(yB-yT)+'" fill="url(#grain-'+kind+')"/>');
    /* two knots, because this is the cheap stuff and that is the point */
    [[126,95,7,-16],[222,84,4.6,10]].forEach(function(k){
      var kx=k[0],ky=k[1],r=k[2],rot=k[3], tf=' transform="rotate('+rot+' '+kx+' '+ky+')"';
      /* the grain has to go round it, or it is a sticker */
      for(var q=3;q>=1;q--)
        o.push('<ellipse cx="'+kx+'" cy="'+ky+'" rx="'+(r*(1+q*.62))+'" ry="'+(r*(.68+q*.34))+'"'
          +' fill="none" stroke="'+g.line+'" stroke-width="'+(1.25-q*.2)+'" opacity="'+(.85-q*.16)+'"'+tf+'/>');
      o.push('<ellipse cx="'+kx+'" cy="'+ky+'" rx="'+r+'" ry="'+(r*.68)+'" fill="'+g.knot+'" opacity=".9"'+tf+'/>');
      o.push('<ellipse cx="'+kx+'" cy="'+ky+'" rx="'+(r*.52)+'" ry="'+(r*.34)+'" fill="'+g.dark+'" opacity=".55"'+tf+'/>');
      o.push('<ellipse cx="'+kx+'" cy="'+ky+'" rx="'+r+'" ry="'+(r*.68)+'" fill="none" stroke="rgba(70,45,20,.45)"'
        +' stroke-width=".9"'+tf+'/>');
    });
  }
  o.push('</g>');
  /* left end — growth rings */
  var ep='M'+x0+' '+yT+'L'+(x0+dx)+' '+(yT+dy)+'L'+(x0+dx)+' '+(yB+dy)+'L'+x0+' '+yB+'Z';
  o.push('<clipPath id="cend-'+kind+'"><path d="'+ep+'"/></clipPath>');
  o.push('<path d="'+ep+'" fill="url(#end-'+kind+')"/>');
  o.push('<g clip-path="url(#cend-'+kind+')">');
  for(var n=1;n<=7;n++){
    o.push('<ellipse cx="'+(x0+4)+'" cy="'+(yB-2)+'" rx="'+(n*(hard?7:10))+'" ry="'+(n*(hard?9:13))+'"'
      +' fill="none" stroke="'+g.ring+'" stroke-width="'+(hard?1:1.3)+'" opacity="'+(0.9-n*0.07)+'"'
      +' transform="rotate(-24 '+(x0+4)+' '+(yB-2)+')"/>');
  }
  o.push('</g>');
  o.push('<path d="'+ep+'" fill="none" stroke="rgba(70,45,20,.34)" stroke-width="1"/>');
  o.push('<path d="M'+x0+' '+yT+'L'+(x0+dx)+' '+(yT+dy)+'L'+(x1+dx)+' '+(yT+dy)+'L'+x1+' '+yT+'L'+x1+' '+yB+'L'+x0+' '+yB+'Z"'
    +' fill="none" stroke="rgba(70,45,20,.34)" stroke-width="1"/>');
  o.push('<line x1="'+x0+'" y1="'+yT+'" x2="'+x1+'" y2="'+yT+'" stroke="rgba(70,45,20,.22)"/>');
  o.push('</svg>');
  return o.join('');
}

function parts(){

/* what to buy — Store Zero resolves parent stock, SKU and material value */
function storeMaterialResolution(){
  if(materialIssue())return null;
  var contract=window.STBStoreHandoffContract;
  if(!contract||typeof contract.resolveStartOwnMaterial!=='function'){
    return {status:'UNRESOLVED',code:'STORE_RESOLVER_UNAVAILABLE',details:'Shared Store Zero material resolver is unavailable.'};
  }
  return contract.resolveStartOwnMaterial({
    sizeKey:S.size,
    parts:parts()
  });
}
function buyList(){
  var r=storeMaterialResolution();
  if(!r||r.status!=='MAPPED')return null;
  if(r.form==='sheet'){
    return {
      label:r.parentLabel,
      n:r.quantity,
      price:r.unitPrice,
      cost:r.materialTotal,
      storeSku:r.storeSku,
      supportedOps:(r.supportedOps||[]).slice(),
      cellFamily:(r.cellFamily||[]).slice(),
      source:r.source,
      storeResolution:r
    };
  }
  return {
    L:r.stockLengthIn,
    n:r.quantity,
    price:r.unitPrice,
    cost:r.materialTotal,
    cuts:(r.cuts||[]).map(function(row){return row.slice()}),
    left:(r.left||[]).slice(),

    storeSku:r.storeSku,
    supportedOps:(r.supportedOps||[]).slice(),
    cellFamily:(r.cellFamily||[]).slice(),

}

    }).join('')+'</div>';

  h+='<div class="step"><span class="n'+(S.maker?' done':'')+'">2</span><h2>Pick what you are making</h2>'
    +'<span class="sub">you can change it later</span></div>';
  h+='<div class="grid3">'+MAKERS.map(function(M){
      return '<button class="card'+(S.maker===M.k?' on':'')+'" data-maker="'+M.k+'">'+TICK
        +makerArt(M.k)+'<span class="body"><b>'+M.name+'</b><span>'+M.line+'</span></span></button>';
    }).join('')+'</div>';

  var sz=S_size(), mk=S.maker?MAKERS.filter(function(m){return m.k===S.maker})[0]:null;
  h+='<div class="gobar"><div class="sum">'
    +(mk?'<b>'+esc(mk.name)+'</b> in <b>'+esc(sz.label)+'</b>.'
        :'<b>'+esc(sz.label)+'</b> picked.')
    +'</div><button class="btn" id="go"'+((S.size)?'':' disabled')+'>Take it to the bench →</button></div>';
  h+='<p class="foot">Nothing is ordered here. Store Zero resolves the material basis as this definition changes; confirmation later identifies the version you send.</p>';
  $('app').innerHTML=h;
  $('projectlibrary').onclick=returnProjectLibrary;
  $('go').onclick=function(){ if(S.maker){ seed(); S.screen='bench'; render(); window.scrollTo(0,0) } };
}
function G_key(g){return g.k}

/* sensible starting numbers for the thing you chose */
function seed(){
  if(!S.maker||S.seeded[S.maker])return;
  var s=S_size();
  if(S.maker==='cuts'){
    S.cuts.pieces=[{len:isSheet()?24:32,wid:isSheet()?18:s.w,qty:2,status:{len:'checking',wid:'checking'}}];
  } else if(S.maker==='shelf'){
    S.shelf={w:30,h:36,n:4,depth:isSheet()?11.25:s.w,status:{w:'checking',h:'checking',depth:'checking'}};
  } else {
    S.box={l:18,w:12,h:isSheet()?5.5:s.w,status:{l:'checking',w:'checking',h:'checking'}};
  }
  S.seeded[S.maker]=true;
}

/* ═══════════════ 5 · THE BENCH — drawn in the wood you picked ═══════════════ */
function wface(x,y,w,h,k){
  if(w<=.2||h<=.2)return '';
  return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="url(#face-'+k+')"/>'
    +'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="url(#grain-'+k+')" opacity=".85"/>'
    +'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="none" stroke="rgba(70,45,20,.36)"/>';
}
function wedge(x,y,w,h,k){
  if(w<=.2||h<=.2)return '';
  return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+(isSheet()?'url(#ply-'+k+')':GRAIN[k].dark)+'"/>'
    +'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="none" stroke="rgba(70,45,20,.36)"/>';
}
function dimH(x1,x2,y,label,status){
  var m=(x1+x2)/2, w=(''+label).length*6.4+14;
  var dash='';
  label+=statusSuffix(status);
  return '<g class="dimline"><line x1="'+x1+'" y1="'+y+'" x2="'+x2+'" y2="'+y+'" stroke="var(--accent)" stroke-width="1" opacity=".55"'+dash+'/>'
    +'<path d="M'+x1+' '+(y-4)+'v8M'+x2+' '+(y-4)+'v8" stroke="var(--accent)" stroke-width="1" opacity=".55"'+dash+'/>'
    +'<rect x="'+(m-w/2)+'" y="'+(y-9)+'" width="'+w+'" height="18" rx="5" fill="var(--stage)"/>'
    +'<text x="'+m+'" y="'+(y+4.5)+'" text-anchor="middle" font-size="12" font-weight="600" fill="var(--accent)"'
    +' font-family="ui-sans-serif,sans-serif">'+label+'</text></g>';
}
function dimV(y1,y2,x,label,status){
  var m=(y1+y2)/2, w=(''+label).length*6.4+14;
  var dash='';
  label+=statusSuffix(status);
  return '<g class="dimline"><line x1="'+x+'" y1="'+y1+'" x2="'+x+'" y2="'+y2+'" stroke="var(--accent)" stroke-width="1" opacity=".55"'+dash+'/>'
    +'<path d="M'+(x-4)+' '+y1+'h8M'+(x-4)+' '+y2+'h8" stroke="var(--accent)" stroke-width="1" opacity=".55"'+dash+'/>'
    +'<rect x="'+(x-w/2)+'" y="'+(m-9)+'" width="'+w+'" height="18" rx="5" fill="var(--stage)"/>'
    +'<text x="'+x+'" y="'+(m+4.5)+'" text-anchor="middle" font-size="12" font-weight="600" fill="var(--accent)"'
    +' font-family="ui-sans-serif,sans-serif">'+label+'</text></g>';
}
function grip(key,x,y,vert,label){
  var w=vert?36:15, h=vert?15:36, a='var(--accent)';
  var ch = vert
    ? '<path d="M'+(x-4.5)+' '+(y-1.6)+'l4.5 -3.4l4.5 3.4M'+(x-4.5)+' '+(y+1.6)+'l4.5 3.4l4.5 -3.4"'
      +' stroke="'+a+'" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'
    : '<path d="M'+(x-1.6)+' '+(y-4.5)+'l-3.4 4.5l3.4 4.5M'+(x+1.6)+' '+(y-4.5)+'l3.4 4.5l-3.4 4.5"'
      +' stroke="'+a+'" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
  return '<g data-grab="'+key+'" tabindex="0" role="slider" aria-label="'+label+'">'
    +'<rect x="'+(x-(vert?24:16))+'" y="'+(y-(vert?16:24))+'" width="'+(vert?48:32)+'" height="'+(vert?32:48)+'" fill="rgba(0,0,0,0)"/>'
    +'<rect class="grip" x="'+(x-w/2)+'" y="'+(y-h/2)+'" width="'+w+'" height="'+h+'" rx="7.5"'
    +' fill="var(--surface)" stroke="'+a+'" stroke-width="2"'
    +' style="filter:drop-shadow(0 2px 4px rgba(90,55,25,.26))"/>'+ch+'</g>';
}

function drawCuts(){
  var s=S_size(), k=S.grade, sh=isSheet(), P=S.cuts.pieces, g=GRAIN[k];
  var vw=720, ML=34, MR=34, IW=vw-ML-MR;
  var maxLen=sh?96:Math.max.apply(null,(s.lengths||[96]));
  var b=buyList();
  var o=[], y, handled={};
  GEO={vw:vw,vh:0,handles:{}};

  /* which piece index a given length belongs to — so a handle can be put on it */
  function firstIndexOf(len){
    for(var i=0;i<P.length;i++)if(Math.abs(P[i].len-len)<.001&&!handled[i])return i;
    return -1;
  }
  function lenHandle(i){
    GEO.handles['len'+i]={axis:'x',o:0,s:1,min:1,max:maxLen,
      set:function(v){S.cuts.pieces[i].len=q4(v)}};
  }

  if(!sh){
    /* ── boards: draw the board you buy, with your pieces cut out of it ── */
    var L=b?b.L:maxLen, SC=IW/L, BH=clamp(s.w*18,58,108), gap=48;
    var rows=b?b.cuts:[P.map(function(p){return p.len})];
    y=66;
    o.push('<svg viewBox="0 0 '+vw+' 0" role="img" aria-label="your pieces, cut from the board">');
    o.push('<text x="'+ML+'" y="22" font-size="11" font-weight="700" letter-spacing=".09em"'
      +' fill="var(--ink3)" font-family="ui-sans-serif,sans-serif">'
      +(b?(b.n+' × '+esc(s.label)+' × '+L+' IN — WHAT YOUR PIECES COME OUT OF')
         :'NOTHING THIS LONG IS SOLD — SHORTEN IT')+'</text>');
    o[o.length-1]=o[o.length-1].replace('y="22"','y="20"');
    rows.forEach(function(row,r){
      var x=ML;
      /* the whole board, as a ghost, so the offcut is visible */
      o.push('<ellipse cx="'+(ML+IW/2)+'" cy="'+(y+BH+8)+'" rx="'+(IW/2)+'" ry="6" fill="url(#drop)" opacity=".6"/>');
      o.push('<rect x="'+ML+'" y="'+y+'" width="'+IW+'" height="'+BH+'" rx="2" fill="rgba(150,118,72,.10)"'
        +' stroke="var(--line2)" stroke-dasharray="4 4"/>');
      var tops=[];
      row.forEach(function(len,j){
        var w=len*SC;
        o.push(wface(x,y,w,BH,k));
        o.push(wedge(x,y-7,w,7,k));
        var pi=firstIndexOf(len), mine=x, mw=w;
        /* the saw line between pieces */
        if(j<row.length-1||(b&&b.left[r]>.01))
          tops.push('<line x1="'+(x+w)+'" y1="'+(y-11)+'" x2="'+(x+w)+'" y2="'+(y+BH+9)
            +'" stroke="var(--accent)" stroke-width="1" stroke-dasharray="2 3" opacity=".6"/>');
        if(pi>=0){
          handled[pi]=1; lenHandle(pi);
          GEO.handles['len'+pi].o=mine; GEO.handles['len'+pi].s=SC;
          tops.push('<text x="'+(mine+2)+'" y="'+(y-18)+'" font-size="10" font-weight="700" letter-spacing=".08em"'
            +' fill="var(--ink3)" font-family="ui-sans-serif,sans-serif">PIECE '+(pi+1)
            +(P[pi].qty>1?' · ×'+P[pi].qty:'')+'</text>');
          tops.push(dimH(mine,mine+mw,y+BH+28,fmt(len)+' in',getStatus('cuts.'+pi+'.len')));
          tops.push(grip('len'+pi,mine+mw,y+BH/2,false,'length of piece '+(pi+1)));
        } else if(w>56){
          tops.push('<text x="'+(x+w/2)+'" y="'+(y+BH/2+4.5)+'" text-anchor="middle" font-size="12.5"'
            +' font-weight="650" fill="rgba(60,38,16,.62)" font-family="ui-sans-serif,sans-serif">'
            +fmt(len)+' in</text>');
        }
        x+=w;
      });
      o.push(tops.join(''));
      if(b&&b.left[r]>.01){
        var lw=b.left[r]*SC;
        o.push('<text x="'+(x+lw/2)+'" y="'+(y+BH/2+4)+'" text-anchor="middle" font-size="11"'
          +' fill="var(--ink3)" font-family="ui-sans-serif,sans-serif">'
          +(lw>76?fmt(b.left[r])+' in left over':(lw>34?fmt(b.left[r])+' in':''))+'</text>');
      }
      y+=BH+gap;
    });
    y+=2;
  } else {
    /* ── sheets: draw the sheet you buy, with your rectangles laid on it ── */
    var pan=b?b.label.split(' × ').map(Number):[48,96];
    var PW=Math.max(pan[0],pan[1]), PH=Math.min(pan[0],pan[1]);   /* across, down */
    var SC2=Math.min(IW/PW,330/PH), py=52, SW=PW*SC2, SH=PH*SC2, SX=ML+(IW-SW)/2;
    o.push('<svg viewBox="0 0 '+vw+' 0" role="img" aria-label="your pieces, laid on the sheet">');
    o.push('<text x="'+ML+'" y="24" font-size="11" font-weight="700" letter-spacing=".09em"'
      +' fill="var(--ink3)" font-family="ui-sans-serif,sans-serif">'
      +(b?(b.n+' × '+esc(s.label)+' — '+PW+' × '+PH+' IN SHEET'):'IT WILL NOT FIT ON A SHEET')+'</text>');
    o.push('<ellipse cx="'+(SX+SW/2)+'" cy="'+(py+SH+10)+'" rx="'+(SW/2)+'" ry="7" fill="url(#drop)" opacity=".6"/>');
    o.push('<rect x="'+SX+'" y="'+py+'" width="'+SW+'" height="'+SH+'" rx="3"'
      +' fill="rgba(150,118,72,.10)" stroke="var(--line2)" stroke-dasharray="5 5"/>');
    var cx=SX, cy=py, rowH=0, tops2=[];
    P.forEach(function(p,i){
      for(var q=0;q<p.qty;q++){
        var w=Math.min(p.len,PW)*SC2, hh=Math.min(p.wid,PH)*SC2;
        if(cx+w>SX+SW+.5){ cx=SX; cy+=rowH; rowH=0 }
        if(cy+hh>py+SH+.5)return;
        o.push(wface(cx,cy,w,hh,k));
        if(q===0){
          (function(ix,ax,ay){
            GEO.handles['len'+ix]={axis:'x',o:ax,s:SC2,min:1,max:PW,set:function(v){S.cuts.pieces[ix].len=q4(v)}};
            GEO.handles['wid'+ix]={axis:'y',o:ay,s:SC2,min:1,max:PH,set:function(v){S.cuts.pieces[ix].wid=q4(v)}};
          })(i,cx,cy);
          tops2.push('<text x="'+(cx+w/2)+'" y="'+(cy+hh/2+4.5)+'" text-anchor="middle" font-size="12.5"'
            +' font-weight="650" fill="rgba(60,38,16,.68)" font-family="ui-sans-serif,sans-serif">'
            +fmt(p.len)+' × '+fmt(p.wid)+' in</text>');
          var checks=[];
          if(getStatus('cuts.'+i+'.len')==='checking')checks.push('length check');
          if(getStatus('cuts.'+i+'.wid')==='checking')checks.push('width check');
          if(checks.length)tops2.push('<text x="'+(cx+w/2)+'" y="'+(cy+hh/2+19)+'" text-anchor="middle" font-size="9.5"'
            +' font-weight="700" fill="var(--accent2)" font-family="ui-sans-serif,sans-serif">'+checks.join(' · ')+'</text>');
          tops2.push('<text x="'+(cx+3)+'" y="'+(cy-7)+'" font-size="10" font-weight="700" letter-spacing=".08em"'
            +' fill="var(--ink3)" font-family="ui-sans-serif,sans-serif">PIECE '+(i+1)
            +(p.qty>1?' · ×'+p.qty:'')+'</text>');
          tops2.push(grip('len'+i,cx+w,cy+hh/2,false,'width of piece '+(i+1)));
          tops2.push(grip('wid'+i,cx+w/2,cy+hh,true,'height of piece '+(i+1)));
        }
        cx+=w; rowH=Math.max(rowH,hh);
      }
    });
    o.push(tops2.join(''));
    o.push(dimH(SX,SX+SW,py+SH+30,PW+' in across','confirmed'));
    y=py+SH+52;
  }
  var vh=y+14;
  o[0]=o[0].replace('viewBox="0 0 '+vw+' 0"','viewBox="0 0 '+vw+' '+vh+'"');
  GEO.vh=vh;
  o.push('</svg>');
  return o.join('');
}

function drawShelf(){
  var s=S_size(), k=S.grade, t=s.t, W=S.shelf.w, H=S.shelf.h, n=S.shelf.n;
  /* frame the drawing instead of dropping it into a fixed box: fill the height,
     then cut the viewBox to suit, so a shelf is a big thing on the bench. */
  var MT=46, MB=76, SIDE=76, vh=520, VWMAX=940;
  var SC=(vh-MT-MB)/H;
  var vw=Math.max(W*SC+SIDE*2,vh*1.26);            /* never taller than it is wide-ish */
  if(vw>VWMAX){ SC=(VWMAX-SIDE*2)/W; vw=VWMAX }
  var x0=(vw-W*SC)/2, y0=MT+((vh-MT-MB)-H*SC), yb=y0+H*SC;
  GEO={vw:vw,vh:vh,handles:{
    w:{axis:'x',o:x0,s:SC,min:8,max:72,set:function(v){S.shelf.w=q4(v)}},
    h:{axis:'y',o:yb,s:-SC,min:8,max:84,set:function(v){S.shelf.h=q4(v)}}
  }};
  var o=['<svg viewBox="0 0 '+vw+' '+vh+'" role="img" aria-label="your shelf unit">'];
  o.push('<line x1="'+(x0-54)+'" y1="'+yb+'" x2="'+(x0+W*SC+54)+'" y2="'+yb+'" stroke="var(--line2)"/>');
  o.push('<ellipse cx="'+(x0+W*SC/2)+'" cy="'+(yb+8)+'" rx="'+(W*SC/2+10)+'" ry="7" fill="url(#drop)"/>');
  /* shelves first, so the sides read as standing in front of them */
  var inner=(H-n*t)*SC, gapPx=n>1?inner/(n-1):0;
  for(var i=0;i<n;i++){
    var sy=(n===1)?(yb-t*SC):(y0+i*(gapPx+t*SC));
    o.push(wface(x0+t*SC,sy,(W-2*t)*SC,t*SC,k));
  }
  o.push(wface(x0,y0,t*SC,H*SC,k));
  o.push(wface(x0+(W-t)*SC,y0,t*SC,H*SC,k));
  o.push(dimH(x0,x0+W*SC,yb+38,fmt(W)+' in wide',getStatus('shelf.w')));
  o.push(dimV(y0,yb,x0-38,fmt(H)+' in high',getStatus('shelf.h')));
  o.push('<text x="'+(x0+W*SC/2)+'" y="'+(y0-16)+'" text-anchor="middle" font-size="11.5" fill="var(--ink3)"'
    +' font-family="ui-sans-serif,sans-serif">'+n+' shelves · DEPTH '+fmt(depthOf())+' in'+statusSuffix(getStatus('shelf.depth'))+'</text>');
  o.push(grip('w',x0+W*SC,y0+H*SC/2,false,'width'));
  o.push(grip('h',x0+W*SC/2,y0,true,'height'));
  o.push('</svg>');
  return o.join('');
}

function drawBox(){
  var s=S_size(), k=S.grade, t=s.t, L=S.box.l, W=S.box.w, H=boxH();
  var MT=58, MB=84, SIDE=86, vh=430, VWMAX=940;
  var dxr=.46, dyr=.60;                        /* looking down into it, back goes up and right */
  var SC=(vh-MT-MB)/(H+W*dyr);
  var vw=Math.max((L+W*dxr)*SC+SIDE*2,vh*1.55);
  if(vw>VWMAX){ SC=(VWMAX-SIDE*2)/(L+W*dxr); vw=VWMAX }
  var x0=(vw-(L+W*dxr)*SC)/2, yb=MT+H*SC+W*dyr*SC;
  var dx=W*dxr*SC, dy=-W*dyr*SC, h=H*SC, l=L*SC, tp=t*SC;
  var rx=t*dxr*SC, ry=-t*dyr*SC;               /* one board thickness, along the back axis */
  GEO={vw:vw,vh:vh,handles:{
    l:{axis:'x',o:x0,s:SC,min:5,max:72,set:function(v){S.box.l=q4(v)}},
    w:{axis:'y',o:yb,s:-(dyr*SC),min:4,max:36,set:function(v){S.box.w=q4(v)}}
  }};
  var g=GRAIN[k], o=['<svg viewBox="0 0 '+vw+' '+vh+'" role="img" aria-label="your box">'];
  function quad(pts,fill,extra){
    return '<path d="M'+pts.map(function(p){return p[0]+' '+p[1]}).join('L')+'Z" fill="'+fill+'"'
      +(extra||' stroke="rgba(70,45,20,.30)"')+'/>';
  }
  var fy=yb-tp;                                /* top of the floor boards, at the front */
  o.push('<line x1="'+(x0-46)+'" y1="'+yb+'" x2="'+(x0+l+dx+46)+'" y2="'+yb+'" stroke="var(--line2)"/>');
  o.push('<ellipse cx="'+(x0+l/2+dx/2)+'" cy="'+(yb+9)+'" rx="'+(l/2+dx/2+14)+'" ry="8" fill="url(#drop)"/>');

  /* ── what you see through the opening ── */
  /* inside of the back wall */
  o.push(quad([[x0+dx,yb-h+dy],[x0+l+dx,yb-h+dy],[x0+l+dx,fy+dy],[x0+dx,fy+dy]],g.dark,' opacity=".85"'));
  /* inside of the left end */
  o.push(quad([[x0,yb-h],[x0+dx,yb-h+dy],[x0+dx,fy+dy],[x0,fy]],g.end,' opacity=".9"'));
  /* the floor, laid the long way */
  o.push(quad([[x0,fy],[x0+dx,fy+dy],[x0+l+dx,fy+dy],[x0+l,fy]],'url(#face-'+k+')',''));
  o.push(quad([[x0,fy],[x0+dx,fy+dy],[x0+l+dx,fy+dy],[x0+l,fy]],'rgba(60,38,16,.16)',''));
  for(var i=1;i<3;i++){
    var fq=i/3;
    o.push('<line x1="'+(x0+dx*fq)+'" y1="'+(fy+dy*fq)+'" x2="'+(x0+l+dx*fq)+'" y2="'+(fy+dy*fq)
      +'" stroke="'+g.line+'"/>');
  }

  /* ── the rims: the top edge of each board ── */
  o.push(quad([[x0+dx,yb-h+dy],[x0+l+dx,yb-h+dy],[x0+l+dx+rx,yb-h+dy+ry],[x0+dx+rx,yb-h+dy+ry]],g.top,''));
  o.push(quad([[x0,yb-h],[x0+dx,yb-h+dy],[x0+dx+tp,yb-h+dy],[x0+tp,yb-h]],g.top,''));

  /* ── the two boards facing you ── */
  /* right end, outside */
  o.push(quad([[x0+l,yb-h],[x0+l+dx,yb-h+dy],[x0+l+dx,yb+dy],[x0+l,yb]],g.f2,''));
  o.push(quad([[x0+l,yb-h],[x0+l+dx,yb-h+dy],[x0+l+dx,yb+dy],[x0+l,yb]],'rgba(0,0,0,.13)',''));
  o.push(quad([[x0+l-tp,yb-h],[x0+l,yb-h],[x0+l+dx,yb-h+dy],[x0+l-tp+dx,yb-h+dy]],g.top,''));
  /* front, outside — the board you would stand in front of */
  o.push(wface(x0,yb-h,l,h,k));
  o.push(quad([[x0,yb-h],[x0+l,yb-h],[x0+l+rx,yb-h+ry],[x0+rx,yb-h+ry]],g.top,''));

  o.push(dimH(x0,x0+l,yb+34,fmt(L)+' in long',getStatus('box.l')));
  o.push(dimV(yb-h,yb,x0-30,fmt(H)+' in high',getStatus('box.h')));
  o.push(dimV(yb-h+dy,yb-h,x0+l+dx+30,fmt(W)+' in deep',getStatus('box.w')));
  o.push(grip('l',x0+l,yb-h/2,false,'length'));
  o.push(grip('w',x0+l/2+dx/2,yb-h+dy,true,'depth'));
  o.push('</svg>');
  return o.join('');
}
function drawing(){
  return S.maker==='cuts'?(drawCuts()+angleDefinitionDrawing()):S.maker==='shelf'?drawShelf():drawBox();
}

/* ═══════════════ 6 · THE CONTROLS ═══════════════ */
function stepper(key,val,unit,step){
  return '<div class="stepper"><button data-step="'+key+':'+(-step)+'" aria-label="less">−</button>'
    +'<span class="v">'+fmt(val)+(unit?'<span style="font-weight:400;color:var(--ink3)"> '+unit+'</span>':'')+'</span>'
    +'<button data-step="'+key+':'+step+'" aria-label="more">+</button></div>';
}
function statusButton(key){
  var st=getStatus(key), label=st==='confirmed'?'CONFIRMED':'NEEDS CHECKING';

function angledCutDefinition(){
  if(!S.cutOps.angled)return null;
  return {
    kind:'ANGLED_CUT',
    angleDegrees:S.cutOps.angle,
    angleReference:S.cutOps.angleReference,
    cutPlane:S.cutOps.cutPlane,
    endIdentity:S.cutOps.endIdentity,
    endRelation:S.cutOps.endIdentity==='both'?S.cutOps.endRelation:null,
    lengthDatum:S.cutOps.lengthDatum
  };
}
function operationValidation(){
  var a=[];
  if(S.maker!=='cuts'||!S.cutOps.angled)return a;
  if(!(Number.isFinite(S.cutOps.angle)&&S.cutOps.angle>0&&S.cutOps.angle<90))a.push('Enter an angle between 0° and 90°.');
  if(!S.cutOps.angleReference)a.push('Choose what the angle is referenced to.');
  if(!S.cutOps.cutPlane)a.push('Choose miter across the face or bevel across the thickness.');
  if(!S.cutOps.endIdentity)a.push('Choose which end receives the angled cut.');
  if(S.cutOps.endIdentity==='both'&&!S.cutOps.endRelation)a.push('Say whether the two end cuts are parallel or opposed.');
  if(!S.cutOps.lengthDatum)a.push('Choose how finished length is read on the angled part.');
  return a;
}
function operationLabel(v){
  var map={
    'off-square':'DEGREES OFF SQUARE',
    'source-stated':'SOURCE-STATED ANGLE',
    'miter-face':'MITER / ACROSS FACE',
    'bevel-thickness':'BEVEL / ACROSS THICKNESS',
    'first':'FIRST END','second':'SECOND END','both':'BOTH ENDS',
    'parallel':'PARALLEL / SAME DIRECTION','opposed':'OPPOSED / NON-PARALLEL',
    'long-long':'LONG POINT → LONG POINT','long-short':'LONG POINT → SHORT POINT',
    'source-length':'SOURCE CUT-LIST LENGTH / STATED EDGE DATUM'
  };
  return map[v]||v||'NOT SET';
}

function operationModel(){
  var list=parts(), issue=materialIssue(), sh=isSheet(), s=S_size(), ops=[];
  list.forEach(function(p){
    if(sh){
      ops.push({part:p.name,qty:p.qty,op:'SHEET RECTANGLE CUT',detail:fmt(p.len)+' × '+fmt(p.wid)+' in rectangle'});
    }else if(S.maker==='cuts'){
      ops.push({part:p.name,qty:p.qty,op:'STRAIGHT CUT',detail:fmt(p.len)+' in finished length · square / 90° to reference face · '+fmt(s.w)+' in stock width'});
      if(S.cutOps.angled){
        var a=angledCutDefinition(), incomplete=operationValidation().length>0;
        ops.push({part:p.name,qty:p.qty,op:'ANGLED CUT',
          detail:(Number.isFinite(a.angleDegrees)?a.angleDegrees+'°':'angle not set')+' · '+operationLabel(a.angleReference)+' · '+operationLabel(a.cutPlane)+' · '+operationLabel(a.endIdentity)+(a.endIdentity==='both'?' · '+operationLabel(a.endRelation):'')+' · '+operationLabel(a.lengthDatum),
          unresolved:incomplete});
      }
    }else{
      ops.push({part:p.name,qty:p.qty,op:'CUT TO LENGTH',detail:fmt(p.len)+' in length · '+fmt(s.w)+' in stock width'});
    }
  });
  if(issue)ops.push({part:'Material / capability',qty:null,op:'MATERIAL / OPERATION RESOLUTION REQUIRED',
    detail:issue.detail+' Unknown stays unknown; no joining or width-forming method is assumed.',unresolved:true});
  return ops;
}

}
function currentStoreAuthority(){

  return contract&&typeof contract.storeAuthority==='function'?contract.storeAuthority('startOwn'):null;
}
function requiredStoreOps(){
  var ops=[];
  function add(op){if(ops.indexOf(op)<0)ops.push(op)}
  if(isSheet()){
    add('CROSSCUT');
    add('RIP');
  }else{
    add('CROSSCUT');
    if(S.maker==='cuts'&&S.cutOps.angled)add('MITER_LIMITED');
  }
  return ops;
}
function storeCapabilityModel(){
  var issue=materialIssue(), resolution=storeMaterialResolution(), b=buyList(), unresolved=[], status='SUPPORTABLE';
  var required=requiredStoreOps(), supported=b?(b.supportedOps||[]):[], missing=[];
  if(issue){
    status='UNRESOLVED';
    unresolved.push('MATERIAL_FORMATION_UNRESOLVED');
  }else if(!resolution||resolution.status!=='MAPPED'){
    status='REFUSED';
    unresolved.push(resolution&&resolution.code?resolution.code:'STORE_MATERIAL_RESOLUTION_UNAVAILABLE');
  }else{
    missing=required.filter(function(op){return supported.indexOf(op)<0});
    if(missing.length){
      status='REFUSED';
      missing.forEach(function(op){unresolved.push('STORE_OFFERING_MISSING_OPERATION:'+op)});
    }
  }
  if(S.maker==='cuts'&&S.cutOps.angled){
    if(operationValidation().length){
      status='UNRESOLVED';
      unresolved.push('ANGLED_CUT_DEFINITION_INCOMPLETE');
    }else if(status!=='REFUSED'){
      status='UNRESOLVED';
      unresolved.push('MITER_RANGE_NOT_PUBLISHED');
      unresolved.push('START-OWN-ANGLED-PROCESS-ECONOMICS-NOT-PUBLISHED');
    }
  }
  return {
    status:status,
    requiredOps:required,
    supportedOps:supported.slice(),
    missingOps:missing,
    unresolved:Array.from(new Set(unresolved)),
    basis:'PINNED_STORE_ZERO_OFFERING',
    materialResolution:resolution,
    authority:currentStoreAuthority()
  };
}
function modeledWorkModel(){
  var known=operationModel().filter(function(o){return !o.unresolved}), count=0, cap=storeCapabilityModel();
  known.forEach(function(o){count+=o.qty||0});
  return {
    knownPartOperations:count,
    machineTime:null,
    cycleTimeBasis:null,
    capabilityStatus:cap.status,
    unresolved:cap.unresolved,
    authority:cap.authority,
    materialResolution:cap.materialResolution,
    storeSku:cap.materialResolution&&cap.materialResolution.status==='MAPPED'?cap.materialResolution.storeSku:null,
    catalogSource:cap.materialResolution&&cap.materialResolution.source?cap.materialResolution.source:null,
    issue:materialIssue()
  };
}

function workSpecies(){

    var k=String(S.size||'');
    if(k.indexOf('c')>=0) return 'cherry';
    return 'oak';
  }
  return 'pine';
}
function workQuote(){
  var b=buyList(), contract=window.STBStoreHandoffContract;
  if(!b||!contract||typeof contract.quoteModeledRecovery!=='function') return null;
  return contract.quoteModeledRecovery({
    species:workSpecies(),
    sticks:b.n,
    millMinutes:0,
    material:b.cost,
    hardware:0
  });
}
function referenceCostModel(){
  var issue=materialIssue(), resolution=storeMaterialResolution(), b=buyList(), authority=currentStoreAuthority(), cap=storeCapabilityModel(), work=workQuote();
  var material=(issue||!b)?null:b.cost;
  var unresolved=cap.unresolved.slice();
  var economicsStatus=authority?authority.economicsStatus:'STORE_AUTHORITY_UNAVAILABLE';
  if(!authority){
    unresolved.push('STORE_AUTHORITY_UNAVAILABLE');
  }
  if(!resolution||resolution.status!=='MAPPED'){
    unresolved.push(resolution&&resolution.code?resolution.code:'STORE_MATERIAL_RESOLUTION_UNAVAILABLE');
  }
  if(authority&&authority.economicsModel==null){
    unresolved.push('START-OWN-CLASS-SCOPED-RECOVERY-NOT-PUBLISHED');
  }
  return {
    material:material,
    operations:work?work.recovery:null,
    cell:work?work.cellConsumption:null,
    other:work?work.otherMinutes:null,
    total:work&&material!=null?work.total:null,
    materialOnlyTotal:material,
    work:work,
    materialResolution:resolution,
    issue:issue,
    complete:!!(work&&work.complete&&material!=null),
    capabilityStatus:cap.status,
    economicsStatus:economicsStatus,
    unresolvedConditions:Array.from(new Set(unresolved)),
    authority:authority
  };
}

function customerDefinition(){
  var d={grade:S.grade,size:S.size,maker:S.maker};
  if(S.maker==='cuts'){
    d.pieces=S.cuts.pieces.map(function(p){return {len:p.len,wid:isSheet()?p.wid:null,qty:p.qty,status:{len:p.status.len,wid:p.status.wid}}});
    d.operations=isSheet()
      ?[{kind:'SHEET_RECTANGLE_CUT'}]
      :[{kind:'STRAIGHT_CUT',endCondition:'square',angleDegrees:0,angleReference:'square-to-reference-face'}].concat(S.cutOps.angled?[angledCutDefinition()]:[]);
  }else if(S.maker==='shelf')d.project={w:S.shelf.w,h:S.shelf.h,depth:S.shelf.depth,n:S.shelf.n,status:{w:S.shelf.status.w,h:S.shelf.status.h,depth:S.shelf.status.depth}};
  else d.project={l:S.box.l,w:S.box.w,h:S.box.h,status:{l:S.box.status.l,w:S.box.status.w,h:S.box.status.h}};
  return d;
}
function fnv1a(str){
  var h=0x811c9dc5;
  for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)}
  return ('00000000'+(h>>>0).toString(16)).slice(-8).toUpperCase();
}

function boundsFor(path){
  var p=path.split('.');
  if(p[0]==='cuts')return p[2]==='qty'?[1,24]:[1,96];
  if(p[0]==='shelf'){
    if(p[1]==='n')return [2,8];
    if(p[1]==='depth')return [4,24];
    return [8,84];
  }
  if(p[0]==='box'){
    if(p[1]==='h')return [2,24];
    if(p[1]==='w')return [4,36];
    return [5,72];
  }
  return [-Infinity,Infinity];
}
function setPath(path,v){
  var p=path.split('.'), b=boundsFor(path);
  if(p[0]==='cuts'){ var pc=S.cuts.pieces[+p[1]];
    if(p[2]==='qty')pc.qty=clamp(Math.round(v),b[0],b[1]); else pc[p[2]]=clamp(v,b[0],b[1]); return }
  if(p[0]==='shelf'){ if(p[1]==='n')S.shelf.n=clamp(Math.round(v),b[0],b[1]);
    else S.shelf[p[1]]=clamp(v,b[0],b[1]); return }
  if(p[0]==='box')S.box[p[1]]=clamp(v,b[0],b[1]);
}
function parseDimension(raw){
  var x=(''+raw).trim().toLowerCase().replace(/\s*(?:in|inch|inches)\s*$/,'').trim();
  if(!x)return null;
  var m;
  if(/^\d+(?:\.\d+)?$/.test(x))return +x;
  m=x.match(/^(\d+)\s+(\d+)\/(\d+)$/);
  if(!m)m=x.match(/^(\d+)-(\d+)\/(\d+)$/);
  if(m){var d=+m[3];return d?(+m[1]+(+m[2]/d)):null}
  m=x.match(/^(\d+)\/(\d+)$/);
  if(m){var d2=+m[2];return d2?(+m[1]/d2):null}
  return null;
}
function parseInteger(raw){
  var x=(''+raw).trim();
  return /^\d+$/.test(x)?+x:null;
}
function commitExact(el){
  var path=el.getAttribute('data-exact'), kind=el.getAttribute('data-exact-kind');
  if(!path)return;
  var v=kind==='int'?parseInteger(el.value):parseDimension(el.value), b=boundsFor(path);
  if(v==null||!isFinite(v)||v<b[0]||v>b[1]||(kind==='int'&&Math.round(v)!==v)){
    el.classList.add('invalid'); el.setAttribute('aria-invalid','true');
    flash(kind==='int'?'Use a whole number in range':'Use a number like 13 3/4');
    return;
  }
  setPath(path,v);
  el.classList.remove('invalid'); el.removeAttribute('aria-invalid');
  render();
}
function getPath(path){
  var p=path.split('.');
  if(p[0]==='cuts')return S.cuts.pieces[+p[1]][p[2]];
  if(p[0]==='shelf')return p[1]==='depth'?depthOf():S.shelf[p[1]];
  return p[1]==='h'?boxH():S.box[p[1]];
}
function svgRect(){var sv=$('stage')?$('stage').querySelector('svg'):null;
  return sv&&sv.getBoundingClientRect?sv.getBoundingClientRect():null}
function applyDrag(cx,cy){
  if(!grab||!GEO)return; var H=GEO.handles[grab]; if(!H)return;
  var r=svgRect(); if(!r||!r.width)return;
  var v;
  if(H.axis==='x') v=((cx-r.left)*(GEO.vw/r.width)-H.o)/H.s;
  else             v=((cy-r.top)*(GEO.vh/r.height)-H.o)/H.s;
  H.set(clamp(q4(v),H.min,H.max));
  refreshBenchViews();
  var el=document.querySelector('[data-grab="'+grab+'"]'); if(el&&el.focus)el.focus();
}

  else if(t.dataset.opSet){

    render();
  }
  else if(t.dataset.grade){

  else if(t.dataset.maker){ S.maker=t.dataset.maker; render(); }
  else if(t.dataset.step){ var a=t.dataset.step.split(':'); setPath(a[0],getPath(a[0])+ +a[1]); render(); }

  else if(t.dataset.add==='piece'){
    var last=S.cuts.pieces[S.cuts.pieces.length-1];
    S.cuts.pieces.push({len:last.len,wid:isSheet()?last.wid:S_size().w,qty:1,status:{len:'checking',wid:'checking'}}); render();
  }
  else if(t.dataset.drop!=null){ S.cuts.pieces.splice(+t.dataset.drop,1); render(); }
});
function flash(msg){
  var f=$('flash'); f.textContent=msg; f.classList.add('show');
  clearTimeout(flash._t); flash._t=setTimeout(function(){f.classList.remove('show')},1700);
}
render();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan-to-Build · Outdoor Build · Bench leg 0.1</title>
<meta name="description" content="Enter a bounded outdoor project, find the bench leg, carry the facts the source legitimately established, and resolve only what is genuinely missing.">
<style>
:root{
  --paper:#F5F0E6; --paper2:#FBF7EF; --surface:#FFFDF8; --stage:#EFE7D8;
  --ink:#2A1E13; --ink2:#6E5C48; --ink3:#9C8A75;
  --line:#E7DCC9; --line2:#D5C5A9;
  --accent:#A85A2A; --accent2:#8A4520; --tint:#F7E9D6;
  --good:#5C7A45; --goodtint:#EDF1E4;
  --warn:#8A5A20; --warntint:#F6EBDA;
  --src:#3C6E71; --srctint:#E4EEEE;
  --shadow:0 1px 2px rgba(60,40,20,.05),0 8px 24px -12px rgba(60,40,20,.18);
  --lift:0 2px 4px rgba(60,40,20,.06),0 18px 40px -16px rgba(60,40,20,.28);
  --r:16px;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#14110D; --paper2:#1A1612; --surface:#211C16; --stage:#241E17;
    --ink:#F4EDE1; --ink2:#BDAC97; --ink3:#8B7B68;
    --line:#332B21; --line2:#4A3E2F;
    --accent:#E09A5F; --accent2:#F2B47C; --tint:#2B2118;
    --good:#8FB06B; --goodtint:#1E2418;
    --warn:#D9A362; --warntint:#2A2118;
    --src:#6FB2B5; --srctint:#16201F;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
    --lift:0 2px 6px rgba(0,0,0,.5),0 22px 46px -18px rgba(0,0,0,.85);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font:16px/1.6 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  background-image:radial-gradient(1100px 520px at 10% -10%,rgba(60,110,113,.06),transparent 60%),
                   radial-gradient(900px 440px at 94% 2%,rgba(120,90,50,.05),transparent 62%);
  background-attachment:fixed}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1140px;margin:0 auto;padding:24px 22px 76px}

/* rail */
.rail{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 22px}
.rail .back{font-size:13.5px;color:var(--ink2);background:none;border:0;cursor:pointer;
  padding:7px 11px;border-radius:9px;font-weight:600;transition:.15s}
.rail .back:hover{background:var(--surface);color:var(--ink)}
.rail .back:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rail .who{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:5px 11px;border-radius:999px;border:1px solid var(--src);color:var(--src);background:var(--srctint)}
.rail .steps{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap}
.rail .s{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink3);
  border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px 4px 5px}
.rail .s i{width:18px;height:18px;border-radius:50%;background:var(--line);color:var(--surface);
  font-style:normal;font-size:10.5px;font-weight:700;display:grid;place-items:center;line-height:1}
.rail .s.on{border-color:var(--src);color:var(--src);background:var(--srctint);font-weight:650}
.rail .s.on i{background:var(--src);color:#fff}
.rail .s.done i{background:var(--good);color:#fff}
@media (prefers-color-scheme:dark){.rail .s.on i,.rail .s.done i{color:#0e1614}}

.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin:0 0 14px}
h1{font-size:clamp(27px,4.2vw,40px);line-height:1.07;letter-spacing:-.025em;margin:0 0 12px;font-weight:640}
h1 em{font-style:normal;color:var(--src)}
h1 .q{color:var(--ink3);font-weight:400}
.lede{font-size:clamp(15.5px,1.8vw,18px);line-height:1.55;color:var(--ink2);max-width:60ch;margin:0}
.lede b{color:var(--ink);font-weight:650}
.crumb{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12.5px;color:var(--ink3);margin:0 0 18px}
.crumb b{color:var(--ink2);font-weight:650}
.crumb .sep{color:var(--line2)}
.crumb .here{color:var(--src);font-weight:700}
.step{display:flex;align-items:center;gap:12px;margin:32px 0 14px}
.step .n{width:26px;height:26px;flex:none;border-radius:50%;background:var(--src);color:#fff;
  font-size:12.5px;font-weight:700;display:grid;place-items:center;line-height:1}
.step h2{font-size:19px;letter-spacing:-.014em;margin:0;font-weight:650}
@media (prefers-color-scheme:dark){.step .n{color:#0e1614}}

/* cards */
.grid3,.grid2{display:grid;gap:15px}
.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{position:relative;display:block;width:100%;text-align:left;cursor:pointer;padding:0;font:inherit;color:inherit;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);
  transition:transform .2s cubic-bezier(.2,.7,.3,1),box-shadow .2s,border-color .2s}
.card:hover{transform:translateY(-3px);box-shadow:var(--lift);border-color:var(--line2)}
.card:focus-visible{outline:2px solid var(--src);outline-offset:3px}
.card.on{border-color:var(--src);box-shadow:var(--lift),inset 0 0 0 1px var(--src)}
.card.ghost{opacity:.62;cursor:not-allowed}
.card.ghost:hover{transform:none;box-shadow:var(--shadow);border-color:var(--line)}
.card .pic{display:block;width:100%;height:auto;background:linear-gradient(170deg,var(--paper2),var(--stage))}
.card .body{padding:13px 15px 15px}
.card .body b{display:block;font-size:16px;font-weight:650;letter-spacing:-.012em;margin-bottom:3px}
.card .body span{display:block;font-size:13px;line-height:1.45;color:var(--ink3)}
.card .tick{position:absolute;top:11px;right:11px;width:26px;height:26px;border-radius:50%;
  background:var(--src);display:none;place-items:center;box-shadow:0 2px 9px -2px rgba(0,0,0,.4)}
.card.on .tick{display:grid}
.card .tick svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-color-scheme:dark){.card .tick svg{stroke:#0e1614}}
.card .flag{position:absolute;top:11px;left:11px;font-size:10px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;padding:5px 9px;border-radius:999px;background:var(--surface);
  border:1px solid var(--line2);color:var(--ink3)}
.card .flag.active{border-color:var(--src);color:var(--src);background:var(--srctint)}
.card .flag.future{border-color:var(--line2);color:var(--ink3)}

/* buttons */
.btn{font:inherit;font-size:15px;font-weight:650;padding:12px 24px;border-radius:12px;cursor:pointer;
  border:1px solid var(--src);background:var(--src);color:#fff;min-height:46px;
  box-shadow:0 2px 10px -2px rgba(60,110,113,.5);transition:.16s}
.btn:hover{filter:brightness(1.07);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:focus-visible{outline:2px solid var(--src);outline-offset:2px}
.btn:disabled{background:var(--surface);color:var(--ink3);border-color:var(--line);box-shadow:none;cursor:not-allowed;transform:none;filter:none}
@media (prefers-color-scheme:dark){.btn{color:#0e1614}}
.btn.warm{border-color:var(--accent);background:var(--accent);box-shadow:0 2px 10px -2px rgba(168,90,42,.5)}
@media (prefers-color-scheme:dark){.btn.warm{color:#1a1208}}
.btn.ghost{background:transparent;color:var(--ink2);border-color:var(--line);box-shadow:none;font-weight:550}
.btn.ghost:hover{border-color:var(--line2);color:var(--ink);filter:none}
.btn.sm{font-size:13.5px;padding:9px 16px;border-radius:10px;min-height:40px}
.gobar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:30px 0 0;padding:17px 19px;
  border-radius:var(--r);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.gobar .sum{flex:1;min-width:230px;font-size:14px;color:var(--ink2)}
.gobar .sum strong{display:block;color:var(--ink);font-weight:650;font-size:15.5px;margin-bottom:2px}

/* bench / panels */
.bench{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.stage{background:var(--stage);border:1px solid var(--line);border-radius:var(--r);padding:14px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35);overflow:hidden}
@media (prefers-color-scheme:dark){.stage{box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}}
.stage svg{width:100%;display:block}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;margin:0 0 14px;box-shadow:var(--shadow)}
.panel h3{font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--ink3);margin:0 0 12px;
  display:flex;align-items:center;gap:8px}
.panel h3 .badge{margin-left:auto;font-size:9.5px;letter-spacing:.06em;padding:3px 7px;border-radius:5px;
  border:1px solid var(--line2);color:var(--ink3);font-weight:700}
.panel h3 .badge.src{border-color:var(--src);color:var(--src);background:var(--srctint)}
.panel h3 .badge.open{border-color:var(--warn);color:var(--warn);background:var(--warntint)}
.panel h3 .badge.ok{border-color:var(--good);color:var(--good);background:var(--goodtint)}
.panel .cat{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;margin:14px 0 8px;
  display:flex;align-items:center;gap:8px}
.panel .cat:first-of-type{margin-top:0}
.panel .cat.src{color:var(--src)} .panel .cat.user{color:var(--accent2)} .panel .cat.open{color:var(--warn)}
.panel .cat .ln{flex:1;height:1px;background:currentColor;opacity:.25}
.dim{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.dim .lab{flex:1;min-width:0;font-size:14px}
.dim .lab i{display:block;font-style:normal;font-size:11.5px;color:var(--ink3);margin-top:1px}
.stepper{display:inline-flex;align-items:center;gap:2px;background:var(--paper2);border:1px solid var(--line);border-radius:10px;padding:3px}
.stepper button{width:34px;height:34px;border:0;background:transparent;color:var(--ink2);cursor:pointer;
  font-size:17px;line-height:1;border-radius:7px;transition:.13s;font-family:inherit}
.stepper button:hover{background:var(--surface);color:var(--src)}
.stepper button:focus-visible{outline:2px solid var(--src);outline-offset:1px}
.stepper .v{min-width:70px;text-align:center;font-size:14px;font-weight:650;font-variant-numeric:tabular-nums}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0 0}
.pill{font:inherit;font-size:12.5px;padding:8px 11px;min-height:40px;border-radius:9px;cursor:pointer;
  border:1px solid var(--line);background:var(--paper2);color:var(--ink2);transition:.13s}
.pill:hover{border-color:var(--line2);color:var(--ink)}
.pill:focus-visible{outline:2px solid var(--src);outline-offset:1px}
.pill.on{border-color:var(--src);background:var(--srctint);color:var(--src);font-weight:650}
.exact input{width:100%;max-width:180px;font:inherit;font-size:13.5px;font-variant-numeric:tabular-nums;
  padding:10px;border:1px solid var(--line2);border-radius:9px;background:var(--paper2);color:var(--ink);min-height:42px}
.exact input:focus{border-color:var(--src);outline:none;box-shadow:0 0 0 2px var(--srctint)}
.tools{display:flex;gap:7px;flex-wrap:wrap;margin:0}
.tool{flex:1;min-width:104px;border:1px solid var(--line);background:var(--paper2);border-radius:11px;
  padding:9px 8px 10px;cursor:pointer;color:var(--ink2);text-align:center;transition:.14s}
.tool:hover{border-color:var(--line2);color:var(--ink)}
.tool:focus-visible{outline:2px solid var(--src);outline-offset:1px}
.tool.on{border-color:var(--src);background:var(--srctint);color:var(--src)}
.tool svg{display:block;width:100%;height:auto;margin-bottom:5px}
.tool b{display:block;font-size:12.5px;font-weight:650}
.tool i{display:block;font-style:normal;font-size:10.5px;color:var(--ink3);margin-top:1px}
.tool.on i{color:var(--src)}
.hint{font-size:12.5px;line-height:1.55;color:var(--ink3);margin:9px 0 0}
.hint b{color:var(--ink2)}
.note{margin:13px 0 0;padding:12px 14px;border:1px dashed var(--line2);border-radius:12px;background:var(--paper2);
  font-size:13px;line-height:1.55;color:var(--ink2)}
.note b{color:var(--ink)}
.note.warn{border-style:solid;border-color:var(--warn);background:var(--warntint)}
.note.good{border-style:solid;border-color:var(--good);background:var(--goodtint)}
.note.src{border-style:solid;border-color:var(--src);background:var(--srctint)}

/* source dossier */
.dossier{margin:0 0 16px;padding:15px 17px;border-radius:13px;border:1px solid var(--src);background:var(--srctint)}
.dossier .t{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--src);margin:0 0 8px;
  display:flex;align-items:center;gap:8px}
.dossier ul{margin:0;padding:0;list-style:none;display:grid;gap:5px 18px;grid-template-columns:1fr 1fr;font-size:13px}
.dossier li{color:var(--ink2)}
.dossier li b{color:var(--ink);font-weight:650;font-variant-numeric:tabular-nums}
.dossier .links{margin:10px 0 0;font-size:12px}
.dossier .links a{color:var(--src);font-weight:600;text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:1px}
.dossier .links a:hover{opacity:.8}
.dossier .why{margin:9px 0 0;font-size:12px;color:var(--ink3)}
@media (max-width:560px){.dossier ul{grid-template-columns:1fr}}

/* definition / provenance */
.defrow{display:flex;align-items:flex-start;gap:8px 10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;flex-wrap:wrap}
.defrow:last-child{border-bottom:0}
.defrow .k{flex:none;width:120px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);padding-top:2px}
.defrow .v{flex:1 1 110px;min-width:0;font-weight:600}
.defrow .v i{display:block;font-style:normal;font-size:11.5px;font-weight:400;color:var(--ink3);margin-top:1px}
.defrow .v.open{color:var(--warn)}
.prov{flex:none;margin-left:auto;font-size:9px;font-weight:700;letter-spacing:.04em;padding:3px 7px;border-radius:5px;
  border:1px solid var(--line2);color:var(--ink3);background:var(--surface);white-space:nowrap;margin-top:1px}
.prov.src{border-color:var(--src);color:var(--src);background:var(--srctint)}
.prov.derived{border-color:var(--src);color:var(--src);background:var(--srctint);opacity:.85}
.prov.user{border-color:var(--accent);color:var(--accent2);background:var(--tint)}
.prov.evidence{border-color:var(--good);color:var(--good);background:var(--goodtint)}
.prov.declared{border-color:var(--accent);color:var(--accent2);background:var(--tint)}
.prov.open{border-color:var(--warn);color:var(--warn);background:var(--warntint)}
.ops{margin:0;padding:0 0 0 20px;font-size:13px;line-height:1.75;color:var(--ink2)}
.ops li::marker{color:var(--ink3);font-variant-numeric:tabular-nums}

/* contract */
.object{margin:0;padding:20px 22px;border-radius:var(--r);border:1px solid var(--line2);background:var(--surface);box-shadow:var(--lift)}
.object .eye{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin:0 0 7px}
.object h2{margin:0 0 5px;font-size:25px;letter-spacing:-.02em;font-weight:650}
.object .idline{font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--src);margin:0 0 16px}
.fold{margin:15px 0 0;border:1px solid var(--line);border-radius:12px;background:var(--paper2);overflow:hidden}
.fold summary{cursor:pointer;list-style:none;padding:12px 14px;font-size:13.5px;font-weight:650;color:var(--ink2);
  display:flex;align-items:center;gap:9px}
.fold summary::-webkit-details-marker{display:none}
.fold summary:before{content:"";width:7px;height:7px;border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);
  transform:rotate(-45deg);transition:transform .18s;flex:none;margin-left:2px}
.fold[open] summary:before{transform:rotate(45deg)}
.fold .in{padding:0 14px 14px;font-size:12.5px;line-height:1.65;color:var(--ink2)}
pre.spec{margin:0;padding:14px 15px;border-radius:10px;background:var(--surface);border:1px solid var(--line);
  font:11.5px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink2);white-space:pre-wrap;max-height:340px;overflow:auto}
.flash{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(8px);opacity:0;
  background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:999px;font-size:14px;font-weight:600;
  pointer-events:none;transition:.22s;z-index:50}
.flash.show{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{margin:46px 0 0;font-size:12px;line-height:1.7;color:var(--ink3);max-width:76ch}
.foot b{color:var(--ink2)}
@media (max-width:980px){.bench,.grid3,.grid2{grid-template-columns:1fr}}
@media (max-width:560px){.wrap{padding:18px 14px 56px}.defrow{flex-wrap:wrap}.defrow .k{width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="flash" id="flash"></div>
<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════════
   SCAN-TO-BUILD · OUTDOOR BUILD · BENCH LEG 0.1

   projectId        outdoor
   displayName      Outdoor Build
   projectClass     BOUNDED_SOURCE_BACKED
   confirmation     STB_OUTDOOR_CONFIRMED
   Store adapter    review-store-handoff/0.5  (host-owned; NOT the Start Own path)

   The other end of Scan-to-Build. The customer enters a bounded project where a
   source has already established legitimate facts, isolates one real part, and
   resolves only what is genuinely missing. Provenance here is layered:
   SOURCE-BACKED, USER-DEFINED MODIFICATION, DERIVED FROM SOURCE + USER CHANGE,
   USER / REVIEWED EVIDENCE CONFIRMATION, USER-DECLARED — never flattened.

   HARD TRUTH LIMITS at this checkpoint. The bounded outdoor source establishes:
   nominal 2×4 · 15.5 in reference length · 10° · both ends · outdoor-bench
   context. It does NOT establish: cut-plane orientation (face-miter vs
   thickness-bevel) · finished-length datum · quantity. Those are left
   UNRESOLVED and require explicit resolution. Nothing is filled from memory,
   from woodworking convention, or from any older contaminated assertion (no
   2×8 / 32¾ in / 30° A-frame table leg; no assumed double-bevel; no assumed
   long-long datum; no assumed quantity).

   This child does NOT use the live Start Own Store preview path. It emits
   STB_PROJECT_DEFINITION_CHANGED (projectId "outdoor") and confirms with
   STB_OUTDOOR_CONFIRMED; the System host persists the confirmed snapshot and
   owns canonical identity + any Store evaluation. NO BLOOD ON WOOD.
   ═══════════════════════════════════════════════════════════════════════════ */

var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function q4(v){return Math.round(v*4)/4}
function fmt(v){
  if(v==null||!isFinite(v))return '—';
  var n=Math.abs(v)<1e-10?0:v, n32=Math.round(n*32)/32;
  if(Math.abs(n-n32)<1e-8){
    var sg=n32<0?'-':'', a=Math.abs(n32), w=Math.floor(a), e=Math.round((a-w)*32), d=32;
    if(e===0)return sg+w;
    if(e===32)return sg+(w+1);
    while(e%2===0){e/=2;d/=2}
    return sg+(w?w+' ':'')+e+'/'+d;
  }
  return String(Math.round(n*10000)/10000);
}
function hash32(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}
  return ('00000000'+(h>>>0).toString(16).toUpperCase()).slice(-8)}
function parseDim(raw){
  var x=(''+raw).trim().toLowerCase().replace(/\s*(?:in|inch|inches|deg|degrees|°|")\s*$/,'').trim();
  if(!x)return null;
  if(/^\d+(?:\.\d+)?$/.test(x))return +x;
  var m=x.match(/^(\d+)\s+(\d+)\/(\d+)$/)||x.match(/^(\d+)-(\d+)\/(\d+)$/);
  if(m){var d=+m[3];return d?(+m[1]+(+m[2]/d)):null}
  m=x.match(/^(\d+)\/(\d+)$/);
  if(m){var d2=+m[2];return d2?(+m[1]/d2):null}
  return null;
}
function near(v){return fmt(Math.round(v*16)/16)}

  clearTimeout(flash._t);flash._t=setTimeout(function(){f.classList.remove('show')},1800)}

/* ═══════════ 5 · CARRY THE SOURCE ═══════════
   When the leg is isolated, carry ONLY what the source establishes, tagged with
   the correct provenance. Everything the source does not establish stays null
   and UNRESOLVED. The customer change is applied as a modification; the target
   length is derived from source + change. */
function loadLeg(){
  if(S.legLoaded)return;
  S.P=blankPart(); S.prov={}; S.ops=[];
  /* source-backed physical facts */
  setFact('sizeKey',SOURCE.sizeKey,'src','Carried by source · nominal '+stk(SOURCE.sizeKey).label);
  setFact('angleDeg',SOURCE.angleDeg,'src','Carried by source · '+fmt(SOURCE.angleDeg)+'° off square');
  setFact('endIdentity',SOURCE.endIdentity,'src','Carried by source · both ends cut');
  /* derived length: reference + user change */
  setFact('finishedLengthIn',targetLen(),'derived',
    'Reference '+fmt(SOURCE.referenceLengthIn)+' in (source) + '+fmt(S.intent.delta)+' in (user) = '+fmt(targetLen())+' in');
  /* quantity: user-declared, NOT source */
  setFact('partQty',S.intent.qty,'declared','User-declared quantity '+S.intent.qty);
  /* deliberately UNRESOLVED: cutPlane, endRelation, lengthDatum */
  S.legLoaded=true;
}

/* ═══════════ 6 · PHYSICAL IDENTITY ═══════════
   Exactly the same eight fields, order and null behavior as the Start Own child.
   This is the shared schema that lets the System later prove convergence. No
   provenance, no project id, no source, no narrative, no UI state. */
var DEMAND_KEYS=['sizeKey','finishedLengthIn','partQty','angleDeg',
                 'cutPlane','endIdentity','endRelation','lengthDatum'];
function physicalDemand(P){
  return {
    sizeKey:P.sizeKey,
    finishedLengthIn:P.finishedLengthIn==null?null:Number(P.finishedLengthIn),
    partQty:P.partQty==null?null:Number(P.partQty),
    angleDeg:P.angleDeg==null?null:Number(P.angleDeg),
    cutPlane:P.cutPlane,
    endIdentity:P.endIdentity,
    endRelation:P.endRelation==null?null:P.endRelation,
    lengthDatum:P.lengthDatum
  };
}
function canonicalDemand(d){
  var out=[];
  for(var i=0;i<DEMAND_KEYS.length;i++){
    var k=DEMAND_KEYS[i], v=d[k];
    out.push(k+'='+(v==null?'∅':(typeof v==='number'?v.toFixed(4):String(v))));
  }
  return out.join('|');
}
/* CHILD-LOCAL, PREVIEW-ONLY id. NOT the System canonical review-child id, which
   the host owns through its own identity machinery. */
function localPreviewId(d){return 'BL-'+hash32(canonicalDemand(d))+' · local preview'}

/* ═══════════ 7 · FAIL CLOSED ═══════════ (identical rules to Start Own) */
function openPoints(P){
  var a=[], s=stk(P.sizeKey);
  if(!P.sizeKey)a.push({k:'stock',t:'Stock class'});
  if(P.finishedLengthIn==null)a.push({k:'len',t:'Finished length'});
  if(P.partQty==null)a.push({k:'qty',t:'Quantity'});
  if(P.angleDeg==null)a.push({k:'ends',t:'Angle'});
  if(P.angleDeg!=null&&P.angleDeg>0){
    if(!P.cutPlane)a.push({k:'plane',t:'Cut-plane orientation'});
    if(!P.endIdentity)a.push({k:'ends',t:'Which ends are cut'});
    if(P.endIdentity==='both'&&!P.endRelation)a.push({k:'rel',t:'End relation'});
  }
  if(!P.lengthDatum)a.push({k:'datum',t:'Finished-length datum'});
  if(P.angleDeg!=null&&P.angleDeg>0&&s&&!s.angled)
    a.push({k:'cell',t:'Angled end is offered on 2×4 only in this cell'});
  return a;
}
function isComplete(P){return openPoints(P).length===0}
function bevelDeferred(P){return P.angleDeg>0 && P.cutPlane==='bevel-thickness'}
/* the three facts the source did not establish; used to drive the resolution UI */
function unresolvedSourceGaps(){
  var g=[];
  if(!S.P.cutPlane)g.push('cutPlane');
  if(S.P.endIdentity==='both'&&!S.P.endRelation)g.push('endRelation');
  if(!S.P.lengthDatum)g.push('lengthDatum');
  return g;
}

function dimH(x1,x2,y,label,col){
  col=col||'var(--src)';

  return '<g><path d="M'+x1+' '+(y-5)+'v10M'+x2+' '+(y-5)+'v10" stroke="'+col+'" opacity=".6"/>'

function angleMark(ax,ay,deg,dir,down,r,col){
  if(!(deg>0))return '';
  r=r||36; dir=dir||1; col=col||'var(--accent)'; var rad=deg*Math.PI/180, sy=down?1:-1;
  var sqx=ax, sqy=ay+sy*r;
  var enx=ax-dir*r*Math.sin(rad), eny=ay+sy*r*Math.cos(rad);
  var sweep=(sy>0)?(dir>0?1:0):(dir>0?0:1);
  return '<g><path d="M'+ax+' '+ay+'L'+sqx+' '+sqy+'" stroke="var(--ink3)" stroke-dasharray="3 3"/>'
    +'<path d="M'+sqx+' '+sqy+'A'+r+' '+r+' 0 0 '+sweep+' '+enx+' '+eny+'" fill="none" stroke="'+col+'" stroke-width="1.6"/>'
    +txt(ax-dir*r*0.62,ay+sy*r*0.86,fmt(deg)+'°',{anchor:'middle',size:12.5,weight:700,fill:col})
    +'</g>';
}

/* THE CORRECTED SOURCE-EVIDENCE LEG DRAWING.
   The source establishes 2×4, both ends, 10°. It does NOT establish which
   physical plane the angle runs in. So while cutPlane is UNRESOLVED we must NOT
   draw a definitive face-miter. We draw BOTH candidate orientations as ghosts
   on their respective views and put a callout saying orientation is not yet
   established. Only once cutPlane is resolved does the committed geometry appear
   on the correct single view. This is the fix the brief requires. */
function drawLeg(P){
  var s=stk(P.sizeKey)||stk('2x4');
  var L=(P.finishedLengthIn!=null?P.finishedLengthIn:15.5);
  var a=(P.angleDeg!=null?P.angleDeg:0);
  var plane=P.cutPlane, ends=P.endIdentity, rel=P.endRelation;
  var resolved=(a>0&&plane&&ends);
  var vw=760, ML=118, MR=210, MT=58;
  var skFace=(resolved&&plane==='miter-face') ? s.w*Math.tan(a*Math.PI/180) : 0;
  var skEdge=(resolved&&plane==='bevel-thickness') ? s.t*Math.tan(a*Math.PI/180) : 0;
  var ghostSkFace=s.w*Math.tan((a||10)*Math.PI/180);
  var maxSk=Math.max(skFace,skEdge,(!plane&&a>0?ghostSkFace:0));
  var SC=(vw-ML-MR)/(L+maxSk+0.01);
  var lPx=L*SC, fH=s.w*SC, eH=s.t*SC;
  var yF=MT, yFb=yF+fH, yE=yFb+62, yEb=yE+eH;
  var vh=yEb+(!plane&&a>0?128:104);
  var o=['<svg viewBox="0 0 '+vw+' '+vh+'" role="img" aria-label="the source leg, with unresolved facts shown as unresolved">'];

  function shape(y0,y1,sk){
    var skL=0, skR=0;
    if(resolved&&sk>0){
      if(ends==='both'){ skL=sk; skR=(rel==='opposed')?-sk:sk; }
      else { skL=sk; skR=0; }
    }
    var x0=ML+Math.max(0,-Math.min(skL,skR));
    return {BL:[x0,y1],BR:[x0+lPx,y1],TR:[x0+lPx+skR,y0],TL:[x0+skL,y0],skL:skL,skR:skR,x0:x0};
  }
  function drawView(y0,y1,sk,fill,label,dimLabel,live){
    var c=shape(y0,y1,sk);
    var d='M'+c.TL[0]+' '+c.TL[1]+'L'+c.TR[0]+' '+c.TR[1]+'L'+c.BR[0]+' '+c.BR[1]+'L'+c.BL[0]+' '+c.BL[1]+'Z';
    var g=[];
    g.push('<ellipse cx="'+(c.x0+lPx/2)+'" cy="'+(y1+7)+'" rx="'+(lPx/2)+'" ry="5" fill="url(#drop)" opacity=".5"/>');
    g.push('<path d="'+d+'" fill="url(#'+fill+')"/>');
    g.push('<clipPath id="clip-'+label.replace(/\W/g,'')+'"><path d="'+d+'"/></clipPath>');
    g.push('<g clip-path="url(#clip-'+label.replace(/\W/g,'')+')"><rect x="'+(c.x0-30)+'" y="'+y0
      +'" width="'+(lPx+120)+'" height="'+(y1-y0)+'" fill="url(#grain)" opacity=".9"/></g>');
    g.push('<path d="'+d+'" fill="none" stroke="rgba(70,45,20,.45)" stroke-width="1.2"/>');
    if(resolved&&sk>0){
      g.push('<path d="M'+c.TL[0]+' '+c.TL[1]+'L'+c.BL[0]+' '+c.BL[1]+'" stroke="var(--accent)" stroke-width="4.5" stroke-linecap="round"/>');
      if(ends==='both')
        g.push('<path d="M'+c.TR[0]+' '+c.TR[1]+'L'+c.BR[0]+' '+c.BR[1]+'" stroke="var(--accent)" stroke-width="4.5" stroke-linecap="round"/>');
    }
    g.push(txt(ML-12,(y0+y1)/2+4,label,{anchor:'end',size:11.5,weight:700,fill:live?'var(--accent2)':'var(--ink3)'}));
    g.push(txt(ML-12,(y0+y1)/2+18,dimLabel,{anchor:'end',size:10.5}));
    return {g:g.join(''),c:c};
  }

  o.push(txt(ML,26,'THE LEG FROM THE SOURCE · DRAWN TO SCALE',{size:11,weight:700,ls:'.09em'}));
  o.push(txt(vw-MR+8,26,esc(s.label)+' · outdoor bench',{anchor:'end',size:11,weight:700,ls:'.05em',fill:'var(--src)'}));

  var face=drawView(yF,yFb,skFace,'face','WIDE FACE',fmt(s.w)+' in',plane==='miter-face');
  var edge=drawView(yE,yEb,skEdge,'edge','EDGE',fmt(s.t)+' in',plane==='bevel-thickness');
  o.push(face.g); o.push(edge.g);

  if(resolved&&skFace>0) o.push(angleMark(face.c.BL[0],face.c.BL[1],a,-1,true,34));
  if(resolved&&skEdge>0) o.push(angleMark(edge.c.BL[0],edge.c.BL[1],a,-1,true,28));

  /* THE FIX: angle known from source, orientation NOT established.
     Ghost the same angle on BOTH candidate views. Commit to neither. */
  if(a>0&&ends&&!plane){
    [[face.c,yF,yFb,s.w,'across the wide face'],[edge.c,yE,yEb,s.t,'through the thickness']].forEach(function(p){
      var c=p[0], gsk=p[3]*Math.tan(a*Math.PI/180)*SC;
      o.push('<path d="M'+(c.BL[0]+gsk)+' '+p[1]+'L'+c.BL[0]+' '+p[2]+'" stroke="var(--warn)" stroke-width="2.4" stroke-dasharray="6 4"/>');
      if(ends==='both')
        o.push('<path d="M'+(c.BR[0]+gsk)+' '+p[1]+'L'+c.BR[0]+' '+p[2]+'" stroke="var(--warn)" stroke-width="2.4" stroke-dasharray="6 4"/>');
      o.push(txt(c.BL[0]+gsk/2+10,(p[1]+p[2])/2+4,'? '+p[4],{size:10,weight:650,fill:'var(--warn)'}));
    });
    o.push('<rect x="'+(ML)+'" y="'+(vh-58)+'" width="'+(vw-ML-MR+40)+'" height="40" rx="9" fill="var(--warntint)" stroke="var(--warn)"/>');
    o.push(txt(ML+13,vh-38,'ORIENTATION NOT YET ESTABLISHED',{size:11,weight:700,ls:'.06em',fill:'var(--warn)'}));
    o.push(txt(ML+13,vh-22,'The source proved a '+fmt(a)+'° cut on both ends — not which plane it runs in. Both are shown as candidates.',
      {size:11,fill:'var(--warn)'}));
  } else if(a>0&&ends&&plane){
    o.push(txt(ML,vh-20,'Orientation resolved · '+esc(words(plane))+'. The committed geometry is drawn on the correct view only.',
      {size:11,weight:600,fill:'var(--good)'}));
  }

  var c=face.c, dy=yEb+42;
  if(!P.lengthDatum){
    o.push(dimH(c.BL[0],c.BR[0],dy,fmt(L)+' in · datum unresolved','var(--warn)'));
    o.push(txt(vw/2,dy+22,'length carried, but which points it is measured between is not yet established',
      {anchor:'middle',size:11,fill:'var(--warn)'}));
  } else if(P.lengthDatum==='long-short'&&skFace>0){
    var lo=c.BL[0]+Math.max(0,c.skL), hi=c.BR[0]+Math.min(0,c.skR);
    o.push(dimH(lo,hi,dy,fmt(L)+' in'));
    o.push(txt(vw/2,dy+22,'long point → short point',{anchor:'middle',size:11}));
  } else {
    o.push(dimH(c.BL[0],c.BR[0],dy,fmt(L)+' in'));
    o.push(txt(vw/2,dy+22,'along the outer edge, tip to tip',{anchor:'middle',size:11}));
  }
  if(P.partQty!=null)
    o.push(txt(vw-MR+8,44,'× '+P.partQty+' declared',{anchor:'end',size:11,fill:'var(--ink2)'}));
  o.push('</svg>');
  return o.join('');
}

  }
  var s='<svg viewBox="0 0 '+W+' '+H+'" aria-hidden="true">';
  if(kind==='parallel')   s+=box(x0+sk,x1+sk,x1,x0,1);
  else if(kind==='opposed')s+=box(x0+sk,x1-sk,x1,x0,1);

    s+='<path d="M'+(x0+sk)+' 5L'+(x1+sk)+' 5L'+x1+' 23L'+x0+' 23Z" fill="url(#face)" stroke="var(--src)" stroke-width="1.6"/>';

    s+='<path d="M'+x0+' 5L'+x1+' 5L'+x1+' 23L'+x0+' 23Z" fill="url(#face)" stroke="rgba(70,45,20,.35)"/>';
    s+='<path d="M'+(x0+5)+' 26L'+(x1+5)+' 26L'+x1+' 32L'+x0+' 32Z" fill="url(#edge)" stroke="var(--src)" stroke-width="1.6"/>';
  } else if(kind==='edgeDatum'){
    s+=box(x0+sk,x1+sk,x1,x0,0);
    s+='<path d="M'+x0+' 31H'+x1+'" stroke="var(--src)" stroke-width="2"/>'
      +'<circle cx="'+x0+'" cy="31" r="2.6" fill="var(--src)"/><circle cx="'+x1+'" cy="31" r="2.6" fill="var(--src)"/>';

  }
  return s+'</svg>';
}

  h+='<details class="fold"><summary>Physical demand and layered provenance, as it leaves this file</summary><div class="in">'
    +'<p style="margin:0 0 10px">The eight fields below use the same names and null behavior as the Start Own '
    +'child. Provenance travels beside them, layered, never inside the physical identity.</p>'
    +'<pre class="spec">'+esc(specText())+'</pre></div></details>';
  h+='<p class="foot"><b>NO BLOOD ON WOOD.</b> Confirmation is not an order, payment, allocation, production '
    +'release, machine readiness, physical execution authorisation, controller output or Cycle Start. The '
    +'application defines work; the commissioned machine site retains physical execution authority.</p>';
  $('app').innerHTML=h;
  $('lib').onclick=returnToLibrary;
  $('copy').onclick=function(){
    var t=specText();
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t);
      else{var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
        document.execCommand('copy');document.body.removeChild(ta)}
      flash('Contract copied');
    }catch(e){flash('Open the fold below and copy it from there')}
  };
  $('confirm').onclick=confirmVersion;
}

/* ═══════════ 13 · CONFIRMATION ═══════════ */
function confirmVersion(){
  if(!isComplete(S.P)){flash('The contract is not complete');return}
  var payload=cleanOutdoorPayload();
  S.confirmed=payload;
  if(window.self!==window.top)
    window.parent.postMessage({type:'STB_OUTDOOR_CONFIRMED',payload:JSON.parse(JSON.stringify(payload))},window.location.origin);
  flash(window.self!==window.top?'Sent to the System host':'Confirmed · no host attached in review mode');
  render();
}
function cleanOutdoorPayload(){
  var d=physicalDemand(S.P);
  return {
    localPreviewId:localPreviewId(d),
    definition:bridgeDefinition(),
    physicalDemand:d,
    provenance:JSON.parse(JSON.stringify(S.prov)),
    intent:JSON.parse(JSON.stringify(S.intent)),
    sourceAuthority:sourceAuthority(),
    operations:S.ops.slice()
  };
}

/* ═══════════ 14 · THE SYSTEM BOUNDARY ═══════════
   Outdoor does NOT own or fake a live Store path. It exposes normalized physical
   demand and its bounded source authority through STBProjectBridge, emits
   STB_PROJECT_DEFINITION_CHANGED with projectId "outdoor", and confirms with
   STB_OUTDOOR_CONFIRMED. The host persists the snapshot and advances to Store
   Answer via its own adapter (review-store-handoff/0.5). */
function sourceAuthority(){
  return {kind:'BOUNDED_SOURCE_BACKED',
    projectId:'outdoor', family:SOURCE.family, assembly:SOURCE.assembly, part:SOURCE.part,
    establishes:{sizeKey:SOURCE.sizeKey,referenceLengthIn:SOURCE.referenceLengthIn,
                 angleDeg:SOURCE.angleDeg,endIdentity:SOURCE.endIdentity,context:SOURCE.context},
    doesNotEstablish:['cutPlane','endRelation','lengthDatum','partQty'],
    authorityRef:SOURCE.authorityRef, researchRef:SOURCE.researchRef,
    artifact:'stb-outdoor-bench-leg-0.1.html'};
}
function bridgeDefinition(){
  var P=S.P, s=stk(P.sizeKey), d=physicalDemand(P);
  return {
    part:'bench-leg',
    stockClass:P.sizeKey,
    actualThickness:s?s.t:null, actualWidth:s?s.w:null,
    finishedLength:P.finishedLengthIn,
    quantity:P.partQty,
    angleDegrees:P.angleDeg,
    endCondition:(P.angleDeg!=null&&P.angleDeg>0)?'angled':'square',
    straightCut:true,
    cutPlane:P.cutPlane, endIdentity:P.endIdentity, endRelation:P.endRelation,
    lengthDatum:P.lengthDatum,
    holeRequirement:'NONE', datum:null, holes:[],
    physicalDemand:d,
    provenance:JSON.parse(JSON.stringify(S.prov)),
    sourceAuthority:sourceAuthority()
  };
}
function installBridge(){
  window.STBProjectBridge={
    version:'stb.project-bridge/0.1',
    projectId:'outdoor',
    projectClass:'BOUNDED_SOURCE_BACKED',
    sourceAuthority:sourceAuthority(),
    getDefinition:function(){return JSON.parse(JSON.stringify(bridgeDefinition()))},
    getLocalPreviewId:function(){return localPreviewId(physicalDemand(S.P))},
    getSnapshot:function(){
      return {projectId:'outdoor', projectClass:'BOUNDED_SOURCE_BACKED',
        sourceAuthority:sourceAuthority(), screen:S.screen,
        localPreviewId:localPreviewId(physicalDemand(S.P)),
        definition:JSON.parse(JSON.stringify(bridgeDefinition())),
        physicalDemand:physicalDemand(S.P),
        complete:isComplete(S.P),
        openPoints:openPoints(S.P).map(function(x){return x.t}),
        unresolvedSourceGaps:unresolvedSourceGaps(),
        provenance:JSON.parse(JSON.stringify(S.prov)),
        confirmed:S.confirmed?JSON.parse(JSON.stringify(S.confirmed)):null};
    }
  };
  return window.STBProjectBridge;
}
function emitChanged(){
  var key=canonicalDemand(physicalDemand(S.P));
  if(key===S.lastId)return;
  S.lastId=key;
  var msg={type:'STB_PROJECT_DEFINITION_CHANGED', projectId:'outdoor',
    definition:window.STBProjectBridge?window.STBProjectBridge.getDefinition():null};
  window.dispatchEvent(new CustomEvent('STB_PROJECT_DEFINITION_CHANGED',{detail:msg}));
  if(window.self!==window.top)window.parent.postMessage(msg,window.location.origin);
}
function returnToLibrary(){
  if(window.self!==window.top)window.parent.postMessage({type:'STB_CHILD_RETURN_LIBRARY',projectId:'outdoor'},window.location.origin);
  else{S.screen='intent';S.nav={family:null,assembly:null,need:null,part:null};
    S.P=blankPart();S.prov={};S.ops=[];S.legLoaded=false;S.confirmed=null;render();window.scrollTo(0,0)}
}

/* ═══════════ 15 · SETTING FACTS + WIRING ═══════════ */
function setFact(field,value,provKey,opText){
  S.P[field]=value;
  if(provKey!==undefined){ if(provKey===null)delete S.prov[field]; else S.prov[field]=provKey; }
  if(opText)S.ops.push(opText);
}
function dropOps(prefix){S.ops=S.ops.filter(function(x){return x.indexOf(prefix)!==0})}

function setKey(k,v){
  if(k==='delta'){
    S.intent.delta=clamp(q4(v),0,12);
    if(S.legLoaded){ /* re-derive length, keep derived provenance */
      dropOps('Reference '); dropOps('Apply +');
      setFact('finishedLengthIn',targetLen(),'derived',
        'Reference '+fmt(SOURCE.referenceLengthIn)+' in (source) + '+fmt(S.intent.delta)+' in (user) = '+fmt(targetLen())+' in');
    }
  }
  else if(k==='qty'){
    S.intent.qty=clamp(Math.round(v),QTY_MIN,QTY_MAX);
    if(S.legLoaded){ dropOps('User-declared quantity'); setFact('partQty',S.intent.qty,'declared','User-declared quantity '+S.intent.qty); }
  }
  else if(k==='len'){
    var L=clamp(q4(v),LEN_MIN,LEN_MAX);
    dropOps('Reference '); dropOps('Confirm the finished length');
    var pk=(Math.abs(L-targetLen())<1e-6)?'derived':'usermod';
    setFact('finishedLengthIn',L,pk,
      pk==='derived'
        ? 'Reference '+fmt(SOURCE.referenceLengthIn)+' in (source) + '+fmt(S.intent.delta)+' in (user) = '+fmt(L)+' in'
        : 'Confirm the finished length · '+fmt(L)+' in (user-set, off the derived value)');
  }
}
function currentOf(k){
  return k==='delta'?S.intent.delta : k==='qty'?S.intent.qty
       : (S.P.finishedLengthIn==null?targetLen():S.P.finishedLengthIn);
}
function act(name,val){
  if(name==='fam'){ if(val==='separate')S.nav.family='separate'; return; }
  if(name==='asm'){ if(val==='bench')S.nav.assembly='bench'; return; }
  if(name==='need'){ if(val==='parts')S.nav.need='parts'; return; }
  if(name==='part'){ if(val==='leg')S.nav.part='leg'; return; }
  /* resolution facts — all USER / REVIEWED EVIDENCE CONFIRMATION */
  if(name==='plane'){ dropOps('Resolve orientation');
    setFact('cutPlane',val,'evidence','Resolve orientation · '+(val==='miter-face'?'across the wide face (miter/face)':'through the thickness (bevel/thickness)')); }
  else if(name==='rel'){ dropOps('Resolve end relation');
    setFact('endRelation',val,'evidence','Resolve end relation · '+(val==='parallel'?'parallel':'mirrored')); }
  else if(name==='datum'){ dropOps('Resolve length datum');
    setFact('lengthDatum',val,'evidence','Resolve length datum · '+tech(val)); }
}
document.addEventListener('click',function(e){
  var t=e.target.closest&&e.target.closest('[data-act],[data-step],[data-set]');
  if(!t||t.disabled||t.getAttribute('aria-disabled')==='true')return;
  if(t.dataset.act){ act(t.dataset.act,t.dataset.val); render(); return; }
  if(t.dataset.step){ var a=t.dataset.step.split(':'); setKey(a[0],currentOf(a[0])+ +a[1]); render(); return; }
  if(t.dataset.set){ var b=t.dataset.set.split(':'); setKey(b[0],+b[1]); render(); }
});
document.addEventListener('change',function(e){
  var el=e.target.closest&&e.target.closest('[data-exact]'); if(!el)return;
  var v=parseDim(el.value);
  if(v==null||!isFinite(v)){flash('Try a number like 16 1/2');render();return}
  setKey(el.getAttribute('data-exact'),v); render();
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;
  var el=e.target.closest&&e.target.closest('[data-exact]'); if(!el)return;
  e.preventDefault(); el.dispatchEvent(new Event('change',{bubbles:true}));
});

function render(){
  installBridge();
  if(S.screen==='intent')        renderIntent();
  else if(S.screen==='family')   renderFamily();
  else if(S.screen==='assembly') renderAssembly();
  else if(S.screen==='parts')    renderParts();
  else if(S.screen==='resolve')  renderResolve();
  else                           renderContract();
  emitChanged();
}
(function boot(){ installBridge(); render(); })();
window.S=S;
window.currentDefinitionKey=function(){return canonicalDemand(physicalDemand(S.P))};
</script>

    const style = doc.createElement('style');

      .recovery-nav:not([data-idea-line]) .trail-fork,.recovery-nav:not([data-idea-line]) .job-idea-onward{display:none!important}

      .recovery-nav .job-nav-context{display:inline-flex;align-items:center;padding:5px 9px;border:1px solid var(--border-accent);border-radius:999px;background:var(--tint);color:var(--accent);font-size:9.5px;font-weight:800;letter-spacing:.06em;white-space:nowrap}
      .s001-v2-intent-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(300px,1.1fr);gap:16px;align-items:start;margin:14px 0}

      .s001-v2-key.saw{border-top-style:dashed;border-color:#315f85}
      .s001-v2-key.out{height:9px;border:0;background:rgba(176,55,52,.18);outline:1px solid rgba(176,55,52,.55)}
      .s001-v2-seq{display:grid;gap:7px;margin:12px 0}
      .s001-v2-seq .row{display:grid;grid-template-columns:28px 1fr;gap:9px;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
      .s001-v2-seq .n{font-size:10px;font-weight:800;color:var(--accent)}
      .s001-v2-seq b,.s001-v2-seq span{display:block}
      .s001-v2-seq b{font-size:11px}.s001-v2-seq span{margin-top:2px;font-size:10.5px;color:var(--text2);line-height:1.35}
      .s001-v2-store-split{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:9px;margin:12px 0}
      .s001-v2-store-card{border:1px solid var(--border);border-radius:9px;background:var(--surface);padding:11px}
      .s001-v2-store-card h3{margin:0 0 7px;font-size:12px}.s001-v2-store-card p{margin:5px 0;font-size:11px;line-height:1.45}
      .s001-v2-pass{border-left:4px solid #557b58}.s001-v2-separate{border-left:4px solid #9b7540}
      .s001-v2-order{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:7px;margin:12px 0}
      .s001-v2-order>div{border:1px solid var(--border);border-radius:8px;padding:9px;background:var(--surface)}
      .s001-v2-order b,.s001-v2-order span{display:block}.s001-v2-order b{font-size:9px;letter-spacing:.05em;color:var(--text2)}.s001-v2-order span{margin-top:3px;font-size:11.5px}
      @media(max-width:820px){.s001-v2-intent-grid,.s001-v2-machine-grid{grid-template-columns:1fr}}
      .alcove-chain{margin:0 0 18px;padding:14px 16px;border:1px solid var(--border-accent,var(--border));border-radius:10px;background:var(--surface,#fff)}.alcove-chain .chainhd{margin:0 0 10px;font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--accent,#8a5a2b)}.alcove-chain code{font:10.5px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;color:var(--text)}.alcove-chain .chainpair{display:grid;gap:10px;margin:0 0 12px}.alcove-chain .chainpair div{padding:10px 12px;border-radius:8px;background:var(--tint,#f6efe6)}.alcove-chain .chainpair b{display:block;margin:0 0 4px;font-size:10px;letter-spacing:.07em;color:var(--text2)}.alcove-chain .chainpair code{font-size:12px}.alcove-chain .chainlinks{margin:0;padding:0;list-style:none;display:grid;gap:8px}.alcove-chain .chainlinks li{padding:8px 10px;border-left:3px solid var(--border-accent,var(--border));background:var(--bg)}.alcove-chain .chainstep{margin:0 0 4px;font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--text2)}.alcove-chain .chainrow{display:grid;grid-template-columns:128px 1fr;gap:8px;font-size:11px;padding:1px 0}.alcove-chain .chainrow span{color:var(--text2)}.alcove-chain .chainhistory{margin:0;padding-left:16px;font-size:11px}
    `;
    doc.head.append(style);

    let activeJourneyProject = null;
    let proofHandoff = null;
    let proofSimulation = null;
    const storeHandoffContract = window.STBStoreHandoffContract || null;
    const user1RuntimeBridge = window.STBUserDefinedBoardRuntimeBridge || null;
    // Opens a Start-your-own screen ('idea', 'intent' or 'bench') from anywhere in the shell.
    // The real switcher is scoped inside the Shared Home block below and assigns itself here.
    let openStartOwnStage = () => {};
    const startOwnScreen = stage => stage === 'idea' || stage === 'bench' ? stage : 'intent';
    // Start your own is on the shared tile host. The bench's definition is one job-definition revision; the
    // revision on the bench is admitted on every change, and confirming asks the Store through admit() then inquire().
    const START_OWN_PROJECT_ID = 'start-own';
    const START_OWN_INQUIRY_SCOPE = 'USER_DEFINED_BOARD_V1';
    const START_OWN_CONFIGURATION_ID = 'SYO-USER1-XBRACE';
    const startOwnLive = { token:0, revision:null, admission:null, asking:false, answer:null, blocking:[] };

    const home = doc.getElementById('projects');
    if (home) {
      home.querySelector('[data-canonical-home-return]')?.remove();

      const ribbon = home.querySelector(':scope > .split > .ribbon');
      if (ribbon) {
        ['start-own','alcove-capture','window-intake','picnic-chooser','window-parts'].forEach(id => {
          const tile = ribbon.querySelector(`.tile[data-go="${id}"]`);
          if (tile) ribbon.append(tile);
        });

        const proofLabels = Object.freeze([
          ['start-own','TEST 01 · FROM A BOARD'],
          ['alcove-capture','TEST 02 · FIT THE SPACE'],
          ['window-intake','TEST 03 · DEFINE THE ASSEMBLY'],
          ['picnic-chooser','TEST 04 · FROM A BOUNDED PROJECT'],
          ['window-parts','TEST 05 · CHANGE THE MATERIAL STREAM']
        ]);
        proofLabels.forEach(([id,label]) => {
          const tile = ribbon.querySelector(`.tile[data-go="${id}"]`);
          if (!tile || tile.querySelector('[data-proof-test]')) return;
          const marker = doc.createElement('span');
          marker.dataset.proofTest = id;
          marker.textContent = label;
          marker.style.cssText = 'display:block;margin:0 0 4px;font-size:8px;line-height:1.2;font-weight:700;letter-spacing:.04em;color:var(--text3)';
          tile.prepend(marker);
        });

        const startOwnTile = ribbon.querySelector('.tile[data-go="start-own"]');
        if (startOwnTile) {
          startOwnTile.removeAttribute('data-go');
          startOwnTile.dataset.startOwnArtifact = 'three-frames.html';
          startOwnTile.title = 'Start Your Own · User 1 · definition to doing';

          let startOwnPage = doc.getElementById('start-own-live');
          if (!startOwnPage) {
            startOwnPage = doc.createElement('section');
            startOwnPage.className = 'page start-own-shell-page';
            startOwnPage.id = 'start-own-live';
            // Start your own opens on its Idea intake, before Intent.
            startOwnPage.dataset.revStage = 'idea';
            startOwnPage.innerHTML = `
              <div class="start-own-shell-main">
                <iframe
                  id="start-own-proof-frame"
                  class="start-own-shell-frame"
                  title="Start Your Own · User 1 · definition to doing"
                  src="three-frames.html?v=13b41596"
                ></iframe>
              </div>
            `;
            doc.querySelector('.wrap')?.append(startOwnPage);
          }

          const liveFrame = startOwnPage.querySelector('#start-own-proof-frame');
          if (liveFrame && !String(liveFrame.getAttribute('src')||'').includes('three-frames.html')) {
            liveFrame.src = 'three-frames.html?v=13b41596';
          }
          const banner = startOwnPage.querySelector('[data-proof-job="1"]');
          if (banner && /generic floor/.test(banner.textContent||'')) {
            const storeLine = banner.querySelector('#proof-job1-store');
            if (!storeLine) banner.insertAdjacentHTML('beforeend', '<p id="proof-job1-store" class="dim">Store: waiting on a complete definition.</p>');
          }
          const proofFrame = startOwnPage.querySelector('#start-own-proof-frame');
          let pendingStartOwnStage = 'idea';
          let pendingStartOwnFocus = null;
          let showStartOwnStage = (stage, focus = null) => {
            pendingStartOwnStage = startOwnScreen(stage);
            pendingStartOwnFocus = focus === 'definition-boundary' ? 'definition-boundary' : null;
          };
          openStartOwnStage = (stage, focus = null) => showStartOwnStage(stage, focus);
          if (proofFrame && !proofFrame.dataset.proofObserved) {
            proofFrame.dataset.proofObserved = 'true';
            proofFrame.addEventListener('load', () => {
              const childDoc = proofFrame.contentDocument;
              if (!childDoc) return;
              const benchButton = childDoc.querySelector('.stb-bench-button');
              const ideaScreen = childDoc.getElementById('stb-start-idea-screen');
              const intentScreen = childDoc.getElementById('stb-start-intent-screen');
              const benchScreen = childDoc.getElementById('stb-start-bench-screen');
              const benchBack = childDoc.getElementById('stb-bench-back');
              const benchLibrary = childDoc.getElementById('stb-bench-library');
              const benchIntentSlot = childDoc.getElementById('stb-bench-intent-slot');
              const lengthInput = childDoc.getElementById('stb-config-length');
              const boundaryNote = childDoc.getElementById('stb-config-boundary-note');
              const resetDemoButton = childDoc.getElementById('stb-config-reset');
              const confirmButton = childDoc.getElementById('stb-confirm-store');
              const glossaryStatus = childDoc.getElementById('stb-store-glossary-status');
              const glossaryChoices = Array.from(childDoc.querySelectorAll('[data-store-size-key]'));
              // The material the bench states, and only that: species from the bench's species choice, form and nominal
              // size from its "2×4 stud" control. A field the bench does not state is left out, so admission blocks on
              // it. No species is chosen for the user.
              const statedMaterial = () => {
                const control = childDoc.getElementById('stb-store-board-2x4');
                const species = childDoc.querySelector('#stb-bench-species [data-species].on')?.dataset.species;
                const stated = {};
                if (species) stated.species = species;
                if (!control) return stated;
                if (control.dataset.materialForm) stated.form = control.dataset.materialForm;
                if (control.dataset.materialNominalT) stated.nominalT = Number(control.dataset.materialNominalT);
                if (control.dataset.materialNominalW) stated.nominalW = Number(control.dataset.materialNominalW);
                return stated;
              };
              const startOwnAuthority = storeHandoffContract?.storeAuthorities?.startOwn || null;
              const catalogSource = storeHandoffContract?.startOwnStoreCatalog || null;
              let definitionRevision = 1;
              const partQty = 2;
              const spotMode = 'centered';
              const DEMO_MIN_LENGTH_IN = 16;
              const DEMO_MAX_LENGTH_IN = 18;
              const DEMO_HORIZONTAL_SPAN_IN = 8;
              let currentUser1Definition = null;
              let storeRequestSequence = 0;

              const nextStoreRequestId = definition => {
                storeRequestSequence += 1;
                return [
                  definition?.definitionId || 'UNIDENTIFIED',
                  definition?.versionId || 'UNVERSIONED',
                  String(Date.now()),
                  String(storeRequestSequence)
                ].join('@');
              };

              const setText = (id,value) => {
                const el = childDoc.getElementById(id);
                if (el) el.textContent = value;
              };
              const formatInches = value => {
                const n = Number(value);
                if (!Number.isFinite(n)) return 'unresolved';
                const eighths = Math.round(n * 8);
                const whole = Math.trunc(eighths / 8);
                const rem = Math.abs(eighths % 8);
                const fraction = ['', '⅛', '¼', '⅜', '½', '⅝', '¾', '⅞'][rem];
                return (whole ? String(whole) : (rem ? '' : '0')) + fraction + ' in';
              };
              // People read angles to a tenth of a degree; the definition record keeps full precision.
              const formatDegrees = value => {
                const n = Number(value);
                return Number.isFinite(n) ? String(Math.round(n * 10) / 10) + '°' : 'unresolved';
              };
              const boardName = lengthIn => {
                const n = Number(lengthIn);
                if (!Number.isFinite(n)) return '2×4';
                const feet = n / 12;
                const words = {4:'4-FOOT',5:'5-FOOT',6:'6-FOOT',7:'7-FOOT',8:'8-FOOT',10:'10-FOOT',12:'12-FOOT'};
                return (Number.isInteger(feet) && words[feet] ? words[feet] + ' ' : '') + '2×4 · ' + n + ' IN';
              };
              const activate = (selector,attr,value) => {
                childDoc.querySelectorAll(selector).forEach(button => {
                  button.classList.toggle('on',String(button.getAttribute(attr))===String(value));
                });
              };
              const syncStoreGlossary = () => {
                if (!storeHandoffContract || typeof storeHandoffContract.startOwnOfferings !== 'function') {
                  if (glossaryStatus) glossaryStatus.textContent = 'Current Store material truth is unavailable. No material choice is being promoted.';
                  if (benchButton) benchButton.disabled = true;
                  return false;
                }
                let backed = 0;
                glossaryChoices.forEach(choice => {
                  const sizeKey = String(choice.dataset.storeSizeKey || '');
                  const offerings = storeHandoffContract.startOwnOfferings(sizeKey);
                  const available = Array.isArray(offerings) && offerings.length > 0;
                  choice.dataset.storeBacked = available ? 'true' : 'false';
                  choice.dataset.storeCatalogPin = String(catalogSource?.pin || '');
                  choice.dataset.storeOfferingCount = String(offerings?.length || 0);
                  choice.hidden = !available;
                  if (available) backed += 1;
                });
                if (glossaryStatus) {
                  glossaryStatus.textContent = backed === glossaryChoices.length
                    ? 'These material choices come from the current Store catalog.'
                    : backed+' current Store material choices are available here.';
                }
                return true;
              };

              const showStage = (stage, focus = null) => {
                const screen = startOwnScreen(stage);
                const bench = screen === 'bench';
                doc.getElementById('start-own-live')?.setAttribute('data-rev-stage', screen);
                if (ideaScreen) ideaScreen.hidden = screen !== 'idea';
                if (intentScreen) intentScreen.hidden = screen !== 'intent';
                if (benchScreen) benchScreen.hidden = !bench;
                if (bench && benchIntentSlot && !benchIntentSlot.firstElementChild) {
                  const sourceIntent = childDoc.querySelector('#stb-start-intent-screen .stb-user1-body');
                  if (sourceIntent) {
                    const clone = sourceIntent.cloneNode(true);
                    clone.querySelector('.stb-bench-button')?.remove();
                    clone.querySelectorAll('[id]').forEach(node => node.removeAttribute('id'));
                    benchIntentSlot.append(clone);
                  }
                }
                if (bench) syncAndRender('BENCH_VIEW');
                if (bench && focus === 'definition-boundary') {
                  const confirmBlock = childDoc.querySelector('.confirm-block');
                  if (confirmBlock) {
                    proofFrame.contentWindow?.requestAnimationFrame?.(() => {
                      confirmBlock.scrollIntoView({block:'end'});
                    });
                  } else {
                    proofFrame.contentWindow?.scrollTo?.(0,0);
                  }
                } else {
                  proofFrame.contentWindow?.scrollTo?.(0,0);
                }
                startOwnPublish();
              };
              showStartOwnStage = (stage, focus = null) => {
                pendingStartOwnStage = startOwnScreen(stage);
                pendingStartOwnFocus = focus === 'definition-boundary' ? 'definition-boundary' : null;
                showStage(pendingStartOwnStage, pendingStartOwnFocus);
              };

              const syncDefinition = reason => {
                const finishedLengthIn = Number(lengthInput?.value);
                const withinDemo =
                  Number.isFinite(finishedLengthIn) &&
                  finishedLengthIn >= DEMO_MIN_LENGTH_IN &&
                  finishedLengthIn <= DEMO_MAX_LENGTH_IN;
                if (boundaryNote) boundaryNote.hidden = withinDemo;
                if (resetDemoButton) resetDemoButton.hidden = withinDemo;
                if (
                  !storeHandoffContract ||
                  typeof storeHandoffContract.resolveUser1StoreReference !== 'function' ||
                  !withinDemo
                ) {
                  if (confirmButton) confirmButton.disabled = true;
                  return null;
                }

                const spanRatio = DEMO_HORIZONTAL_SPAN_IN / finishedLengthIn;
                const angleDeg = Number((Math.asin(spanRatio) * 180 / Math.PI).toFixed(12));
                const achievedRiseIn = Number(Math.sqrt(
                  finishedLengthIn * finishedLengthIn -
                  DEMO_HORIZONTAL_SPAN_IN * DEMO_HORIZONTAL_SPAN_IN
                ).toFixed(6));
                const definedWorkpieceLengthIn = 60;
                const centerSpotIn = Number((finishedLengthIn / 2).toFixed(6));
                const spotDemand = spotMode === 'centered' ? {
                  required:true,
                  mode:'SPOT_ON_LOCATION',
                  countPerPart:1,
                  locationRule:'CENTERED_ON_PART',
                  locationAlongLengthIn:centerSpotIn,
                  acrossWidthRule:'CENTERED_ON_WIDE_FACE',
                  totalCount:partQty,
                  derivation:{
                    basis:'DERIVED',
                    formula:'finishedLengthIn / 2',
                    input:{finishedLengthIn:finishedLengthIn},
                    output:{locationAlongLengthIn:centerSpotIn}
                  }
                } : null;

                const parts = Array.from({length:partQty}, (_,index) => ({
                  partId:'PART-'+(index+1),
                  lengthIn:finishedLengthIn,
                  features:spotDemand ? [{
                    featureId:'SPOT-'+(index+1),
                    kind:'SPOT_ON_LOCATION',
                    xIn:centerSpotIn,
                    locationRule:'CENTERED_ON_PART',
                    acrossWidthRule:'CENTERED_ON_WIDE_FACE'
                  }] : []
                }));

                const requiredOps = [];
                if (angleDeg === 0) requiredOps.push('CROSSCUT');
                else requiredOps.push('MITER_LIMITED');
                if (spotDemand) requiredOps.push('SPOT_ON_LOCATION');

                /*
                 * This is the project/configurator demand only. Store owns whether
                 * it is supportable, how D-001 moves, modeled occupied time, and Q.
                 * The static public Review build may present only exact Store-issued
                 * references proven against promoted authority. Other values require a live Store answer.
                 */
                const configurationId = START_OWN_CONFIGURATION_ID;
                const endpoint16 = Math.abs(finishedLengthIn - 16) < 1e-9;
                const configurationVersion = startOwnConfigurationVersion(finishedLengthIn);
                const declaredSawCuts = startOwnDeclaredSawCuts(partQty, angleDeg);
                const declaredSpotCount = spotDemand ? partQty : 0;
                const storeDemand = {
                  configurationId:configurationId,
                  configurationVersion:configurationVersion,
                  definedWorkpieceLengthIn:definedWorkpieceLengthIn,
                  sawAngleDeg:angleDeg,
                  cutPlane:'miter-face',
                  endIdentity:'both',
                  endRelation:'parallel',
                  lengthDatum:'long-long-outer-edge',
                  datumCMethod:'REFERENCE_CUT',
                  requiredOps:requiredOps,
                  declaredSawCuts:declaredSawCuts,
                  declaredSpotCount:declaredSpotCount,
                  parts:parts
                };
                const storeAnswer = storeHandoffContract.resolveUser1StoreReference(storeDemand);
                const storeMaterialResolution = storeAnswer.materialResolution || null;
                const storeEstimate = storeAnswer.estimate || null;
                const effectiveWorkpieceLengthIn = Number.isFinite(Number(storeMaterialResolution?.workpieceLengthIn))
                  ? Number(storeMaterialResolution.workpieceLengthIn)
                  : definedWorkpieceLengthIn;
                const unresolved = Array.isArray(storeAnswer.unresolvedConditions)
                  ? storeAnswer.unresolvedConditions.slice()
                  : [];
                const refusals = Array.isArray(storeAnswer.refusalConditions)
                  ? storeAnswer.refusalConditions.slice()
                  : [];

                const physicalDemand = {
                  stockClass:'2x4',
                  materialSource:'STORE_ZERO',
                  parentLengthIn:effectiveWorkpieceLengthIn,
                  definedWorkpieceLengthIn:effectiveWorkpieceLengthIn,
                  finishedLength:finishedLengthIn,
                  quantity:partQty,
                  endCondition:angleDeg ? 'angled' : 'square',
                  straightCut:angleDeg === 0,
                  angleDegrees:angleDeg,
                  angleReference:'DERIVED_SAME_SPAN',
                  cutPlane:'miter-face',
                  endIdentity:'both',
                  endRelation:'parallel',
                  lengthDatum:'long-long-outer-edge',
                  datumCMethod:'REFERENCE_CUT',
                  requiredOps:requiredOps.slice(),
                  declaredSawCuts:declaredSawCuts,
                  declaredSpotCount:declaredSpotCount,
                  parts:parts
                };
                if (spotDemand) physicalDemand.spotDemand = spotDemand;

                const workpieceSequence = storeEstimate?.travel
                  ? {
                      status:'SEQUENCED',
                      basis:'STORE_RETURNED_TRAVEL',
                      finalRemainderIn:storeEstimate.travel.finalRemainderIn,
                      holdIn:24,
                      derivedSawCuts:storeEstimate.travel.derivedSawCuts,
                      derivedSpotCount:storeEstimate.travel.derivedSpotCount
                    }
                  : {
                      status:'UNRESOLVED',
                      basis:'STORE_ANSWER_REQUIRED',
                      code:'STORE_REFRESH_REQUIRED',
                      finalRemainderIn:null,
                      holdIn:24
                    };

                const capability = {
                  status:storeAnswer.capabilityStatus || 'UNRESOLVED',
                  basis:startOwnAuthority?.capabilityBasis || 'STORE_ANSWER_REQUIRED',
                  storePin:startOwnAuthority?.capabilityPin || null,
                  requiredOps:requiredOps,
                  refusalConditions:Array.from(new Set(refusals)),
                  unresolvedConditions:Array.from(new Set(unresolved))
                };

                currentUser1Definition = {
                  definitionId:'SYO-USER1-XBRACE-0.1',
                  versionId:'SYO-USER1-XBRACE-0.1-v'+definitionRevision,
                  configurationId:configurationId,
                  configurationVersion:configurationVersion,
                  material:{
                    origin:'STORE_ZERO',
                    stockClass:'2x4',
                    stated:statedMaterial(),
                    stockClassAuthority:{
                      repository:storeAnswer.source?.repository || catalogSource?.repository || null,
                      file:'store-zero-catalog.json',
                      pin:storeAnswer.source?.storePin || catalogSource?.pin || null,
                      clock:storeMaterialResolution?.source?.clock || catalogSource?.clock || null
                    },
                    procurement:storeMaterialResolution?.status === 'MAPPED' ? {
                      pricingReferenceSku:storeMaterialResolution.pricingReferenceSku || storeMaterialResolution.storeSku,
                      pricingReferenceStockLengthIn:storeMaterialResolution.pricingReferenceStockLengthIn || storeMaterialResolution.stockLengthIn,
                      quantity:storeMaterialResolution.quantity,
                      unitPrice:storeMaterialResolution.unitPrice,
                      materialTotal:storeMaterialResolution.materialTotal,
                      allocationClaimed:false
                    } : null,
                    definedWorkpieceLengthIn:{
                      value:definedWorkpieceLengthIn,
                      basis:'PROJECT_MINIMUM_REQUEST'
                    },
                    selectedStoreWorkpieceLengthIn:{
                      value:effectiveWorkpieceLengthIn,
                      basis:storeMaterialResolution?.selectionPolicy || 'STORE_ANSWER_REQUIRED'
                    },
                    mappedStoreSkus:storeMaterialResolution?.storeSku ? [storeMaterialResolution.storeSku] : []
                  },
                  intent:{
                    partQty:{value:partQty,basis:'BOUNDED_DEMO_FIXED'},
                    finishedLengthIn:{value:finishedLengthIn,basis:endpoint16?'USER_1_INTENT_IMAGE':'CUSTOMER_INPUT'},
                    angleDeg:{value:angleDeg,basis:'DERIVED_SAME_SPAN'},
                    endIdentity:{value:'both',basis:'USER_1_INTENT'},
                    endRelation:{value:'parallel',basis:'USER_1_INTENT'},
                    cutPlane:{value:'miter-face',basis:'USER_1_INTENT'},
                    lengthDatum:{value:'long-long-outer-edge',basis:'USER_1_INTENT'},
                    centerSpot:{value:'one-per-part',basis:'DERIVED_FROM_PART_LENGTH'}
                  },
                  derived:{
                    fixedHorizontalSpanIn:{value:DEMO_HORIZONTAL_SPAN_IN,basis:'BOUNDED_DEMO_BASELINE'},
                    achievedRiseIn:{
                      value:achievedRiseIn,basis:'DERIVED',
                      formula:'sqrt(finishedLengthIn^2 - fixedHorizontalSpanIn^2)',
                      input:{finishedLengthIn:finishedLengthIn,fixedHorizontalSpanIn:DEMO_HORIZONTAL_SPAN_IN}
                    },
                    endCutAngleDeg:{
                      value:angleDeg,basis:'DERIVED',
                      formula:'asin(fixedHorizontalSpanIn / finishedLengthIn)',
                      input:{finishedLengthIn:finishedLengthIn,fixedHorizontalSpanIn:DEMO_HORIZONTAL_SPAN_IN}
                    },
                    centerSpotAlongLengthIn:spotDemand ? {
                      value:centerSpotIn,basis:'DERIVED',formula:'finishedLengthIn / 2',input:{finishedLengthIn:finishedLengthIn}
                    } : null
                  },
                  physicalDemand:physicalDemand,
                  storeDemand:storeDemand,
                  workpieceSequence:workpieceSequence,
                  capability:capability,
                  storeReference:{
                    status:storeAnswer.status,
                    capabilityStatus:capability.status,
                    economicsStatus:storeAnswer.economicsStatus || 'UNRESOLVED',
                    priceCompleteness:storeAnswer.priceCompleteness || 'UNAVAILABLE',
                    material:storeAnswer.material,
                    machineService:storeAnswer.machineService,
                    combinedValue:storeAnswer.combinedValue,
                    complete:storeAnswer.complete === true,
                    estimate:storeEstimate,
                    calculationIdentity:storeAnswer.calculationIdentity || null,
                    refusalConditions:Array.from(new Set(refusals)),
                    unresolvedConditions:Array.from(new Set(unresolved)),
                    materialResolution:storeMaterialResolution,
                    source:storeAnswer.source || null,
                    authority:startOwnAuthority
                  },
                  lineage:{
                    reason:String(reason||'SYNC'),
                    storeCatalogPin:storeMaterialResolution?.source?.pin || catalogSource?.pin || null,
                    storeAnswerPin:storeAnswer.source?.storePin || null,
                    storeCalculationInputHash:storeAnswer.calculationIdentity?.inputHash || null,
                    storeCalculationResultHash:storeAnswer.calculationIdentity?.resultHash || null,
                    requestedDefinedWorkpieceLengthIn:definedWorkpieceLengthIn,
                    effectiveDefinedWorkpieceLengthIn:effectiveWorkpieceLengthIn,
                    storeSelectionPolicy:storeMaterialResolution?.selectionPolicy || null,
                    fixedHorizontalSpanIn:DEMO_HORIZONTAL_SPAN_IN,
                    achievedRiseIn:achievedRiseIn
                  },
                  physicalExecutionAuthorized:false
                };
                try {
                  win.localStorage.setItem('stb-start-own-user1-definition',JSON.stringify(currentUser1Definition));
                } catch (_) {}
                return currentUser1Definition;
              };

              const renderBoardGeometry = definition => {
                const demand = definition?.physicalDemand;
                if (!demand) return;
                ['stb-bench-static-parts','stb-bench-static-cuts','stb-bench-static-cut-markers','stb-bench-static-joint-note','stb-bench-static-spots','stb-bench-static-part1-label','stb-bench-static-part2-label','stb-bench-static-dims','stb-bench-part1-dim','stb-bench-part2-dim'].forEach(id => {
                  const el=childDoc.getElementById(id);
                  if(el) el.style.display='none';
                });
                // The bench page draws its own parts, cuts and spots, and places its spare and remain labels, from this demand.
                proofFrame.contentWindow?.postMessage({
                  type:'STB_BENCH_GEOMETRY',
                  demand:{
                    definedWorkpieceLengthIn:demand.definedWorkpieceLengthIn,
                    quantity:demand.quantity,
                    finishedLength:demand.finishedLength,
                    angleDegrees:demand.angleDegrees,
                    spotDemand:!!demand.spotDemand
                  }
                }, win.location.origin);
              };

              const renderBench = definition => {
                if (!definition) return;
                const demand = definition.physicalDemand;
                const sequence = definition.workpieceSequence;
                const retained = sequence?.status === 'SEQUENCED'
                  ? Number(sequence.finalRemainderIn)
                  : null;
                const holdIn = Number(sequence?.holdIn || 24);
                const spare = Number.isFinite(retained) ? Number((retained-holdIn).toFixed(6)) : null;
                const productionCuts = Number(demand.declaredSawCuts) || 0;
                const totalModeledCuts = Number(definition.storeReference.estimate?.travel?.derivedSawCuts) || productionCuts;
                const spots = Number(demand.declaredSpotCount) || 0;
                const material = definition.storeReference.materialResolution;
                const materialMapped = material?.status === 'MAPPED';
                const estimate = definition.storeReference.estimate || null;
                const totals = estimate?.totals || null;
                const economics = definition.storeReference.economicsStatus;
                const capabilityBasis = definition.capability?.basis || definition.capability?.status || 'UNRESOLVED';
                const storeComplete = definition.storeReference.complete === true;

                renderBoardGeometry(definition);
                setText('stb-config-parts-value',demand.quantity+' part'+(demand.quantity===1?'':'s'));
                setText('stb-config-length-value',
                  formatInches(demand.finishedLength)+' braces · stands about '+
                  formatInches(definition.derived.achievedRiseIn.value)+' · '+
                  formatDegrees(demand.angleDegrees)+' ends');
                setText('stb-config-angle-value',demand.angleDegrees+'° · both ends · parallel');
                setText('stb-config-spot-value',demand.spotDemand?'1 centered spot / part':'no spot');
                setText('stb-bench-workpiece-spec','2×4 · '+formatInches(demand.definedWorkpieceLengthIn));
                setText('stb-bench-length-spec',formatInches(demand.finishedLength));
                setText('stb-bench-angle-spec',formatDegrees(demand.angleDegrees));
                // The drawing names the board the Store actually picked, never a stale default.
                setText('stb-bench-stock-line','ONE '+boardName(demand.definedWorkpieceLengthIn)+' · one board, marked left to right · schematic');
                setText('stb-bench-parts-spec',String(demand.quantity));
                setText('stb-def-workpiece',formatInches(demand.definedWorkpieceLengthIn));
                setText('stb-def-parts',String(demand.quantity));
                setText('stb-def-length',demand.finishedLength+' in each');
                setText('stb-def-angle',Number(demand.angleDegrees).toFixed(3)+'° · derived to preserve 8.000 in span · both · parallel');
                setText('stb-def-spot',demand.spotDemand?'1 centered spot / part':'none');
                setText('stb-def-spot-location',demand.spotDemand
                  ? definition.derived.centerSpotAlongLengthIn.value+' in · derived from '+demand.finishedLength+' ÷ 2 · 3/16 in SPOT_ON_LOCATION demand'
                  : 'not requested');
                setText('stb-def-retained',Number.isFinite(retained)
                  ? formatInches(retained)+' · Store-returned travel result'
                  : 'STORE ANSWER REQUIRED FOR THIS REVISION');
                setText('stb-bench-spare-label',Number.isFinite(spare)?formatInches(spare)+' spare':'Store refresh required');
                setText('stb-bench-remain-label',Number.isFinite(retained)
                  ? formatInches(retained)+' remains · '+formatInches(holdIn)+' retained-control minimum · '+formatInches(spare)+' spare · Store returned'
                  : 'This changed definition has no Store-issued travel result in the static Review build.');
                setText('stb-bench-control-copy',Number.isFinite(retained)
                  ? 'Store returned '+formatInches(retained)+' remaining on the '+formatInches(demand.definedWorkpieceLengthIn)+' defined workpiece; '+formatInches(holdIn)+' is the Store travel model retained-control minimum.'
                  : 'The project definition changed. This browser does not decide Store capability or retained-control validity; a fresh Store answer is required.');
                setText('stb-bench-cut-copy','cut demand — '+formatDegrees(demand.angleDegrees)+' ends · '+productionCuts+' declared saw operation'+(productionCuts===1?'':'s')+' · '+demand.quantity+' part'+(demand.quantity===1?'':'s'));
                const cutsBold = childDoc.getElementById('stb-bench-cut-step');
                if (cutsBold) cutsBold.innerHTML = '<b>Cut it.</b> '+productionCuts+' cut'+(productionCuts===1?'':'s')+' along the one board — '+formatDegrees(demand.angleDegrees)+' each — make the '+demand.quantity+' part'+(demand.quantity===1?'':'s')+'.';
                const drillBold = childDoc.getElementById('stb-bench-drill-step');
                if (drillBold) drillBold.innerHTML = demand.spotDemand
                  ? '<b>Drill it.</b> One 3/16 in spot right in the middle of each part — '+formatInches(definition.derived.centerSpotAlongLengthIn.value)+' from either end.'
                  : '<b>Drill it.</b> No spot on this version.';
                const stubBold = childDoc.getElementById('stb-bench-stub-step');
                if (stubBold) stubBold.innerHTML = '<b>Keep the stub.</b> Two matching braces'+(Number.isFinite(retained)?', and the other '+formatInches(retained)+' of the board comes back to you.':', and the rest of the board comes back to you.');
                setText('stb-bench-workline','THAT’S THE WHOLE JOB · '+productionCuts+' CUT'+(productionCuts===1?'':'S')+' · '+spots+' SPOT'+(spots===1?'':'S')+' · '+(storeComplete?'HARDLY WORTH DRAGGING THE MITER SAW OUT':'ASK THE STORE'));

                // Make the Store's board choice visible when it moves past the 5-foot board.
                const swap = childDoc.getElementById('stb-bench-board-swap');
                if (swap) {
                  const picked = Number(demand.definedWorkpieceLengthIn);
                  const minimum = Number(definition.lineage?.requestedDefinedWorkpieceLengthIn) || 60;
                  const moved = Number.isFinite(picked) && picked > minimum;
                  swap.hidden = !moved;
                  if (!moved) swap.textContent = '';
                  if (moved) {
                    const feet = picked / 12;
                    const pickedPhrase = (Number.isInteger(feet) ? feet+'-foot 2×4 ('+picked+' in)' : picked+' in 2×4');
                    swap.innerHTML = '<b>The Store grabbed a longer board.</b> At '+formatInches(demand.finishedLength)+' a brace, a '+(minimum/12)+'-foot 2×4 wouldn’t leave the '+formatInches(holdIn)+' the machine needs to hold for the last cut — so it moved up to a '+pickedPhrase+'.'
                      +(Number.isFinite(retained) ? ' The extra comes back with your stub: '+formatInches(retained)+'.' : '');
                  }
                }
                // One line right under the choice: size, angle, board, price.
                const pickedBoard = Number(demand.definedWorkpieceLengthIn);
                const pickedFeet = pickedBoard / 12;
                const boardWords = Number.isInteger(pickedFeet) ? pickedFeet+'-foot 2×4' : formatInches(pickedBoard)+' 2×4';
                setText('stb-bench-price-line', formatInches(demand.finishedLength)+' braces · '+formatDegrees(demand.angleDegrees)+' ends · '
                  +(storeComplete ? boardWords+'.' : 'ask the Store.'));

                const svg = childDoc.getElementById('stb-user1-bench-svg');
                if (svg) {
                  svg.setAttribute(
                    'aria-label',
                    'This version calls for '+demand.quantity+' part'+(demand.quantity===1?'':'s')+' at '+Number(demand.finishedLength).toFixed(3)+' inches with '+Number(demand.angleDegrees).toFixed(3)+' degree ends, derived to preserve the same 8.000 inch horizontal span. '
                    +(demand.spotDemand?'One centered 3/16 in spot demand per part is derived at '+definition.derived.centerSpotAlongLengthIn.value+' inches. ':'No spot is requested. ')
                    +(Number.isFinite(retained)?'Store returned '+formatInches(retained)+' remaining.':'A fresh Store answer is required for this revision.')
                  );
                }

                setText('stb-material-required',
                  '1 × 2×4 × '+formatInches(demand.definedWorkpieceLengthIn)+' Store-selected workpiece · '+demand.quantity+' finished parts · project minimum remains 60 in');
                setText('stb-price-material',totals?.material==null?'NOT ESTABLISHED':'$'+Number(totals.material).toFixed(2));
                setText('stb-price-processing',totals?.machine_service==null?'NOT ESTABLISHED':'$'+Number(totals.machine_service).toFixed(2));
                setText('stb-price-total',totals?.Q==null ? 'NOT COMPLETE' : '$'+Number(totals.Q).toFixed(2));
                setText('stb-price-basis',estimate
                  ? 'Store-issued BudgetaryEstimate · material + modeled D-001 machine service · DECLARED_STAGE2_MODEL · not a commercial quote.'
                  : 'LIVE STORE EVALUATION REQUIRED · Store Zero will calculate capability, modeled time, economics, and Q for this exact definition when you confirm.');
                setText('stb-basis-sku',materialMapped?material.storeSku:'NOT MAPPED');
                setText('stb-basis-source-stock',materialMapped
                  ? material.quantity+' × '+material.stockLengthIn+' in 2×4 Store stock/pricing reference · Store-selected workpiece '+formatInches(demand.definedWorkpieceLengthIn)
                  : 'FRESH STORE ANSWER REQUIRED');
                setText('stb-basis-unit-price',materialMapped && Number.isFinite(Number(material.unitPrice)) ? '$'+Number(material.unitPrice).toFixed(2)+' / ea' : 'UNRESOLVED');
                setText('stb-basis-cell-family',materialMapped && Array.isArray(material.cellFamily) ? material.cellFamily.join(' · ') : 'UNRESOLVED');
                setText('stb-basis-supported-ops',materialMapped && Array.isArray(material.supportedOps) ? material.supportedOps.join(' · ') : 'UNRESOLVED');
                setText('stb-basis-clock',String(material?.source?.clock || catalogSource?.clock || '—'));
                setText('stb-basis-catalog-pin',String(material?.source?.pin || catalogSource?.pin || '—'));
                setText('stb-basis-capability',String(capabilityBasis)+' · '+String(definition.capability.status));
                setText('stb-basis-store-pin',String(definition.storeReference.source?.storePin || definition.storeReference.authority?.economicsPin || '—'));
                setText('stb-basis-economics',estimate?.status
                  ? estimate.status+' · '+String(estimate.completeness || 'UNRESOLVED')+' · STORE-ISSUED REFERENCE'
                  : String(economics));
                setText('stb-basis-pricing-engine',estimate?.engine ? estimate.engine.id+' · v'+estimate.engine.version : 'UNRESOLVED');
                setText('stb-basis-cycle-model',estimate?.cycle?.model || 'UNRESOLVED');
                setText('stb-basis-job-time',Number.isFinite(Number(estimate?.cycle?.T_job_min))
                  ? Number(estimate.cycle.T_job_min).toFixed(4)+' min · modeled · Store returned '+totalModeledCuts+' saw operations'
                  : 'UNRESOLVED');
                setText('stb-before-send',definition.storeReference.unresolvedConditions.length
                  ? definition.storeReference.unresolvedConditions.join(' · ')+'. No browser-side Store answer is substituted. A fresh Store evaluation will run when you confirm this exact revision.'
                  : 'The displayed Store reference is history/preview. Confirm requests a fresh Store Zero evaluation before the Store Answer step.');

                const answerLine = childDoc.getElementById('stb-system-answer');
                if (answerLine) {
                  answerLine.innerHTML = storeComplete
                    ? '<b>STORE</b> · exact promoted Store reference matched · '+String(material?.stockLengthIn || demand.definedWorkpieceLengthIn)+' in stock · '+Number(estimate.cycle.T_job_min).toFixed(4)+' modeled min · 3 saw operations · 2 spots · calculation '+String(estimate.calculationIdentity?.resultHash || '').slice(0,12)+'…'
                    : '<b>STORE</b> · LIVE STORE EVALUATION REQUIRED · confirm sends this exact definition to Store Zero; no browser-side Store answer is substituted.';
                }

                if (confirmButton) {
                  const runtimeAvailable = !!user1RuntimeBridge && typeof user1RuntimeBridge.request === 'function';
                  confirmButton.disabled = !runtimeAvailable;
                  confirmButton.title = runtimeAvailable
                    ? 'Confirm this exact definition and request a fresh Store Zero evaluation.'
                    : 'The deployed Store runtime connection is unavailable.';
                }
                activate('[data-length]','data-length',demand.finishedLength);
              };

              const syncAndRender = reason => {
                const definition = syncDefinition(reason);
                renderBench(definition);
                startOwnAdmitBench(definition);
                return definition;
              };
              const markRevision = () => { definitionRevision += 1; };

              syncStoreGlossary();
              syncAndRender('INITIAL');
              showStage(pendingStartOwnStage, pendingStartOwnFocus);

              benchButton?.addEventListener('click', () => {
                syncAndRender('BENCH_HANDOFF');
                showStage('bench');
              });
              benchBack?.addEventListener('click', () => {
                showStage('intent');
              });
              benchLibrary?.addEventListener('click', () => {
                selectJourneyProject(null);
                originalShow.call(win,'projects');
              });

              lengthInput?.addEventListener('input', () => {
                const next=Number(lengthInput.value);
                if (!Number.isFinite(next)) return;
                markRevision();
                syncAndRender('CUSTOMER_INPUT');
              });
              childDoc.querySelectorAll('[data-length]').forEach(button => {
                button.addEventListener('click', () => {
                  if (lengthInput) lengthInput.value = button.dataset.length;
                  markRevision();
                  syncAndRender('CUSTOMER_INPUT');
                });
              });
              childDoc.querySelectorAll('#stb-bench-species [data-species]').forEach(button => {
                button.addEventListener('click', () => {
                  childDoc.querySelectorAll('#stb-bench-species [data-species]').forEach(b => b.classList.toggle('on', b === button));
                  markRevision();
                  syncAndRender('CUSTOMER_INPUT');
                });
              });
              resetDemoButton?.addEventListener('click', () => {
                if (lengthInput) lengthInput.value = '16';
                markRevision();
                syncAndRender('RESET_DEMO');
              });

              if (confirmButton && confirmButton.dataset.stbHostConfirmBound !== 'true') {
                confirmButton.dataset.stbHostConfirmBound = 'true';
                confirmButton.addEventListener('click', async () => {
                  const definition = syncAndRender('CONFIRM');
                  if (!definition) return;
                  if (!user1RuntimeBridge || typeof user1RuntimeBridge.request !== 'function') {
                    setText('stb-before-send','STORE_RUNTIME_UNAVAILABLE · the deployed Store Zero connection is unavailable. Nothing was sent and no prior Store answer was reused.');
                    return;
                  }

                  const requestId = nextStoreRequestId(definition);
                  confirmButton.disabled = true;
                  setText('stb-before-send','ASKING STORE ZERO · this exact definition is being freshly evaluated. The displayed prior reference is not being reused.');

                  // The one Store handoff: this exact definition as one revision, through admit() then inquire().
                  let freshStoreBody = null;
                  try {
                    const inquiry = await startOwnInquire(startOwnRevision(definition), requestId);
                    if (!inquiry.reachedStore) {
                      confirmButton.disabled = false;
                      return;
                    }
                    freshStoreBody = inquiry.answer;
                  } catch (error) {
                    setText('stb-before-send',String(error?.message || 'STORE_ZERO_UNAVAILABLE')+' · Store Zero could not evaluate this definition. Nothing was sent downstream and no prior Store answer was reused.');
                    confirmButton.disabled = false;
                    return;
                  }

                  const freshEvaluation = freshStoreBody?.rawEvaluation || null;
                  const freshEstimate = freshStoreBody?.rawEstimate || null;
                  const freshReceipt = freshStoreBody?.evaluationReceipt || freshEvaluation?.evaluationReceipt || null;
                  const freshnessOk =
                    freshEvaluation?.freshEvaluation === true &&
                    freshReceipt?.requestId === requestId &&
                    freshReceipt?.authority?.storeRevision === freshStoreBody?.storePin;
                  const complete =
                    freshEvaluation?.status === 'SUPPORTABLE' &&
                    freshnessOk &&

    const alcoveChainState = { version:null, decision:null, order:null };
    function alcoveCurrentVersion() {
      const list = win.STBAlcoveVersions || [];
      return list.length ? list[list.length - 1] : null;
    }
    function alcoveCanonical(value) {
      if (Array.isArray(value)) return '[' + value.map(alcoveCanonical).join(',') + ']';
      if (value && typeof value === 'object') return '{' + Object.keys(value).sort().map(k => JSON.stringify(k) + ':' + alcoveCanonical(value[k])).join(',') + '}';
      return JSON.stringify(value === undefined ? null : value);
    }
    async function alcoveSha256(value) {
      const bytes = new TextEncoder().encode(alcoveCanonical(value));
      const digest = await win.crypto.subtle.digest('SHA-256', bytes);
      return [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2, '0')).join('');
    }
    function alcoveChainFacts() {
      const answer = win.STBAlcoveStoreAnswer || null;
      const receipt = answer?.evaluationReceipt || {};
      const authority = receipt.authority || {};
      const version = alcoveCurrentVersion();
      if (alcoveChainState.version !== (version?.n || null)) {
        alcoveChainState.version = version?.n || null;
        alcoveChainState.decision = null;
        alcoveChainState.order = null;
      }
      return { answer, receipt, authority, version };
    }

    function proofSimulationEconomics(){
      const storeReference=proofHandoff?.payload?.storeReference || null;
      const estimate=storeReference?.estimate || null;
      const totals=estimate?.totals || null;
      return {
        complete:storeReference?.complete===true || estimate?.complete===true,
        q:totals?.Q ?? estimate?.total ?? null,
        material:totals?.material ?? estimate?.material ?? storeReference?.materialResolution?.materialTotal ?? null,
        machineService:totals?.machine_service ?? estimate?.cellRecovery ?? null,
        cycleMin:estimate?.cycle?.T_job_min ?? null,
        remnantIn:estimate?.travel?.finalRemainderIn ?? storeReference?.estimate?.travel?.finalRemainderIn ?? null,
        sku:storeReference?.materialResolution?.storeSku || storeReference?.materialResolution?.pricingReferenceSku || null,
        resultHash:estimate?.calculationIdentity?.resultHash || storeReference?.calculationIdentity?.resultHash || null,
        storeReceipt:storeReference?.evaluationReceipt || null
      };
    }

    function proofSimulationKey(){
      if(proofHandoff?.source!=='start-own') return null;
      const payload=proofHandoff.payload||{};
      const economics=proofSimulationEconomics();
      const version=proofHandoff.storeHandoff?.versionId||payload.id||payload.versionId||payload.normalizedPart?.versionId||'IDENTIFIED';
      const receiptIdentity=economics.storeReceipt?.receiptHash||economics.storeReceipt?.requestId||economics.resultHash||'NO_STORE_RECEIPT';
      return String(version)+'|'+String(receiptIdentity);
    }

    function ensureProofSimulation(){
      const key=proofSimulationKey();
      if(!key) return null;
      if(!proofSimulation || proofSimulation.key!==key){
        proofSimulation={key:key,receipts:[],createdAt:new Date().toISOString()};
      }
      return proofSimulation;
    }

    function proofSimulationReceipt(type,detail){
      const sim=ensureProofSimulation();
      if(!sim) return null;
      const existing=sim.receipts.find(receipt=>receipt.type===type);
      if(existing) return existing;
      const economics=proofSimulationEconomics();
      const base=String(economics.storeReceipt?.receiptHash||economics.storeReceipt?.requestId||economics.resultHash||'REFERENCE')
        .replace(/[^a-z0-9]/gi,'').slice(0,12).toUpperCase() || 'REFERENCE';
      const sequence=String(sim.receipts.length+1).padStart(2,'0');
      const receipt={
        type:type,
        receiptId:'SIM-'+type.replace(/^SIMULATED_/,'').replace(/[^A-Z0-9]+/gi,'-')+'-'+base+'-'+sequence,
        at:new Date().toISOString(),
        detail:detail
      };
      sim.receipts.push(receipt);
      return receipt;
    }

    function proofSimulationHas(type){
      return !!ensureProofSimulation()?.receipts.some(receipt=>receipt.type===type);
    }

    function proofSimulationReceiptLabel(type){
      return ensureProofSimulation()?.receipts.find(receipt=>receipt.type===type)?.receiptId || null;
    }

      proofSimulationReceipt('SIMULATED_PRODUCTION_RELEASE','Simulated job release toward the local cell · no physical production authority created');
      proofSimulationReceipt('SIMULATED_MACHINE_NEUTRAL_PLAN','Portable operation sequence represented for the accepted definition · no controller code emitted');
      proofSimulationReceipt('SIMULATED_LOCAL_LOWERING','Candidate local lowering boundary represented · no commissioned postprocessor or CellProgramIdentity issued');

      proofSimulationReceipt('SIMULATED_OPERATOR_LOAD','Operator load instruction represented for the identified Store material · no physical material handled');
      proofSimulationReceipt('SIMULATED_CYCLE_START','Local Cycle Start represented as operator-owned · no live machine start');
      proofSimulationReceipt('SIMULATED_EXECUTION','Simulated job completed'+(Number.isFinite(Number(economics.cycleMin))?' · modeled '+Number(economics.cycleMin).toFixed(4)+' min':'')+' · no live motion or controller command');

    var startOwnTerms = window.STBTermsFlow ? window.STBTermsFlow.create({ projectId:'start-own', title:'Job 1 · X brace' }) : null;

    // ── Start your own · on the shared tile host ──────────────────────────────────────────────────
    // The bench's definition is one job-definition revision. Every Store inquiry goes through admit() then
    // inquire() (tile-host-admission-contract.mjs): a missing profile fact blocks before the Store and names its
    // owner; a complete revision reaches the Store whatever its values. The User 1 bridge is the transport inside
    // inquire() and accepts only the admitted request. The nav is drawn by the shared tile host from this tile's
    // STB-TILE-HOST-0.1 message.
    function startOwnConfigurationVersion(finishedLengthIn) {
      const endpoint16 = Math.abs(finishedLengthIn - 16) < 1e-9;
      const endpoint18 = Math.abs(finishedLengthIn - 18) < 1e-9;
      return endpoint16 ? '0.1' : endpoint18 ? '0.2' : 'review-intermediate-'+finishedLengthIn.toFixed(3);
    }
    function startOwnDeclaredSawCuts(partCount, angleDeg) {
      return angleDeg !== 0 ? partCount + 1 : partCount;
    }
    // One revision from the bench's definition. A fact the definition does not carry is left out, so admission
    // blocks on it rather than the page filling it in.
    function startOwnRevision(definition) {
      if (!definition || !definition.storeDemand) return null;
      const demand = definition.storeDemand;
      const facts = {};
      const fact = (id, value, status) => { if (value !== undefined && value !== null) facts[id] = { value, status }; };
      fact('start-own.material', definition.material?.stated ? { ...definition.material.stated } : null, 'CONFIRMED');
      fact('start-own.workpiece-length', demand.definedWorkpieceLengthIn, 'CONFIRMED');
      fact('start-own.parts', demand.parts, 'CONFIRMED');
      fact('start-own.operations', demand.requiredOps, 'DERIVED');
      fact('start-own.datum', { sawAngleDeg:demand.sawAngleDeg, cutPlane:demand.cutPlane, endIdentity:demand.endIdentity,
        endRelation:demand.endRelation, lengthDatum:demand.lengthDatum, datumCMethod:demand.datumCMethod }, 'DERIVED');
      const spot = definition.physicalDemand?.spotDemand || null;
      fact('start-own.spot-demand', spot ? { ...spot } : { required:false }, 'CONFIRMED');
      return { definitionRevisionId:definition.versionId, tileId:START_OWN_PROJECT_ID, facts };
    }
    // The Store demand, built only from the admitted request's facts.
    function startOwnStoreDemandFrom(request) {
      const f = request.facts;
      const parts = f['start-own.parts'];
      const datum = f['start-own.datum'];
      const spot = f['start-own.spot-demand'];
      return {
        configurationId:START_OWN_CONFIGURATION_ID,
        configurationVersion:startOwnConfigurationVersion(Number(parts[0]?.lengthIn)),
        definedWorkpieceLengthIn:f['start-own.workpiece-length'],
        sawAngleDeg:datum.sawAngleDeg,
        cutPlane:datum.cutPlane,
        endIdentity:datum.endIdentity,
        endRelation:datum.endRelation,
        lengthDatum:datum.lengthDatum,
        datumCMethod:datum.datumCMethod,
        requiredOps:f['start-own.operations'],
        declaredSawCuts:startOwnDeclaredSawCuts(parts.length, datum.sawAngleDeg),
        declaredSpotCount:spot.required === true ? Number(spot.totalCount) || 0 : 0,
        parts
      };
    }
    function startOwnAdmitted() {
      return startOwnLive.admission?.admission?.result === tileHostContract.ADMISSION_RESULT.ADMITTED;
    }
    // Every change on the bench is a revision; it is admitted (never asked) so the nav reflects it.
    function startOwnAdmitBench(definition) {
      const revision = startOwnRevision(definition);
      if (revision && startOwnLive.admission?.definitionRevisionId === revision.definitionRevisionId
          && JSON.stringify(revision) === JSON.stringify(startOwnLive.revision)) { startOwnPublish(); return; }
      startOwnLive.revision = revision;
      startOwnLive.admission = tileHostContract.admit({ revision, inquiryScope:START_OWN_INQUIRY_SCOPE });
      startOwnLive.blocking = startOwnLive.admission.admission.blocking.map(b => ({ ...b }));
      renderStartOwnTerms();
    }
    // The one inquiry path. admit() decides whether this revision may be asked about at all; only an admitted
    // revision is sent, through inquire(), and admission never checks the envelope: the Store does.
    async function startOwnInquire(revision, requestId = null) {
      const admission = tileHostContract.admit({ revision, inquiryScope:START_OWN_INQUIRY_SCOPE });
      const token = ++startOwnLive.token;
      startOwnLive.admission = admission;
      startOwnLive.answer = null;
      startOwnLive.blocking = admission.admission.blocking.map(b => ({ ...b }));
      startOwnLive.asking = startOwnAdmitted();
      renderStartOwnTerms();
      if (!startOwnLive.asking) {
        // Not sent: the bench names each missing fact and its owner.
        const line = doc.getElementById('start-own-proof-frame')?.contentDocument?.getElementById('stb-before-send');
        if (line) line.textContent = 'NOT SENT TO THE STORE · MISSING: '+startOwnLive.blocking.map(b => b.title+' · owner '+b.owner).join('; ')+'. Nothing was sent and no prior Store answer was reused.';
      }
      try {
        const result = await tileHostContract.inquire(admission, request => {
          if (!user1RuntimeBridge || typeof user1RuntimeBridge.request !== 'function') throw new Error('STORE_RUNTIME_UNAVAILABLE');
          return user1RuntimeBridge.request(request, startOwnStoreDemandFrom(request), { requestId });
        });
        if (token === startOwnLive.token) startOwnLive.answer = result.answer;
        return result;
      } finally {
        if (token === startOwnLive.token) { startOwnLive.asking = false; renderStartOwnTerms(); }
      }
    }
    function startOwnWithinEnvelope(answer) {
      return answer.rawEvaluation?.status === 'SUPPORTABLE' && answer.priceCompleteness?.status === 'COMPLETE_FOR_TRAVEL_STANDARD';
    }
    // The answer inquire() returned for the revision on the bench, while nothing newer is being asked and the
    // pages after the bench carry it; otherwise null. Only isCurrentAnswer() decides: a blocked, failed, saved or
    // superseded answer, or one for another revision or another inquiry scope, is never current.
    function startOwnCurrentAnswer() {
      const admission = startOwnLive.admission;
      const answer = startOwnLive.answer;
      if (!admission || !answer || startOwnLive.asking || !startOwnAdmitted()) return null;
      if (admission.definitionRevisionId !== startOwnLive.revision?.definitionRevisionId) return null;
      if (!tileHostContract.isCurrentAnswer({ admission, answer })) return null;
      if (proofHandoff?.source !== START_OWN_PROJECT_ID || proofHandoff.payload?.versionId !== answer.definitionRevisionId) return null;
      return answer;
    }
    // This tile's STB-TILE-HOST-0.1 message. Intent, the bench, The Store answers and Your call come from the
    // contract's availableSteps() for the bench's admission and fresh answer. The Store answers shows that answer,
    // so it waits for one; Your call also waits for the terms flow (callOpen); We cut it and Pick up & build stay
    // with the terms flow's gates, behind Your call. The stage is the step the shown page (and, on the Start your
    // own page, its Intent or bench screen) stands for; its Idea screen is the Idea intake, where the tile opens.
    function startOwnHostMessage() {
      const steps = trailContract.steps;
      const answer = startOwnCurrentAnswer();
      const freshAnswer = answer ? { authority:answer.authority, definitionRevisionId:answer.definitionRevisionId, inquiryScope:answer.inquiryScope, withinEnvelope:startOwnWithinEnvelope(answer) } : null;
      const t = startOwnTerms?.state() || null;
      const usable = tileHostContract.availableSteps({ trail:trailContract, admission:startOwnLive.admission, freshAnswer })
        .filter(step => step !== steps[2] || !!answer)
        .filter(step => step !== steps[3] || !t || t.callOpen);
      if (usable.includes(steps[3]) && t?.yardOpen) usable.push(steps[4]);
      if (usable.includes(steps[3]) && t?.recordOpen) usable.push(steps[5]);
      const shown = tileHostShownPage();
      let index = tileHostStepOfPage(START_OWN_PROJECT_ID, shown);
      const screen = index === 0 ? doc.getElementById(shown)?.dataset.revStage : null;
      if (screen === 'bench') index = 1;
      return {
        interface:tileHostContract.TILE_HOST_VERSION,
        tileId:START_OWN_PROJECT_ID,
        stage:screen === 'idea' ? trailContract.idea.label : steps[index ?? 0],
        usableSteps:usable,
        navigationRequest:null
      };
    }
    function startOwnPublish() {
      if (tileHostActive(START_OWN_PROJECT_ID)) receiveTileHostMessage(startOwnHostMessage());
    }

    function feedStartOwnTerms(){
      if(!startOwnTerms) return;
      const ref=startOwnCurrentAnswer() ? proofHandoff.payload.storeReference : null;
      if(!ref){ startOwnTerms.setAnswer(null); return; }
      const economics=proofSimulationEconomics();
      const receipt=ref.evaluationReceipt||null;
      const supportable=ref.status==='SUPPORTABLE' && economics.complete===true && Number.isFinite(Number(economics.q));
      const reasons=[...(ref.refusalConditions||[]),...(ref.unresolvedConditions||[])].map(code=>({code:String(code),text:''}));
      startOwnTerms.setAnswer({
        version:String(proofHandoff.storeHandoff?.versionId||proofHandoff.payload?.id||'job-1')+'|'+String(receipt?.requestId||ref.wire?.requestId||''),
        status:supportable?'SUPPORTABLE':(ref.status==='SUPPORTABLE'?'UNRESOLVED':ref.status||'UNRESOLVED'),
        total:economics.q, reasons,
        body:{ payloadDigest:ref.wire?.payloadDigest||null, demandSignature:ref.wire?.demandSignature||null, requestId:receipt?.requestId||ref.wire?.requestId||null,
          storePin:ref.source?.storePin||ref.wire?.storePin||null, evaluationReceipt:receipt, calculationIdentity:ref.calculationIdentity||null },
        sentAt:ref.wire?.sentAt||null
      });
    }
    function renderStartOwnTerms(){
      if(startOwnTerms){

    win.STBStartOwnLive = Object.freeze({

    function handleProofSimulationAction(action){

          ? 'Store Zero · tested reference '+String(storeReference.source.storePin).slice(0,12)+'…'

    // ── Shared tile host · STB-TILE-HOST-0.1 ─────────────────────────────────────────────────────────
    // A tile on the shared host registers once, keyed by its id. It hands the host plain STB-TILE-HOST-0.1
    // messages; the host validates each one against the trail contract and draws the one nav line from it
    // (hostNavLine). The host never reads a tile's definition or Store state, and a usable step never asks
    // the Store. Which tile owns a page comes from the trail contract. An invalid message is rejected and the
    // tile's steps go inert until a valid one arrives.
    const tileHosts = new Map();
    const tileHostLines = new Map();
    // The last validated message per tile (the fork's pressed option is read from it), and the last message a
    // framed tile posted, which the host validates whenever that tile becomes active.
    const tileHostMessages = new Map();
    const tileHostPosted = new Map();
    // Journey stage keys on the nav buttons, as indexes into the trail contract's six steps.
    const JOURNEY_STAGE_STEP = Object.freeze({ scan:0, configure:1, store:2, review:2, request:3, yard:4, terms:4, recap:5, record:5 });
    // hooks: report() returns the tile's current message; shown(pageId) runs when one of its pages is shown.
    // A tile in its own frame gives frame() instead: it posts {type:'STB_TILE_HOST', message} from that frame and
    // the host asks it for a trail target (Idea, a step, or a declared fork option) with STB_TILE_HOST_GO.
    // idea: the tile has an Idea page, so from Intent on the host draws Idea as its back control.
    function registerTileHost(tileId, hooks) {
      if (!trailContract.tiles.some(tile => tile.id === tileId)) throw new TypeError('TILE_NOT_DECLARED: ' + tileId);
      const frame = hooks.frame || null;
      tileHosts.set(tileId, Object.freeze({
        report:hooks.report || (() => tileHostPosted.get(tileId) ?? null),
        shown:hooks.shown || null,
        frame,
        go:hooks.go || (frame ? target => frame()?.contentWindow?.postMessage({ type:'STB_TILE_HOST_GO', target }, win.location.origin) : null),
        idea:hooks.idea === true
      }));
    }
    function tileHostGo(tileId, target) {
      tileHosts.get(tileId)?.go?.(target);
    }
    // A framed tile speaks only from its own frame and only for itself.
    win.addEventListener('message', function(event) {
      if (event.origin !== win.location.origin || event.data?.type !== 'STB_TILE_HOST') return;
      for (const [tileId, host] of tileHosts) {
        if (!host.frame || event.source !== host.frame()?.contentWindow) continue;
        const message = event.data.message ?? null;
        if (message?.tileId !== tileId) {
          tileHostPosted.delete(tileId);
          tileHostLines.delete(tileId);
          tileHostMessages.delete(tileId);
          doc.documentElement.dataset.tileHostRejected = 'TILE_FRAME_MISMATCH';
          applyTileHostNav();
          return;
        }
        tileHostPosted.set(tileId, message);
        if (tileHostActive(tileId)) receiveTileHostMessage(message);
        return;
      }
    });
    function tileHostActive(tileId) {
      return activeJourneyProject === tileId;
    }
    function tileHostShownPage() {
      return [...doc.querySelectorAll('.page.on')].pop()?.id || null;
    }
    // The trail step a tile's own page stands for, from the shell's stage map for that tile; null off its pages.
    function tileHostStepOfPage(tileId, pageId) {
      const stages = PROJECT_STAGE_TARGETS[tileId] || {};
      const stage = Object.keys(stages).find(key => stages[key] === pageId);
      return stage ? JOURNEY_STAGE_STEP[stage] : null;
    }
    function receiveTileHostMessage(message) {
      const check = tileHostContract.validateTileHostMessage(trailContract, message);
      if (!check.ok) {
        if (message && typeof message.tileId === 'string') { tileHostLines.delete(message.tileId); tileHostMessages.delete(message.tileId); }
        doc.documentElement.dataset.tileHostRejected = check.errors.join(' ');
      } else {
        delete doc.documentElement.dataset.tileHostRejected;
        tileHostLines.set(message.tileId, tileHostContract.hostNavLine(trailContract, message));
        tileHostMessages.set(message.tileId, message);
      }
      applyTileHostNav();
      return check;
    }
    function refreshTileHost(tileId) {
      const host = tileHosts.get(tileId);
      if (!host) return;
      const message = host.report();
      // A tile that has not spoken yet has nothing to validate: its steps stay inert until it does.
      if (message == null) { tileHostLines.delete(tileId); tileHostMessages.delete(tileId); applyTileHostNav(); return; }
      receiveTileHostMessage(message);
    }
    // The Idea line, from the trail contract: Idea as the back control after the Project Library, and on the line a
    // tile's declared fork lives on, that fork's options with the message's choice pressed. Presentation only: each
    // control asks the tile for its target, and nothing here admits or asks anything.
    function drawTileHostIdeaLine(nav, tileId) {
      const host = tileHosts.get(tileId);
      const line = tileHostLines.get(tileId) || null;
      const message = tileHostMessages.get(tileId) || null;
      if (line && !line.stepBarShown) nav.dataset.ideaLine = 'true';
      else delete nav.dataset.ideaLine;
      if (!host?.go || !host.idea) return;
      const control = (className, label) => {
        const button = doc.createElement('button');

        button.className = className + ' tile-host-only';
        button.textContent = label;

      };
      const lib = nav.querySelector('button[data-job-exit="project-library"]');
      const declared = trailContract.presentationForks.find(item => item.tileId === tileId && item.line === trailContract.idea.label) || null;
      let fork = nav.querySelector('.trail-fork');
      if (declared && !fork) {
        fork = doc.createElement('span');
        fork.className = 'trail-fork tile-host-only';
        const label = doc.createElement('span');

      let onward = nav.querySelector('.job-idea-onward');
      if (!declared && !onward) onward = control('job-idea-onward', trailContract.steps[0]);
      if (onward && lib && lib.nextElementSibling !== onward) lib.after(onward);
      let idea = nav.querySelector('.job-idea');
      if (!idea) idea = control('job-idea', trailContract.idea.label);
      const before = fork || onward || lib;
      if (fork && lib && lib.nextElementSibling !== fork) lib.after(fork);
      if (before && before.nextElementSibling !== idea) before.after(idea);
      idea.removeAttribute('aria-current');
      fork?.querySelectorAll('[data-presentation-fork]').forEach(button => {
        const on = button.dataset.presentationFork === message?.presentationFork;
        button.classList.toggle('on', on);

    // One nav line from the last validated message: contract labels, inert steps disabled (never hidden), one current.
    function applyTileHostNav() {
      const nav = doc.querySelector('.recovery-nav');
      const tileId = activeJourneyProject || '';
      if (!nav || !tileHosts.has(tileId)) return;

        if (index === undefined) return;
        button.textContent = `${index + 1} · ${trailContract.steps[index]}`;
        const step = line ? line.steps[index] : null;
        const on = !!step?.enabled;

        else button.setAttribute('aria-disabled','true');

    // null: the tile is not on the shared host. Otherwise whether its last validated message made this step usable.
    function tileHostStageOpen(tileId, stage) {
      if (!tileHosts.has(tileId)) return null;
      const index = JOURNEY_STAGE_STEP[stage];
      return index !== undefined && !!tileHostLines.get(tileId)?.steps[index]?.enabled;
    }
    // The base page's show() marks every nav button that targets the shown page; a tile on the host is redrawn from
    // its last validated message, so exactly one step stays current.
    function tilePageShown(pageId) {
      applyTileHostNav();
      const owner = trailContract.tiles.find(tile => tile.pages.includes(pageId));
      tileHosts.get(owner?.id)?.shown?.(pageId);
    }

    // ── Playhouse · the live Store answers every version of the sheet ─────────────────────────────
    // The page carries the project's own definition to the pinned Store through the shared client and
    // shows what comes back. It never answers for the Store, never reuses an earlier answer for a changed
    // version, and never changes the geometry to get a yes. Every inquiry is one job-definition revision
    // through admit() (tile-host-admission-contract.mjs): a missing profile fact blocks before the Store and
    // names its owner; a complete revision reaches the Store whatever its values. The nav is drawn by the
    // shared tile host from this tile's STB-TILE-HOST-0.1 message. Steps 4–6 open only on a SUPPORTABLE
    // answer for the version on screen.
    const S001_PROJECT_ID = 'playhouse';
    const S001_REQUEST_TYPE = 'SHEET_PACKAGE_V1';
    const S001_INQUIRY_SCOPE = 'SHEET_PACKAGE_V1';
    const S001_SHEET = S001_KNOWN.sheet;
    const s001Live = { token:0, asking:false, answer:null, error:null, version:null, timer:null, admission:null, blocking:[] };
    const s001Positive = value => Number.isFinite(value) && value > 0;
    // One job-definition revision from what is on screen. The opening is User 1's; the sheet is the project's.
    // A fact that is not there is left out, so admission blocks on it rather than the page filling it in.
    function s001Revision(g) {
      const facts = {
        'playhouse.sheet': { value:{ ...S001_SHEET }, status:'CONFIRMED' }
      };
      if (s001Positive(g.width) && s001Positive(g.straight) && s001Positive(g.rise)) {
        facts['playhouse.opening'] = { value:{ widthIn:g.width, straightHeightIn:g.straight, riseIn:g.rise }, status:'CONFIRMED' };
      }
      return {
        definitionRevisionId:`playhouse-w${g.width}-s${g.straight}-r${g.rise}-t4-c18x18`,
        tileId:S001_PROJECT_ID,
        facts
      };
    }
    // The sheet definition the Store is asked about, built only from the admitted request's facts.
    function s001DefinitionFrom(request) {
      const sheet = request.facts['playhouse.sheet'];
      const opening = request.facts['playhouse.opening'];
      return {
        configurationId:'PLAYHOUSE-ARCHED-WINDOW',
        configurationVersion:request.definitionRevisionId,
        sheet:{ thicknessIn:sheet.thicknessIn, lengthIn:sheet.lengthIn, widthIn:sheet.widthIn },
        features:[
          { featureId:'OPENING', kind:'ARCHED_APERTURE', placement:'CENTERED', widthIn:opening.widthIn, straightHeightIn:opening.straightHeightIn, riseIn:opening.riseIn, retain:'TABS', requestedTabCount:4 },
          { featureId:'CENTER-SPLIT', kind:'STRAIGHT_SPLIT', within:'OPENING', line:'VERTICAL_CENTERLINE' },
          { featureId:'CUT-LEFT', kind:'CROSSCUT', fromEnd:'LEFT', distanceIn:18 },
          { featureId:'CUT-RIGHT', kind:'CROSSCUT', fromEnd:'RIGHT', distanceIn:18 }
        ],
        returnAllPieces:true
      };
    }
    function s001Admitted() {
      return s001Live.admission?.admission?.result === tileHostContract.ADMISSION_RESULT.ADMITTED;
    }
    // The answer inquire() returned for the revision last asked about, while nothing newer is being asked and that
    // revision is the one on the page now; otherwise null. Only isCurrentAnswer() decides: a failed, saved or
    // superseded answer, or one for another revision or another inquiry scope, is never current authority.
    function s001CurrentAnswer() {
      const a = s001Live.answer;
      if (s001Live.asking || s001Live.error || !a || a.version !== s001Live.version) return null;
      if (s001Live.admission?.definitionRevisionId !== s001Revision(read()).definitionRevisionId) return null;
      return tileHostContract.isCurrentAnswer({ admission:s001Live.admission, answer:a }) ? a : null;
    }
    var s001Terms = window.STBTermsFlow ? window.STBTermsFlow.create({ projectId:'playhouse', title:'Playhouse arched window' }) : null;
    window.STBTermsFlow?.installStyle(doc);
    function s001FeedTerms() {
      if (!s001Terms) return;
      const a = s001CurrentAnswer();
      if (!a) { s001Terms.setAnswer(null); return; }
      const ev = a.evaluation;
      s001Terms.setAnswer({ version:a.version, status:ev.status, total:ev.totals?.Q ?? null,
        reasons:(ev.reasonRecords || []).map(r => ({ code:r.code, text:r.explanation })), body:a.body, sentAt:a.sentAt });
    }
    function s001RenderTerms() {
      if (!s001Terms) return;
      doc.querySelectorAll('.s001-terms-host').forEach(host => {
        const step = host.dataset.termsStep;
        host.innerHTML = (step === 'chain' ? '' : s001Terms.renderControls(step)) + s001Terms.renderChain();
      });
      const t = s001Terms.state();
      doc.querySelectorAll('[data-s001-needs]').forEach(button => {
        const open = button.dataset.s001Needs === 'yard' ? t.yardOpen : button.dataset.s001Needs === 'record' ? t.recordOpen : false;
        button.disabled = !open;
        if (open) button.removeAttribute('aria-disabled'); else button.setAttribute('aria-disabled','true');
      });

    }
    if (s001Terms) {
      s001Terms.onChange(s001RenderTerms);
      doc.querySelectorAll('.s001-terms-host').forEach(host => s001Terms.bind(host, (action, t) => {
        if (action === 'accept' && t.stage === 'QUEUED') originalShow.call(win, 'playhouse-yard');
        else if (action === 'yard' && t.stage === 'READY') originalShow.call(win, 'playhouse-record');
        s001RenderTerms();
      }));
    }
    function s001Supportable() {
      return s001CurrentAnswer()?.evaluation?.status === 'SUPPORTABLE';
    }
    // The fresh answer availableSteps() reads: current authority, for this exact revision and inquiry scope, inside
    // the envelope or not.
    function s001FreshAnswer() {
      const a = s001CurrentAnswer();
      if (!a) return null;
      return { authority:a.authority, definitionRevisionId:a.definitionRevisionId, inquiryScope:a.inquiryScope, withinEnvelope:a.evaluation?.status === 'SUPPORTABLE' };
    }
    // This tile's STB-TILE-HOST-0.1 message. Intent, the bench and The Store answers come from the contract's
    // availableSteps(); We cut it and Pick up & build stay with the terms flow's gates, behind Your call.
    function s001HostMessage() {
      const steps = trailContract.steps;
      const usable = [...tileHostContract.availableSteps({ trail:trailContract, admission:s001Live.admission, freshAnswer:s001FreshAnswer() })];
      const t = s001Terms?.state() || null;
      if (usable.includes(steps[3]) && t?.yardOpen) usable.push(steps[4]);
      if (usable.includes(steps[3]) && t?.recordOpen) usable.push(steps[5]);
      // A page that stands for no step is the Idea intake: the tile opens there, before Intent.
      const index = tileHostStepOfPage(S001_PROJECT_ID, tileHostShownPage());
      return {
        interface:tileHostContract.TILE_HOST_VERSION,
        tileId:S001_PROJECT_ID,
        stage:index == null ? trailContract.idea.label : steps[index],
        usableSteps:usable,
        navigationRequest:null
      };
    }
    function s001Publish() {

    annotateJourneyNav();
    if (!canonicalJourneyReady()) return false;
    doc.documentElement.dataset.canonicalJourneyVersion = canonicalJourney.version;
    return true;
  };

  const scheduleApply = () => {
    let attempts = 0;
    const timer = setInterval(() => {
      attempts += 1;
      try {
        if (apply() || attempts > 200) clearInterval(timer);
      } catch (error) {
        if (attempts > 200) clearInterval(timer);
      }
    }, 50);
  };
  shell.addEventListener('load', scheduleApply);
  if (shell.contentDocument?.readyState === 'complete') scheduleApply();
})();
</script>

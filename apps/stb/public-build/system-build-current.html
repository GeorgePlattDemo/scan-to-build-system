<script>
(() => {
  const shell = document.getElementById('stb-current');
  const apply = () => {
    const shellWin = shell.contentWindow;
    const shellDoc = shellWin?.document;
    const inner = shellDoc?.getElementById('stb-current');
    if (!inner) return false;
    const win = inner.contentWindow;
    const doc = win?.document;
    if (!doc || typeof win.show !== 'function' || !doc.getElementById('playhouse-record')) return false;
    if (doc.documentElement.dataset.s001OutcomeSplit === 'true') return true;
    doc.documentElement.dataset.s001OutcomeSplit = 'true';

    const style = doc.createElement('style');
    style.textContent = `
      .window-seat-shell-page{padding:0!important;overflow:hidden;background:var(--surface)}

      .proof-nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.proof-nav button{font:inherit;font-size:11px;padding:7px 11px;border:1px solid var(--border);border-radius:7px;background:var(--surface);cursor:pointer}.proof-nav .next{margin-left:auto;color:var(--accent);font-weight:700}
      .dev-build-guide{gap:0;overflow-wrap:anywhere}
      .dev-build-guide .hd{margin-bottom:12px}

      .s001-v2-key.out{height:9px;border:0;background:rgba(176,55,52,.18);outline:1px solid rgba(176,55,52,.55)}
      .s001-v2-seq{display:grid;gap:7px;margin:12px 0}
      .s001-v2-seq .row{display:grid;grid-template-columns:28px 1fr;gap:9px;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
      .s001-v2-seq .n{font-size:10px;font-weight:800;color:var(--accent)}
      .s001-v2-seq b,.s001-v2-seq span{display:block}
      .s001-v2-seq b{font-size:11px}.s001-v2-seq span{margin-top:2px;font-size:10.5px;color:var(--text2);line-height:1.35}
      .s001-v2-store-split{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:9px;margin:12px 0}
      .s001-v2-store-card{border:1px solid var(--border);border-radius:9px;background:var(--surface);padding:11px}
      .s001-v2-store-card h3{margin:0 0 7px;font-size:12px}.s001-v2-store-card p{margin:5px 0;font-size:11px;line-height:1.45}
      .s001-v2-pass{border-left:4px solid #557b58}.s001-v2-separate{border-left:4px solid #9b7540}
      .s001-v2-order{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:7px;margin:12px 0}
      .s001-v2-order>div{border:1px solid var(--border);border-radius:8px;padding:9px;background:var(--surface)}
      .s001-v2-order b,.s001-v2-order span{display:block}.s001-v2-order b{font-size:9px;letter-spacing:.05em;color:var(--text2)}.s001-v2-order span{margin-top:3px;font-size:11.5px}
      .seat-guided-stage .stage-tag{margin:0 0 5px;font-size:9px;font-weight:700;letter-spacing:.09em;color:var(--accent)}
      .seat-guided-stage .lede{margin:0 0 10px;font-size:13.5px;color:var(--text2);line-height:1.55}
      .seat-guided-stage .ws-journey-section{padding:13px 0;border-top:1px solid var(--border)}
      .seat-guided-stage .ws-journey-section:first-of-type{border-top:0}
      .seat-guided-stage .ws-journey-section h2{font-size:15px;margin:0 0 6px}
      .seat-guided-stage .ws-journey-section p{margin:0 0 7px;line-height:1.5}
      .seat-guided-stage .ws-journey-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin:10px 0}
      .seat-guided-stage .ws-journey-grid .kv{display:block;border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:8px 10px}
      .seat-guided-stage .ws-journey-grid .kv span{display:block}
      .seat-guided-stage .ws-journey-grid .kv span:first-child{font-size:9px;font-weight:700;letter-spacing:.05em;color:var(--text2)}
      .seat-guided-stage .ws-journey-grid .kv span:last-child{margin-top:3px;font-size:11.5px;color:var(--text)}
      .seat-guided-stage .ws-journey-callout{margin:11px 0;padding:10px 12px;border-left:3px solid var(--border-accent);background:var(--surface);font-size:12px;line-height:1.5}
      .seat-guided-stage .ws-journey-callout.warn{border-left-color:#9b7540}
      .seat-guided-stage .ws-journey-flow{font:11px/1.8 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text2)}
      .seat-guided-stage .stage-bottom{display:flex;align-items:center;gap:8px;margin-top:18px;padding-top:12px;border-top:1px solid var(--border)}
      .seat-guided-stage .stage-bottom button{font:inherit;font-size:11px;padding:6px 11px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer}
      .seat-guided-stage .stage-bottom .next{margin-left:auto;border:0;background:transparent;color:var(--accent);font-weight:650}
      .seat-guided-stage .stage-fine{font-size:9.5px;color:var(--text2)}
      .seat-guided-stage .s{padding:13px 0;border-top:1px solid var(--border)}
      .seat-guided-stage .s .h{display:flex;gap:9px;align-items:baseline;margin-bottom:5px;flex-wrap:wrap}
      .seat-guided-stage .s .num{font-size:10px;font-weight:700;letter-spacing:.07em;color:var(--text2)}
      .seat-guided-stage .s .name{font-size:13.5px;font-weight:600}
      .seat-guided-stage .s .st{margin-left:auto;font-size:9.5px;font-weight:700;letter-spacing:.05em;padding:2px 7px;border-radius:3px;background:var(--surface);color:var(--text2);border:1px solid var(--border)}
      .seat-guided-stage .s p{margin:0 0 7px;color:var(--text2)}
      .seat-guided-stage .s p.q{font-size:12px;padding-left:11px;border-left:2px solid var(--border-accent)}
      .seat-guided-stage .ops{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin:11px 0 3px}
      .seat-guided-stage .ops .t{margin:0 0 7px;font-size:9.5px;font-weight:700;letter-spacing:.08em;color:var(--accent)}
      .seat-guided-stage .ops .chain{font:11.5px/1.9 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text2);margin:0 0 8px}
      .seat-guided-stage .close{border-top:1px solid var(--border-accent);margin-top:16px;padding-top:14px}
      .seat-guided-stage .close p{margin:0 0 9px;color:var(--text2)}
      @media(max-width:820px){.s001-v2-intent-grid,.s001-v2-machine-grid{grid-template-columns:1fr}.seat-guided-stage .ws-journey-grid{grid-template-columns:1fr}}
    `;
    doc.head.append(style);

    let activeJourneyProject = null;
    let seatJourneySnapshot = null;
    let proofHandoff = null;
    let proofSimulation = null;
    const storeHandoffContract = window.STBStoreHandoffContract || null;
    const user1RuntimeBridge = window.STBUserDefinedBoardRuntimeBridge || null;
    let captureStartOwnProof = () => {};
    let pendingSeatView = {mode:'continuous',stage:null};

    const home = doc.getElementById('projects');
    if (home) {
      home.querySelector('[data-canonical-home-return]')?.remove();

      const ribbon = home.querySelector(':scope > .split > .ribbon');
      if (ribbon) {
        ['start-own','picnic-chooser','alcove-capture','window-intake','window-parts'].forEach(id => {
          const tile = ribbon.querySelector(`.tile[data-go="${id}"]`);
          if (tile) ribbon.append(tile);
        });

        const proofLabels = Object.freeze([
          ['start-own','TEST 01 · FROM A BOARD'],
          ['picnic-chooser','TEST 02 · FROM A BOUNDED PROJECT'],
          ['alcove-capture','TEST 03 · FIT THE SPACE'],
          ['window-intake','TEST 04 · DEFINE THE ASSEMBLY'],
          ['window-parts','TEST 05 · CHANGE THE MATERIAL STREAM']
        ]);
        proofLabels.forEach(([id,label]) => {
          const tile = ribbon.querySelector(`.tile[data-go="${id}"]`);
          if (!tile || tile.querySelector('[data-proof-test]')) return;
          const marker = doc.createElement('span');
          marker.dataset.proofTest = id;
          marker.textContent = label;
          marker.style.cssText = 'display:block;margin:0 0 4px;font-size:8px;line-height:1.2;font-weight:700;letter-spacing:.04em;color:var(--text3)';
          tile.prepend(marker);
        });

        const startOwnTile = ribbon.querySelector('.tile[data-go="start-own"]');
        if (startOwnTile) {
          startOwnTile.removeAttribute('data-go');
          startOwnTile.dataset.startOwnArtifact = 'three-frames.html';
          startOwnTile.title = 'Start Your Own · User 1 · definition to doing';

          let startOwnPage = doc.getElementById('start-own-live');
          if (!startOwnPage) {
            startOwnPage = doc.createElement('section');
            startOwnPage.className = 'page start-own-shell-page';
            startOwnPage.id = 'start-own-live';
            startOwnPage.innerHTML = `
              <div class="start-own-shell-main">
                <iframe
                  id="start-own-proof-frame"
                  class="start-own-shell-frame"
                  title="Start Your Own · User 1 · definition to doing"
                  src="three-frames.html?v=8fbe4542"
                ></iframe>
              </div>
            `;
            doc.querySelector('.wrap')?.append(startOwnPage);
          }

          const liveFrame = startOwnPage.querySelector('#start-own-proof-frame');
          if (liveFrame && !String(liveFrame.getAttribute('src')||'').includes('three-frames.html')) {
            liveFrame.src = 'three-frames.html?v=8fbe4542';
          }
          const banner = startOwnPage.querySelector('[data-proof-job="1"]');
          if (banner && /generic floor/.test(banner.textContent||'')) {
            const storeLine = banner.querySelector('#proof-job1-store');
            if (!storeLine) banner.insertAdjacentHTML('beforeend', '<p id="proof-job1-store" class="dim">Store: waiting on a complete definition.</p>');
          }
          const proofFrame = startOwnPage.querySelector('#start-own-proof-frame');
          let pendingStartOwnStage = 'intent';
          let pendingStartOwnFocus = null;
          let showStartOwnStage = (stage, focus = null) => {
            pendingStartOwnStage = stage === 'bench' ? 'bench' : 'intent';
            pendingStartOwnFocus = focus === 'definition-boundary' ? 'definition-boundary' : null;
          };
          const proofDecisions = new Set();
          let proofActions = 0;
          const classifyStartOwnDecision = target => {
            const choice = target?.closest?.('[data-act],[data-grade],[data-size],[data-maker],[data-step],[data-set],[data-exact],[data-op-toggle],[data-op-set],[data-op-angle]');
            if (!choice) return;
            if (choice.dataset.act) proofDecisions.add(choice.dataset.act);
            if (choice.dataset.grade) proofDecisions.add('material_family');
            if (choice.dataset.size) proofDecisions.add('stock_class');
            if (choice.dataset.maker) proofDecisions.add('part_form');
            if (choice.dataset.opToggle === 'angled') proofDecisions.add('angled_cut');
            if (choice.dataset.opAngle != null) proofDecisions.add('angle_degrees');
            if (choice.dataset.opSet) {
              const field = choice.dataset.opSet.split(':')[0];
              const names = {angleReference:'angle_reference',cutPlane:'cut_plane',endIdentity:'end_identity',endRelation:'end_relation',lengthDatum:'length_datum'};
              if (names[field]) proofDecisions.add(names[field]);
            }
            const path = choice.dataset.exact
              || (choice.dataset.step ? choice.dataset.step.split(':')[0] : '')
              || (choice.dataset.set ? choice.dataset.set.split(':')[0] : '');
            if (path === 'cuts.0.len') proofDecisions.add('finished_length');
            if (path === 'cuts.0.qty') proofDecisions.add('quantity');
          };
          captureStartOwnProof = () => {
            const bridge = proofFrame?.contentWindow?.STBProjectBridge;
            const snap = bridge && typeof bridge.getSnapshot === 'function' ? bridge.getSnapshot() : null;
            if (snap && snap.physicalDemand) {
              const demand = snap.physicalDemand;
              let retainedDefinition = null;
              try {
                retainedDefinition = JSON.parse(win.localStorage.getItem('stb-start-own-user1-definition') || 'null');
              } catch (_) {}
              const ref = retainedDefinition?.storeReference || null;
              const match = startOwnPage.querySelector('#proof-job1-match');
              const storeLine = startOwnPage.querySelector('#proof-job1-store');
              const dec = startOwnPage.querySelector('#proof-job1-decisions');
              if (dec) {
                dec.textContent = String((snap.openPoints && snap.openPoints.length)
                  ? (8 - snap.openPoints.length)
                  : (snap.complete ? 8 : 0));
              }
              if (match) {
                match.textContent = snap.complete
                  ? 'Contract complete.'
                  : ('Still open: ' + ((snap.openPoints||[]).join(', ') || 'facts'));
              }
              if (storeLine) {
                if (ref?.materialResolution?.status === 'MAPPED' && ref?.estimate) {
                  storeLine.textContent =
                    'Store: current ab8a4c5d Stage-2 answer retained · 60-in project workpiece · '
                    +(ref.priceCompleteness === 'PARTIAL'
                      ? 'modeled value is partial while named conditions remain.'
                      : 'budgetary estimate available.');
                } else {
                  storeLine.textContent = 'Store: waiting on the current identified definition.';
                }
              }
              try {
                win.localStorage.setItem('stb-proof-ladder-job1', JSON.stringify({
                  semanticOutput:{
                    stockClass:demand.sizeKey || demand.stockClass,
                    finishedLength:demand.finishedLengthIn || demand.finishedLength,
                    quantity:demand.partQty || demand.quantity,
                    endCondition:(demand.angleDeg || demand.angleDegrees) ? 'angled' : 'square',
                    straightCut:(demand.angleDeg || demand.angleDegrees) ? false : true,
                    angleDegrees:demand.angleDeg ?? demand.angleDegrees,
                    cutPlane:demand.cutPlane,
                    endIdentity:demand.endIdentity,
                    endRelation:demand.endRelation,
                    lengthDatum:demand.lengthDatum
                  },
                  storePreview:ref
                }));
              } catch (_) {}
              return;
            }

            const state = proofFrame?.contentWindow?.S;
            if (!state) return;
            let semanticOutput = null;
            if (state.maker === 'cuts' && state.cuts?.pieces?.length === 1 && state.cutOps?.angled) {
              const part = state.cuts.pieces[0];
              semanticOutput = {
                stockClass: state.size === '2x4' ? '2x4' : state.size,
                finishedLength: Number(part.len),
                quantity: Number(part.qty),
                endCondition: 'angled',
                straightCut: true,
                angleDegrees: Number(state.cutOps.angle),
                angleReference: state.cutOps.angleReference,
                cutPlane: state.cutOps.cutPlane,
                endIdentity: state.cutOps.endIdentity,
                endRelation: state.cutOps.endRelation,
                lengthDatum: state.cutOps.lengthDatum
              };
            }
            const targetMatch = !!semanticOutput
              && semanticOutput.stockClass === '2x4'
              && Math.abs(semanticOutput.finishedLength - 15.5) < 0.00001
              && semanticOutput.quantity === 8
              && semanticOutput.endCondition === 'angled'
              && semanticOutput.angleDegrees === 10
              && semanticOutput.angleReference === 'source-stated'
              && semanticOutput.cutPlane === 'bevel-thickness'
              && semanticOutput.endIdentity === 'both'
              && semanticOutput.endRelation === 'parallel'
              && semanticOutput.lengthDatum === 'source-length';
            const payload = {
              measured: true,
              explicitProjectDecisions: [...proofDecisions],
              explicitProjectDecisionCount: proofDecisions.size,
              uiActions: proofActions,
              semanticOutput,
              targetMatch
            };
            try { win.localStorage.setItem('stb-proof-ladder-job1', JSON.stringify(payload)); } catch (_) {}
            const d = startOwnPage.querySelector('#proof-job1-decisions');
            const a = startOwnPage.querySelector('#proof-job1-actions');
            const m = startOwnPage.querySelector('#proof-job1-match');
            if (d) d.textContent = String(payload.explicitProjectDecisionCount);
            if (a) a.textContent = String(payload.uiActions);
            if (m) m.textContent = targetMatch ? 'Core target represented.' : 'Target not yet represented.';
          };
          if (proofFrame && !proofFrame.dataset.proofObserved) {
            proofFrame.dataset.proofObserved = 'true';
            proofFrame.addEventListener('load', () => {
              const childDoc = proofFrame.contentDocument;
              if (!childDoc) return;
              const benchButton = childDoc.querySelector('.stb-bench-button');
              const intentScreen = childDoc.getElementById('stb-start-intent-screen');
              const benchScreen = childDoc.getElementById('stb-start-bench-screen');
              const benchBack = childDoc.getElementById('stb-bench-back');
              const benchLibrary = childDoc.getElementById('stb-bench-library');
              const benchIntentSlot = childDoc.getElementById('stb-bench-intent-slot');
              const lengthInput = childDoc.getElementById('stb-config-length');
              const boundaryNote = childDoc.getElementById('stb-config-boundary-note');
              const resetDemoButton = childDoc.getElementById('stb-config-reset');
              const confirmButton = childDoc.getElementById('stb-confirm-store');
              const glossaryStatus = childDoc.getElementById('stb-store-glossary-status');
              const glossaryChoices = Array.from(childDoc.querySelectorAll('[data-store-size-key]'));
              const startOwnAuthority = storeHandoffContract?.storeAuthorities?.startOwn || null;
              const catalogSource = storeHandoffContract?.startOwnStoreCatalog || null;
              let definitionRevision = 1;
              const partQty = 2;
              const spotMode = 'centered';
              const DEMO_MIN_LENGTH_IN = 16;
              const DEMO_MAX_LENGTH_IN = 18;
              const DEMO_HORIZONTAL_SPAN_IN = 8;
              let currentUser1Definition = null;
              let storeRequestSequence = 0;

              const nextStoreRequestId = definition => {
                storeRequestSequence += 1;
                return [
                  definition?.definitionId || 'UNIDENTIFIED',
                  definition?.versionId || 'UNVERSIONED',
                  String(Date.now()),
                  String(storeRequestSequence)
                ].join('@');
              };

              const setText = (id,value) => {
                const el = childDoc.getElementById(id);
                if (el) el.textContent = value;
              };
              const formatInches = value => {
                const n = Number(value);
                if (!Number.isFinite(n)) return 'unresolved';
                const eighths = Math.round(n * 8);
                const whole = Math.trunc(eighths / 8);
                const rem = Math.abs(eighths % 8);
                const fraction = ['', '⅛', '¼', '⅜', '½', '⅝', '¾', '⅞'][rem];
                return (whole ? String(whole) : (rem ? '' : '0')) + fraction + ' in';
              };
              const activate = (selector,attr,value) => {
                childDoc.querySelectorAll(selector).forEach(button => {
                  button.classList.toggle('on',String(button.getAttribute(attr))===String(value));
                });
              };
              const syncStoreGlossary = () => {
                if (!storeHandoffContract || typeof storeHandoffContract.startOwnOfferings !== 'function') {
                  if (glossaryStatus) glossaryStatus.textContent = 'Current Store material truth is unavailable. No material choice is being promoted.';
                  if (benchButton) benchButton.disabled = true;
                  return false;
                }
                let backed = 0;
                glossaryChoices.forEach(choice => {
                  const sizeKey = String(choice.dataset.storeSizeKey || '');
                  const offerings = storeHandoffContract.startOwnOfferings(sizeKey);

              const showStage = (stage, focus = null) => {

                }
                if (bench) syncAndRender('BENCH_VIEW');
                if (bench && focus === 'definition-boundary') {
                  const confirmBlock = childDoc.querySelector('.confirm-block');

                    proofFrame.contentWindow?.requestAnimationFrame?.(() => {
                      confirmBlock.scrollIntoView({block:'end'});

              const syncDefinition = reason => {
                const finishedLengthIn = Number(lengthInput?.value);

                }

                const spanRatio = DEMO_HORIZONTAL_SPAN_IN / finishedLengthIn;
                const angleDeg = Number((Math.asin(spanRatio) * 180 / Math.PI).toFixed(12));
                const achievedRiseIn = Number(Math.sqrt(
                  finishedLengthIn * finishedLengthIn -
                  DEMO_HORIZONTAL_SPAN_IN * DEMO_HORIZONTAL_SPAN_IN

                const definedWorkpieceLengthIn = 60;

                  mode:'SPOT_ON_LOCATION',
                  countPerPart:1,
                  locationRule:'CENTERED_ON_PART',
                  locationAlongLengthIn:centerSpotIn,
                  acrossWidthRule:'CENTERED_ON_WIDE_FACE',
                  totalCount:partQty,
                  derivation:{
                    basis:'DERIVED',
                    formula:'finishedLengthIn / 2',
                    input:{finishedLengthIn:finishedLengthIn},
                    output:{locationAlongLengthIn:centerSpotIn}
                  }
                } : null;

                const parts = Array.from({length:partQty}, (_,index) => ({

                  lengthIn:finishedLengthIn,

                    featureId:'SPOT-'+(index+1),
                    kind:'SPOT_ON_LOCATION',
                    xIn:centerSpotIn,
                    locationRule:'CENTERED_ON_PART',
                    acrossWidthRule:'CENTERED_ON_WIDE_FACE'
                  }] : []
                }));

                const requiredOps = [];
                if (angleDeg === 0) requiredOps.push('CROSSCUT');
                else requiredOps.push('MITER_LIMITED');
                if (spotDemand) requiredOps.push('SPOT_ON_LOCATION');

                /*
                 * This is the project/configurator demand only. Store owns whether
                 * it is supportable, how D-001 moves, modeled occupied time, and Q.
                 * The static public Review build may present only exact Store-issued
                 * references proven against promoted authority. Other values require a live Store answer.
                 */
                const configurationId = 'SYO-USER1-XBRACE';
                const endpoint16 = Math.abs(finishedLengthIn - 16) < 1e-9;
                const endpoint18 = Math.abs(finishedLengthIn - 18) < 1e-9;
                const configurationVersion = endpoint16
                  ? '0.1'
                  : endpoint18
                    ? '0.2'

                const declaredSawCuts = angleDeg !== 0 ? partQty + 1 : partQty;
                const declaredSpotCount = spotDemand ? partQty : 0;
                const storeDemand = {

                  declaredSpotCount:declaredSpotCount,

                };
                const storeAnswer = storeHandoffContract.resolveUser1StoreReference(storeDemand);
                const storeMaterialResolution = storeAnswer.materialResolution || null;
                const storeEstimate = storeAnswer.estimate || null;
                const effectiveWorkpieceLengthIn = Number.isFinite(Number(storeMaterialResolution?.workpieceLengthIn))

                  : definedWorkpieceLengthIn;
                const unresolved = Array.isArray(storeAnswer.unresolvedConditions)
                  ? storeAnswer.unresolvedConditions.slice()
                  : [];
                const refusals = Array.isArray(storeAnswer.refusalConditions)
                  ? storeAnswer.refusalConditions.slice()
                  : [];

                const physicalDemand = {
                  stockClass:'2x4',
                  materialSource:'STORE_ZERO',
                  parentLengthIn:effectiveWorkpieceLengthIn,
                  definedWorkpieceLengthIn:effectiveWorkpieceLengthIn,
                  finishedLength:finishedLengthIn,
                  quantity:partQty,
                  endCondition:angleDeg ? 'angled' : 'square',
                  straightCut:angleDeg === 0,
                  angleDegrees:angleDeg,
                  angleReference:'DERIVED_SAME_SPAN',
                  cutPlane:'miter-face',
                  endIdentity:'both',
                  endRelation:'parallel',
                  lengthDatum:'long-long-outer-edge',
                  datumCMethod:'REFERENCE_CUT',
                  requiredOps:requiredOps.slice(),
                  declaredSawCuts:declaredSawCuts,
                  declaredSpotCount:declaredSpotCount,
                  parts:parts
                };
                if (spotDemand) physicalDemand.spotDemand = spotDemand;

                const workpieceSequence = storeEstimate?.travel
                  ? {
                      status:'SEQUENCED',
                      basis:'STORE_RETURNED_TRAVEL',
                      finalRemainderIn:storeEstimate.travel.finalRemainderIn,
                      holdIn:24,
                      derivedSawCuts:storeEstimate.travel.derivedSawCuts,
                      derivedSpotCount:storeEstimate.travel.derivedSpotCount
                    }
                  : {
                      status:'UNRESOLVED',
                      basis:'STORE_ANSWER_REQUIRED',

                      holdIn:24
                    };

                const capability = {
                  status:storeAnswer.capabilityStatus || 'UNRESOLVED',
                  basis:startOwnAuthority?.capabilityBasis || 'STORE_ANSWER_REQUIRED',

                  requiredOps:requiredOps,

                  unresolvedConditions:Array.from(new Set(unresolved))

                currentUser1Definition = {
                  definitionId:'SYO-USER1-XBRACE-0.1',

                      quantity:storeMaterialResolution.quantity,
                      unitPrice:storeMaterialResolution.unitPrice,
                      materialTotal:storeMaterialResolution.materialTotal,
                      allocationClaimed:false
                    } : null,
                    definedWorkpieceLengthIn:{
                      value:definedWorkpieceLengthIn,
                      basis:'PROJECT_MINIMUM_REQUEST'

                    selectedStoreWorkpieceLengthIn:{

                    },
                    mappedStoreSkus:storeMaterialResolution?.storeSku ? [storeMaterialResolution.storeSku] : []
                  },
                  intent:{
                    partQty:{value:partQty,basis:'BOUNDED_DEMO_FIXED'},
                    finishedLengthIn:{value:finishedLengthIn,basis:endpoint16?'USER_1_INTENT_IMAGE':'CUSTOMER_INPUT'},
                    angleDeg:{value:angleDeg,basis:'DERIVED_SAME_SPAN'},
                    endIdentity:{value:'both',basis:'USER_1_INTENT'},
                    endRelation:{value:'parallel',basis:'USER_1_INTENT'},
                    cutPlane:{value:'miter-face',basis:'USER_1_INTENT'},
                    lengthDatum:{value:'long-long-outer-edge',basis:'USER_1_INTENT'},
                    centerSpot:{value:'one-per-part',basis:'DERIVED_FROM_PART_LENGTH'}
                  },
                  derived:{
                    fixedHorizontalSpanIn:{value:DEMO_HORIZONTAL_SPAN_IN,basis:'BOUNDED_DEMO_BASELINE'},
                    achievedRiseIn:{
                      value:achievedRiseIn,basis:'DERIVED',
                      formula:'sqrt(finishedLengthIn^2 - fixedHorizontalSpanIn^2)',
                      input:{finishedLengthIn:finishedLengthIn,fixedHorizontalSpanIn:DEMO_HORIZONTAL_SPAN_IN}
                    },
                    endCutAngleDeg:{
                      value:angleDeg,basis:'DERIVED',
                      formula:'asin(fixedHorizontalSpanIn / finishedLengthIn)',
                      input:{finishedLengthIn:finishedLengthIn,fixedHorizontalSpanIn:DEMO_HORIZONTAL_SPAN_IN}
                    },
                    centerSpotAlongLengthIn:spotDemand ? {
                      value:centerSpotIn,basis:'DERIVED',formula:'finishedLengthIn / 2',input:{finishedLengthIn:finishedLengthIn}

                  physicalDemand:physicalDemand,
                  storeDemand:storeDemand,
                  workpieceSequence:workpieceSequence,
                  capability:capability,

                    capabilityStatus:capability.status,
                    economicsStatus:storeAnswer.economicsStatus || 'UNRESOLVED',
                    priceCompleteness:storeAnswer.priceCompleteness || 'UNAVAILABLE',
                    material:storeAnswer.material,
                    machineService:storeAnswer.machineService,
                    combinedValue:storeAnswer.combinedValue,
                    complete:storeAnswer.complete === true,
                    estimate:storeEstimate,
                    calculationIdentity:storeAnswer.calculationIdentity || null,
                    refusalConditions:Array.from(new Set(refusals)),
                    unresolvedConditions:Array.from(new Set(unresolved)),
                    materialResolution:storeMaterialResolution,
                    source:storeAnswer.source || null,
                    authority:startOwnAuthority

                  lineage:{

                try {

              };

              const renderBoardGeometry = definition => {
                const demand = definition?.physicalDemand;
                if (!demand) return;
                const overlay = childDoc.getElementById('stb-bench-dynamic-geometry');
                if (!overlay) return;
                ['stb-bench-static-parts','stb-bench-static-cuts','stb-bench-static-cut-markers','stb-bench-static-joint-note','stb-bench-static-spots','stb-bench-static-part1-label','stb-bench-static-part2-label','stb-bench-static-dims','stb-bench-part1-dim','stb-bench-part2-dim'].forEach(id => {
                  const el=childDoc.getElementById(id);
                  if(el) el.style.display='none';
                });
                const x0=40, xMax=860, topY=100, bottomY=180;
                const workpieceLength=Math.max(1,Number(demand.definedWorkpieceLengthIn)||60);
                const scale=(xMax-x0)/workpieceLength;
                const qty=Math.max(1,Math.min(2,Number(demand.quantity)||1));
                const len=Math.max(0,Number(demand.finishedLength)||0);
                const angle=Math.max(0,Math.min(89,Number(demand.angleDegrees)||0));
                const delta=80*Math.tan(angle*Math.PI/180);
                const boundaries=Array.from({length:qty+1},(_,i)=>x0+i*len*scale);
                const cutBoundaries=angle>0?boundaries:boundaries.slice(1);
                const colors=['#a85a2a','#2f6f9e'];
                let svg='';
                for(let i=0;i<qty;i++){
                  const left=boundaries[i], right=boundaries[i+1], fill=colors[i%colors.length];
                  svg+='<path d="M'+(left+delta)+' 101 L'+(right+delta)+' 101 L'+right+' 179 L'+left+' 179 Z" fill="'+fill+'" opacity=".06"/>';
                  const cx=left+(right-left)/2;
                  svg+='<text x="'+cx+'" y="124" text-anchor="middle" font-size="11" font-weight="700" fill="#584533">PART '+(i+1)+'</text>';
                  if(demand.spotDemand){
                    svg+='<circle cx="'+cx+'" cy="140" r="12" fill="none" stroke="#2f6f9e" stroke-width="2.4"/><circle cx="'+cx+'" cy="140" r="4" fill="#2f6f9e"/>';
                  }
                  svg+='<g stroke="#7a4f22" stroke-width="1.1" fill="none" opacity=".8"><line x1="'+left+'" y1="200" x2="'+right+'" y2="200"/><path d="M'+left+' 195v10M'+right+' 195v10"/></g>';
                  svg+='<text x="'+cx+'" y="217" text-anchor="middle" font-size="11" font-weight="700" fill="#7a4f22">'+len+' in</text>';
                }
                cutBoundaries.forEach((bottomX,index)=>{
                  const topX=bottomX+delta;
                  svg+='<line x1="'+topX+'" y1="'+topY+'" x2="'+bottomX+'" y2="'+bottomY+'" stroke="#a85a2a" stroke-width="5" stroke-linecap="round"/>';
                  const mx=bottomX+delta*.65;
                  svg+='<circle cx="'+mx+'" cy="74" r="13" fill="#a85a2a"/><text x="'+mx+'" y="79" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">'+(index+1)+'</text>';
                });

                const usedEnd=boundaries[qty];

                const remainLabel=childDoc.getElementById('stb-bench-remain-label');
                if(spareLabel){
                  const spareCenter=usedEnd<532?(usedEnd+532)/2:Math.min(820,(usedEnd+xMax)/2);
                  spareLabel.setAttribute('x',String(spareCenter));
                }
                if(remainLabel){
                  const remainCenter=Math.min(800,Math.max(570,(usedEnd+xMax)/2));
                  remainLabel.setAttribute('x',String(remainCenter));
                }
              };

              const renderBench = definition => {
                if (!definition) return;
                const demand = definition.physicalDemand;
                const sequence = definition.workpieceSequence;
                const retained = sequence?.status === 'SEQUENCED'
                  ? Number(sequence.finalRemainderIn)
                  : null;
                const holdIn = Number(sequence?.holdIn || 24);
                const spare = Number.isFinite(retained) ? Number((retained-holdIn).toFixed(6)) : null;
                const productionCuts = Number(demand.declaredSawCuts) || 0;
                const totalModeledCuts = Number(definition.storeReference.estimate?.travel?.derivedSawCuts) || productionCuts;
                const spots = Number(demand.declaredSpotCount) || 0;

                const materialMapped = material?.status === 'MAPPED';

                const totals = estimate?.totals || null;
                const economics = definition.storeReference.economicsStatus;
                const capabilityBasis = definition.capability?.basis || definition.capability?.status || 'UNRESOLVED';
                const storeComplete = definition.storeReference.complete === true;

                renderBoardGeometry(definition);
                setText('stb-config-parts-value',demand.quantity+' part'+(demand.quantity===1?'':'s'));
                setText('stb-config-length-value',

                  Number(definition.derived.achievedRiseIn.value).toFixed(3)+' in achieved rise');
                setText('stb-config-angle-value',demand.angleDegrees+'° · both ends · parallel');
                setText('stb-config-spot-value',demand.spotDemand?'1 centered spot / part':'no spot');
                setText('stb-bench-workpiece-spec','2×4 · '+formatInches(demand.definedWorkpieceLengthIn));
                setText('stb-bench-length-spec',Number(demand.finishedLength).toFixed(3)+' in');
                setText('stb-bench-angle-spec',Number(demand.angleDegrees).toFixed(3)+'°');
                setText('stb-bench-parts-spec',String(demand.quantity));
                setText('stb-def-workpiece',formatInches(demand.definedWorkpieceLengthIn));
                setText('stb-def-parts',String(demand.quantity));
                setText('stb-def-length',demand.finishedLength+' in each');
                setText('stb-def-angle',Number(demand.angleDegrees).toFixed(3)+'° · derived to preserve 8.000 in span · both · parallel');
                setText('stb-def-spot',demand.spotDemand?'1 centered spot / part':'none');
                setText('stb-def-spot-location',demand.spotDemand

                setText('stb-bench-remain-label',Number.isFinite(retained)
                  ? formatInches(retained)+' remains · '+formatInches(holdIn)+' retained-control minimum · '+formatInches(spare)+' spare · Store returned'
                  : 'This changed definition has no Store-issued travel result in the static Review build.');
                setText('stb-bench-control-copy',Number.isFinite(retained)
                  ? 'Store returned '+formatInches(retained)+' remaining on the '+formatInches(demand.definedWorkpieceLengthIn)+' defined workpiece; '+formatInches(holdIn)+' is the Store travel model retained-control minimum.'
                  : 'The project definition changed. This browser does not decide Store capability or retained-control validity; a fresh Store answer is required.');
                setText('stb-bench-cut-copy','cut demand — '+demand.angleDegrees+'° ends · '+productionCuts+' declared saw operation'+(productionCuts===1?'':'s')+' · '+demand.quantity+' part'+(demand.quantity===1?'':'s'));
                setText('stb-bench-cut-step','Define it. This version carries '+productionCuts+' declared saw operation'+(productionCuts===1?'':'s')+' with '+demand.quantity+' part'+(demand.quantity===1?'':'s')+' at '+demand.angleDegrees+'°. Store owns the admitted machine sequence.');
                setText('stb-bench-drill-step',demand.spotDemand
                  ? 'Spot demand. One centered 3/16 in SPOT_ON_LOCATION feature per part is carried to Store. It is not converted here into a generic finished hole.'
                  : 'Spot demand. No spot is requested on this version.');

                setText('stb-price-processing',totals?.machine_service==null?'NOT ESTABLISHED':'$'+Number(totals.machine_service).toFixed(2));
                setText('stb-price-total',totals?.Q==null ? 'NOT COMPLETE' : '$'+Number(totals.Q).toFixed(2));
                setText('stb-price-basis',estimate
                  ? 'Store-issued BudgetaryEstimate · material + modeled D-001 machine service · DECLARED_STAGE2_MODEL · not a commercial quote.'
                  : 'LIVE STORE EVALUATION REQUIRED · Store Zero will calculate capability, modeled time, economics, and Q for this exact definition when you confirm.');
                setText('stb-basis-sku',materialMapped?material.storeSku:'NOT MAPPED');
                setText('stb-basis-source-stock',materialMapped
                  ? material.quantity+' × '+material.stockLengthIn+' in 2×4 Store stock/pricing reference · Store-selected workpiece '+formatInches(demand.definedWorkpieceLengthIn)
                  : 'FRESH STORE ANSWER REQUIRED');
                setText('stb-basis-unit-price',materialMapped && Number.isFinite(Number(material.unitPrice)) ? '$'+Number(material.unitPrice).toFixed(2)+' / ea' : 'UNRESOLVED');
                setText('stb-basis-cell-family',materialMapped && Array.isArray(material.cellFamily) ? material.cellFamily.join(' · ') : 'UNRESOLVED');
                setText('stb-basis-supported-ops',materialMapped && Array.isArray(material.supportedOps) ? material.supportedOps.join(' · ') : 'UNRESOLVED');
                setText('stb-basis-clock',String(material?.source?.clock || catalogSource?.clock || '—'));

              const syncAndRender = reason => {

      function createComparisonStoreHandoff(source,payload){
        if(!storeHandoffContract || !payload) return null;
        var physicalDemand = null;
        var projectId = source === 'start-own' ? 'start-own' : 'outdoor-build';
        var projectClass = source === 'start-own' ? 'USER_DEFINED_BOARD' : 'BOUNDED_SOURCE_BACKED';
        var sourceAuthority = source === 'start-own'
          ? (payload.sourceAuthority || {kind:'USER-DEFINED',artifact:'three-frames.html'})
          : {kind:'BOUNDED SOURCE-BACKED',artifact:'stb-outdoor-bench-leg-0.1.html',detail:payload.sourceAuthority||null};
        if(payload.physicalDemand){
          physicalDemand = payload.physicalDemand;
        } else if(source === 'start-own'){
          try { physicalDemand = JSON.parse(win.localStorage.getItem('stb-proof-ladder-job1')||'null')?.semanticOutput || null; } catch (_) {}
        } else {
          physicalDemand = payload.normalizedPart || null;
        }
        if(!physicalDemand && payload.definition){
          var def = payload.definition;
          var part0 = payload.request && Array.isArray(payload.request.parts) ? payload.request.parts[0] : null;
          physicalDemand = {
            stockClass: def.stockClass || (def.stock && def.stock.nominal) || '',
            finishedLength: Number(def.finishedLength != null ? def.finishedLength : (part0 && part0.len)),
            quantity: Number(def.qty != null ? def.qty : (def.quantity != null ? def.quantity : (part0 && part0.qty) || 1)),
            endCondition: def.endCondition || 'square',
            straightCut: def.endCondition !== 'angled',
            holeRequirement: def.holeRequirement || 'NONE'
          };
        }
        if(!physicalDemand) return null;
        var definitionId = payload.id || (source === 'start-own' ? 'SYO-IDENTIFIED' : 'OB-SAW-IDENTIFIED');
        try {
          return storeHandoffContract.createComparisonHandoff({
            projectId:projectId,
            projectClass:projectClass,
            definitionId:definitionId,
            versionId:payload.versionId || definitionId,
            physicalDemand:physicalDemand,
            sourceAuthority:sourceAuthority,
            unresolvedConditions:source === 'start-own'
              ? (Array.isArray(payload.storeReference?.unresolvedConditions)
                  ? payload.storeReference.unresolvedConditions
                  : [])
              : ['STORE-PRICING-BRIDGE-GAP']
          });
        } catch (_) {
          return null;
        }
      }

    function proofSimulationEconomics(){
      const storeReference=proofHandoff?.payload?.storeReference || null;
      const estimate=storeReference?.estimate || null;
      const totals=estimate?.totals || null;
      return {
        complete:storeReference?.complete===true || estimate?.complete===true,
        q:totals?.Q ?? estimate?.total ?? null,
        material:totals?.material ?? estimate?.material ?? storeReference?.materialResolution?.materialTotal ?? null,
        machineService:totals?.machine_service ?? estimate?.cellRecovery ?? null,
        cycleMin:estimate?.cycle?.T_job_min ?? null,
        remnantIn:estimate?.travel?.finalRemainderIn ?? storeReference?.estimate?.travel?.finalRemainderIn ?? null,
        sku:storeReference?.materialResolution?.storeSku || storeReference?.materialResolution?.pricingReferenceSku || null,
        resultHash:estimate?.calculationIdentity?.resultHash || storeReference?.calculationIdentity?.resultHash || null,
        storeReceipt:storeReference?.evaluationReceipt || null
      };
    }

    function proofSimulationKey(){
      if(proofHandoff?.source!=='start-own') return null;
      const payload=proofHandoff.payload||{};
      const economics=proofSimulationEconomics();
      const version=proofHandoff.storeHandoff?.versionId||payload.id||payload.versionId||payload.normalizedPart?.versionId||'IDENTIFIED';
      const receiptIdentity=economics.storeReceipt?.receiptHash||economics.storeReceipt?.requestId||economics.resultHash||'NO_STORE_RECEIPT';
      return String(version)+'|'+String(receiptIdentity);
    }

    function ensureProofSimulation(){
      const key=proofSimulationKey();
      if(!key) return null;
      if(!proofSimulation || proofSimulation.key!==key){
        proofSimulation={key:key,receipts:[],createdAt:new Date().toISOString()};
      }
      return proofSimulation;
    }

    function proofSimulationReceipt(type,detail){
      const sim=ensureProofSimulation();
      if(!sim) return null;
      const existing=sim.receipts.find(receipt=>receipt.type===type);
      if(existing) return existing;
      const economics=proofSimulationEconomics();
      const base=String(economics.storeReceipt?.receiptHash||economics.storeReceipt?.requestId||economics.resultHash||'REFERENCE')
        .replace(/[^a-z0-9]/gi,'').slice(0,12).toUpperCase() || 'REFERENCE';
      const sequence=String(sim.receipts.length+1).padStart(2,'0');
      const receipt={
        type:type,
        receiptId:'SIM-'+type.replace(/^SIMULATED_/,'').replace(/[^A-Z0-9]+/gi,'-')+'-'+base+'-'+sequence,
        at:new Date().toISOString(),
        detail:detail
      };
      sim.receipts.push(receipt);
      return receipt;
    }

    function proofSimulationHas(type){
      return !!ensureProofSimulation()?.receipts.some(receipt=>receipt.type===type);
    }

    function proofSimulationReceiptLabel(type){
      return ensureProofSimulation()?.receipts.find(receipt=>receipt.type===type)?.receiptId || null;
    }

    function completeProofYardSimulation(){
      const economics=proofSimulationEconomics();
      if(!proofSimulationHas('SIMULATED_PAYMENT')) return false;
      proofSimulationReceipt('SIMULATED_ALLOCATION','Simulated material allocation'+(economics.sku?' · '+economics.sku:'')+' · no live inventory reserved');
      proofSimulationReceipt('SIMULATED_QUEUE','Simulated Yard queue entry for the same identified paid definition');
      proofSimulationReceipt('SIMULATED_PRODUCTION_RELEASE','Simulated job release toward the local cell · no physical production authority created');
      proofSimulationReceipt('SIMULATED_MACHINE_NEUTRAL_PLAN','Portable operation sequence represented for the accepted definition · no controller code emitted');
      proofSimulationReceipt('SIMULATED_LOCAL_LOWERING','Candidate local lowering boundary represented · no commissioned postprocessor or CellProgramIdentity issued');
      proofSimulationReceipt('SIMULATED_CELL_READINESS','Reference-cell readiness represented for simulation only · no commissioned-machine claim');
      proofSimulationReceipt('SIMULATED_OPERATOR_LOAD','Operator load instruction represented for the identified Store material · no physical material handled');
      proofSimulationReceipt('SIMULATED_CYCLE_START','Local Cycle Start represented as operator-owned · no live machine start');
      proofSimulationReceipt('SIMULATED_EXECUTION','Simulated job completed'+(Number.isFinite(Number(economics.cycleMin))?' · modeled '+Number(economics.cycleMin).toFixed(4)+' min':'')+' · no live motion or controller command');
      proofSimulationReceipt('SIMULATED_INSPECTION_STAGING','Simulated inspection, labeling, reconciliation and staging recorded');
      proofSimulationReceipt('SIMULATED_READY_NOTICE','Simulated READY notice issued · staged is still not picked up');
      return true;
    }

      if (unresolved) unresolved.insertAdjacentHTML('afterend', '<div class="flash warn"><b>STORE BRIDGE:</b> No complete Picnic Store request exists yet. This is a BRIDGE-GAP, not a reason to discard the project definition.</div>');
      const first = picnicReviewMain.querySelector('.btns');
      if (first && !first.querySelector('[data-canonical-go="picnic-store"]')) first.insertAdjacentHTML('afterbegin','<button type="button" data-canonical-go="picnic-store">← Back to Store</button>');
    }

    ensureProjectJourneyPage('picnic-request',
      '<p class="stage-tag">5 · REQUEST</p><h1>REQUEST · PICNIC TABLE</h1>' +
      '<p class="sub">The definition can be retained, but there is not yet a Store-submittable demand packet for this class.</p>' +
      '<div class="s001-v2-order">' +
        '<div><b>FORM / SCOPE</b><span id="picnic-request-form"></span></div>' +
        '<div><b>LENGTH</b><span id="picnic-request-length"></span></div>' +
        '<div><b>MATERIAL PREFERENCE</b><span id="picnic-request-material"></span></div>' +
        '<div><b>REQUEST EVENT</b><span>DEFERRED · NOT SUBMITTED</span></div>' +
        '<div><b>OWNER</b><span>BRIDGE-GAP · project-to-Store demand packet</span></div>' +
        '<div><b>PROJECT STATUS</b><span>RETAINED · NOT REJECTED</span></div>' +
      '</div>' +
      '<div class="s001-boundary"><b>STOP AT THE REAL GATE.</b> SEND TO THE YARD is unavailable until a complete Store request can be formed. This does not erase the project or force the user to re-enter valid choices.</div>' +
      '<div class="btns"><button type="button" data-canonical-go="picnic-review">BACK TO REVIEW</button><button type="button" disabled title="Bridge gap: a complete Picnic Store request is not yet implemented.">SEND TO THE YARD — DEFERRED</button></div>',
      '<p class="goal">A refusal can be a pass</p><div class="row"><b>What stopped</b><span>The Store request bridge, not the customer project.</span></div><div class="row"><b>What remains</b><span>The exact choices and unresolved conditions stay in the project record.</span></div>'
    );

    ensureProjectJourneyPage('picnic-yard',
      '<p class="stage-tag">6 · YARD</p><h1>YARD · NOT REACHED</h1><p class="sub">No yard submission exists for the current Picnic class.</p><div class="s001-boundary">This stage is intentionally inaccessible from the current Request gate. Nothing is inferred past the bridge gap.</div>',
      '<p class="goal">Not reached</p><div class="row"><b>No invented response</b><span>No request means no yard response.</span></div>'
    );
    ensureProjectJourneyPage('picnic-terms',
      '<p class="stage-tag">7 · TERMS</p><h1>TERMS · NOT REACHED</h1><p class="sub">Offer, acceptance, payment and allocation remain NOT ESTABLISHED.</p>',
      '<p class="goal">Not reached</p><div class="row"><b>Null stays null</b><span>A missing Request event cannot produce later commercial events.</span></div>'
    );
    ensureProjectJourneyPage('picnic-recap',
      '<p class="stage-tag">8 · RECAP</p><h1>RECAP · PICNIC TABLE</h1><p class="sub">Project admitted → choices retained → Store bridge deferred. No later transaction event is claimed.</p>',
      '<p class="goal">Truthful chronology</p><div class="row"><b>Do not backfill</b><span>Later stages remain absent until the bridge is implemented.</span></div>'
    );
    ensureProjectJourneyPage('picnic-record',
      '<p class="stage-tag">9 · RECORD</p><h1>PICNIC TABLE · OWNER RECORD</h1><p class="sub">The record preserves the project even though the current journey stops at Request.</p><div class="s001-v2-order"><div><b>FORM / SCOPE</b><span id="picnic-record-form"></span></div><div><b>LENGTH</b><span id="picnic-record-length"></span></div><div><b>MATERIAL PREFERENCE</b><span id="picnic-record-material"></span></div><div><b>STORE REQUEST</b><span>NOT FORMED · BRIDGE-GAP</span></div><div><b>COMMERCIAL STATUS</b><span>NOT ESTABLISHED</span></div><div><b>PHYSICAL STATUS</b><span>NOT AUTHORIZED / NOT RECORDED</span></div></div>',
      '<p class="goal">Keep the project, not a fiction</p><div class="row"><b>Valid inputs survive</b><span>The next implementation pass should start from this retained definition.</span></div>'
    );

    function syncPicnicJourney() {
      const title = doc.getElementById('picnic-title')?.textContent || 'Picnic table';
      const length = doc.getElementById('plen-label')?.textContent || '—';
      const material = doc.getElementById('pmat-label')?.textContent || 'unresolved';
      const set = (id, value) => { const el = doc.getElementById(id); if (el) el.textContent = value; };
      ['picnic-store-form','picnic-request-form','picnic-record-form'].forEach(id => set(id, title));
      ['picnic-store-length','picnic-request-length','picnic-record-length'].forEach(id => set(id, length));
      ['picnic-store-material','picnic-request-material','picnic-record-material'].forEach(id => set(id, material));
    }
    doc.addEventListener('input', function(event) {
      if (event.target.closest?.('#picnic-config')) setTimeout(syncPicnicJourney, 0);
    });
    doc.addEventListener('click', function(event) {
      if (event.target.closest?.('#picnic-chooser,#picnic-config')) setTimeout(syncPicnicJourney, 0);
    });
    syncPicnicJourney();

    ['alcove-capture','alcove-config','store','request','yard','record','window-parts','playhouse-s001','playhouse-machine','playhouse-store','playhouse-review','playhouse-request','playhouse-yard','playhouse-terms','playhouse-result','playhouse-record'].forEach(addProofLibraryControl);

    const originalShow = win.show;
    const QUARANTINED_OUTDOOR_TARGETS = new Set(['picnic-chooser','picnic-config','picnic-store','picnic-review','picnic-request','picnic-yard','picnic-terms','picnic-recap','picnic-record']);

    const canonicalJourney = window.STB_CANONICAL_JOURNEY || null;
    const WINDOW_SEAT_STAGE_TO_ACTOR = Object.freeze({
      scan:'scan',
      configure:'configure',
      store:'store-answer',
      review:'store-answer',
      request:'accept-pay',
      yard:'store-yard',
      terms:'store-yard',
      recap:'handoff-record',
      record:'handoff-record'
    });
    const ALCOVE_STAGE_TARGETS = Object.freeze({
      scan: 'alcove-capture',
      configure: 'alcove-config',
      store: 'store',
      review: 'alcove-review',
      request: 'request',
      yard: 'yard',
      terms: 'terms',
      recap: 'recap',
      record: 'record'
    });
    const LEGACY_TARGET_TO_STAGE = Object.freeze(Object.fromEntries(
      Object.entries(ALCOVE_STAGE_TARGETS).map(([stage,target]) => [target,stage])
    ));
    const PROJECT_STAGE_TARGETS = Object.freeze({
      alcove: ALCOVE_STAGE_TARGETS,
      'start-own': Object.freeze({
        scan:'start-own-live',
        configure:'start-own-live',
        store:'proof-store',
        review:'proof-store',
        request:'proof-accept',
        yard:'proof-yard',
        terms:'proof-yard',
        recap:'proof-record',
        record:'proof-record'
      }),
      outdoor: Object.freeze({
        scan:'outdoor-build-live',
        configure:'outdoor-build-live',
        store:'proof-store',
        review:'proof-store',
        request:'proof-accept',
        yard:'proof-yard',
        terms:'proof-yard',
        recap:'proof-record',
        record:'proof-record'
      }),
      playhouse: Object.freeze({
        scan: 'playhouse-s001',
        configure: 'playhouse-machine',
        store: 'playhouse-store',
        review: 'playhouse-review',
        request: 'playhouse-request',
        yard: 'playhouse-yard',
        terms: 'playhouse-terms',
        recap: 'playhouse-result',
        record: 'playhouse-record'
      }),
      picnic: Object.freeze({
        scan: 'picnic-chooser',
        configure: 'picnic-config',
        store: 'picnic-store',
        review: 'picnic-review',
        request: 'picnic-request',
        yard: 'picnic-yard',
        terms: 'picnic-terms',
        recap: 'picnic-recap',
        record: 'picnic-record'
      })
    });

    function canonicalJourneyReady() {
      return !!canonicalJourney
        && Array.isArray(canonicalJourney.stages)
        && canonicalJourney.stages.join('>') === 'scan>configure>store>review>request>yard>terms>recap>record'
        && Array.isArray(canonicalJourney.gates)
        && canonicalJourney.gates.length === 8;
    }

    const START_OWN_NAV_LABELS = Object.freeze({
      scan:'1 · Your idea',
      configure:'2 · Make it yours',
      store:'3 · The Store answers',
      review:'3 · The Store answers',
      request:'4 · Your call',
      yard:'5 · We cut it',
      terms:'5 · We cut it',
      recap:'6 · Pick up & build',
      record:'6 · Pick up & build'
    });

    function restoreJourneyNav(nav) {
      if (!nav) return;
      nav.removeAttribute('data-active-project');
      nav.querySelector('.job-nav-context')?.remove();
      [...nav.querySelectorAll('button')].forEach(button => {
        if (!button.dataset.defaultLabel) button.dataset.defaultLabel = button.textContent;
        if (!Object.prototype.hasOwnProperty.call(button.dataset,'defaultGo')) {
          button.dataset.defaultGo = button.getAttribute('data-go') || '';
        }
        button.textContent = button.dataset.defaultLabel;
        button.hidden = false;
        button.disabled = false;
        button.removeAttribute('aria-current');
        if (button.dataset.defaultGo) button.setAttribute('data-go',button.dataset.defaultGo);
        else button.removeAttribute('data-go');
      });
    }

    function wireStartOwnJourneyNav(nav) {
      if (!nav) return;
      nav.dataset.activeProject = 'start-own';
      let context = nav.querySelector('.job-nav-context');
      if (!context) {
        context = doc.createElement('span');
        context.className = 'job-nav-context';
        nav.prepend(context);
      }
      context.textContent = 'JOB 1 · START YOUR OWN';

      [...nav.querySelectorAll('button')].forEach(button => {
        const stage = button.dataset.journeyStage || null;
        const defaultGo = button.dataset.defaultGo || '';
        if (!stage) {
          if (defaultGo === 'projects') {
            button.hidden = false;
            button.textContent = '← Project Library';
            button.dataset.jobExit = 'project-library';
            button.setAttribute('data-go','projects');
          } else {
            button.hidden = true;
            delete button.dataset.jobExit;
          }
          return;
        }

        delete button.dataset.jobExit;
        const directTarget = PROJECT_STAGE_TARGETS['start-own']?.[stage] || null;
        if (!directTarget) {
          button.hidden = true;
          return;
        }
        button.setAttribute('data-go',directTarget);
        button.dataset.jobProject = 'start-own';
        button.dataset.jobTarget = directTarget;
        button.textContent = START_OWN_NAV_LABELS[stage] || button.dataset.defaultLabel;

        // Duplicate technical stages project onto the same Job 1 customer surface. Keep one button only.
        if (stage === 'review' || stage === 'terms' || stage === 'recap') button.hidden = true;
      });
    }

    function selectJourneyProject(projectId) {
      const nextJourneyProject = projectId || null;
      if (activeJourneyProject !== nextJourneyProject) { proofHandoff = null; proofSimulation = null; }
      activeJourneyProject = nextJourneyProject;
      seatJourneySnapshot = null;
      if (activeJourneyProject) doc.documentElement.dataset.activeJourneyProject = activeJourneyProject;
      else delete doc.documentElement.dataset.activeJourneyProject;

      const nav = doc.querySelector('.recovery-nav');
      if (nav) {
        restoreJourneyNav(nav);
        if (activeJourneyProject === 'start-own') {
          wireStartOwnJourneyNav(nav);
        } else if (['alcove','outdoor'].includes(activeJourneyProject)) {
          ['alcove-review','terms','recap'].forEach(target => {
            const button = nav.querySelector('button[data-go="'+target+'"]');
            if (button) button.hidden = true;
          });
          const storeButton = nav.querySelector('button[data-go="store"]');
          const requestButton = nav.querySelector('button[data-go="request"]');
          const yardButton = nav.querySelector('button[data-go="yard"]');
          const recordButton = nav.querySelector('button[data-go="record"]');
          if (storeButton) storeButton.textContent = 'Store Answer';
          if (requestButton) requestButton.textContent = 'Accept / Pay';
          if (yardButton) yardButton.textContent = 'Store / Yard';
          if (recordButton) recordButton.textContent = 'Handoff / Record';
        } else if (activeJourneyProject === 'window-seat') {
          ['alcove-review','terms','recap'].forEach(target => {
            const button = nav.querySelector('button[data-go="'+target+'"]');
            if (button) button.hidden = true;
          });
          const storeButton = nav.querySelector('button[data-go="store"]');
          const requestButton = nav.querySelector('button[data-go="request"]');
          const yardButton = nav.querySelector('button[data-go="yard"]');
          const recordButton = nav.querySelector('button[data-go="record"]');
          if (storeButton) storeButton.textContent = 'Store Answer';
          if (requestButton) requestButton.textContent = 'Accept / Pay';
          if (yardButton) yardButton.textContent = 'Store / Yard';
          if (recordButton) recordButton.textContent = 'Handoff / Record';
        }
      }
    }

    function seatFrame() {
      return doc.querySelector('#window-seat-live .window-seat-shell-frame');
    }

    function cloneSeat(value) {
      return value == null ? value : JSON.parse(JSON.stringify(value));
    }

    function refreshSeatSnapshot(evaluate, supplied) {
      if (supplied) seatJourneySnapshot = cloneSeat(supplied);
      const bridge = seatFrame()?.contentWindow?.STBWindowSeatJourney;
      if (bridge) {
        try { seatJourneySnapshot = cloneSeat(evaluate ? bridge.evaluateCurrent() : bridge.snapshot()); } catch {}
      }
      return seatJourneySnapshot;
    }

    function annotateJourneyNav() {
      doc.querySelectorAll('.recovery-nav button').forEach(function(button) {
        const target = button.getAttribute('data-go') || button.getAttribute('data-canonical-go');
        const stage = LEGACY_TARGET_TO_STAGE[target] || null;
        if (stage) button.dataset.journeyStage = stage;
      });
    }

    function syncJourneyNav(stage) {
      doc.querySelectorAll('.recovery-nav button').forEach(function(button) {
        if (stage && button.dataset.journeyStage === stage && !button.hidden) button.setAttribute('aria-current', 'step');
        else button.removeAttribute('aria-current');
      });
    }

    function syncSeatNav(stage) {
      syncJourneyNav(stage);
    }

    function applyPendingSeatView() {
      const bridge = seatFrame()?.contentWindow?.STBWindowSeatJourney;
      if (!bridge) return false;
      try {
        if (pendingSeatView.mode === 'guided') bridge.showGuided(WINDOW_SEAT_STAGE_TO_ACTOR[pendingSeatView.stage || 'scan'] || 'scan');
        else bridge.showContinuous();
        refreshSeatSnapshot(false);
        return true;
      } catch {
        return false;
      }
    }

    function openSeatView(mode, stage) {
      if (activeJourneyProject !== 'window-seat') return false;
      if (!canonicalJourneyReady()) return false;
      if (mode === 'guided' && canonicalJourney.stages.indexOf(stage || 'scan') < 0) return false;
      pendingSeatView = {mode: mode, stage: stage || null};
      originalShow.call(win, 'window-seat-live');
      if (!applyPendingSeatView()) setTimeout(applyPendingSeatView, 0);
      if (mode === 'guided') syncSeatNav(stage || 'scan');
      else syncSeatNav(null);
      return true;
    }

    function showSeatContinuous() {
      return openSeatView('continuous', null);
    }

    function showSeatGuided(stage, supplied) {
      if (activeJourneyProject !== 'window-seat') return false;
      if (supplied) refreshSeatSnapshot(false, supplied);
      return openSeatView('guided', stage);
    }

    function showMappedProjectStage(projectId, stage) {
      if (projectId === 'start-own' && !canOpenStartOwnSimulationStage(stage)) { syncProofSimulationUI(); return true; }
      if (projectId === 'start-own' && (stage === 'scan' || stage === 'configure')) {
        originalShow.call(win,'start-own-live');
        setTimeout(() => showStartOwnStage(
          stage === 'configure' ? 'bench' : 'intent',
          stage === 'configure' ? 'definition-boundary' : null
        ),0);
        syncJourneyNav(stage);
        return true;
      }
      if (projectId === 'alcove') {
        const customerStage = {
          scan:'scan',
          configure:'configure',
          store:'store',
          review:'store',
          request:'request',
          yard:'yard',
          terms:'yard',
          recap:'record',
          record:'record'
        }[stage] || null;
        const target = customerStage ? PROJECT_STAGE_TARGETS.alcove[customerStage] : null;
        if (!target || !doc.getElementById(target)) return false;
        originalShow.call(win, target);
        setTimeout(syncAlcoveCommercialSurface,0);
        return true;
      }
      if (projectId === 'picnic' && ['yard','terms','recap','record'].includes(stage)) {
        originalShow.call(win, 'picnic-request');
        if (typeof syncPicnicJourney === 'function') setTimeout(syncPicnicJourney, 0);
        return true;
      }
      const target = PROJECT_STAGE_TARGETS[projectId]?.[stage] || null;
      if (!target || !doc.getElementById(target)) return false;
      originalShow.call(win, target);
      if (projectId === 'start-own' || projectId === 'outdoor') syncJourneyNav(stage);
      if (projectId === 'playhouse') setTimeout(sync, 0);
      if (projectId === 'picnic' && typeof syncPicnicJourney === 'function') setTimeout(syncPicnicJourney, 0);
      return true;
    }

    seatFrame()?.addEventListener('load', () => {
      setTimeout(applyPendingSeatView, 0);
    });
    applyPendingSeatView();

    window.addEventListener('message', function(event) {
      if (event.origin !== window.location.origin) return;
      if (event.source !== seatFrame()?.contentWindow) return;
      if (activeJourneyProject !== 'window-seat') return;
      if (event.data?.type === 'stb-window-seat-guided-handoff') {
        showSeatGuided(event.data.stage || 'store', event.data.snapshot || null);
        return;
      }
      if (event.data?.type === 'stb-window-seat-guided-stage') {
        showSeatGuided(event.data.stage, event.data.snapshot || null);
      }
    });

    const PROJECT_TILE_TO_JOURNEY = Object.freeze({
      'alcove-capture': 'alcove',
      'window-parts': 'playhouse',
      'picnic-chooser': 'picnic'
    });

    win.addEventListener('click', function(event) {
      if (activeJourneyProject !== 'alcove') return;
      const go = event.target.closest?.('[data-go]');
      if (!go) return;
      const target = go.getAttribute('data-go');
      const map = {
        'alcove-review':'store',
        'request':'request',
        'terms':'yard',
        'recap':'record'
      };
      const destination = map[target] || null;
      if (!destination) return;
      event.preventDefault();
      event.stopImmediatePropagation();
      originalShow.call(win,destination);
      setTimeout(syncAlcoveCommercialSurface,0);
    }, true);

    win.addEventListener('click', function(event) {
      const exitButton = event.target.closest?.('.recovery-nav button[data-job-exit="project-library"]');
      if (!exitButton || activeJourneyProject !== 'start-own') return;
      event.preventDefault();
      event.stopImmediatePropagation();
      selectJourneyProject(null);
      originalShow.call(win,'projects');
    }, true);

    win.addEventListener('click', function(event) {
      const navButton = event.target.closest?.('.recovery-nav button[data-journey-stage]');
      if (!navButton || !activeJourneyProject) return;
      const stage = navButton.dataset.journeyStage;
      if (!stage) return;
      event.preventDefault();
      event.stopImmediatePropagation();
      if (activeJourneyProject === 'window-seat') {
        showSeatGuided(stage);
        return;
      }
      showMappedProjectStage(activeJourneyProject, stage);
    }, true);

    win.addEventListener('click', function(event) {
      if (activeJourneyProject === 'picnic' && event.target.closest?.('#confirm-picnic')) {
        event.preventDefault();
        event.stopImmediatePropagation();
        doc.documentElement.dataset.picnicRevisionConfirmed = 'true';
        originalShow.call(win, 'picnic-request');
        setTimeout(syncPicnicJourney, 0);
        return;
      }
      if (activeJourneyProject === 'playhouse' && event.target.closest?.('#playhouse-review [data-canonical-go="playhouse-request"]')) {
        doc.documentElement.dataset.playhouseRevisionConfirmed = 'true';
      }
    }, true);

    // Project identity is selected at the window-capture boundary so it runs
    // before the older front-door preview handler can stop propagation.
    // A route or stage change never selects a project implicitly.
    win.addEventListener('click', function(event) {
      const tile = event.target.closest?.('#projects .tile[data-go]');
      if (!tile) return;
      const target = tile.getAttribute('data-go');
      if (target === 'start-own') {
        selectJourneyProject('start-own');
        return;
      }
      if (target === 'picnic-chooser') {
        selectJourneyProject('outdoor');
        return;
      }
      selectJourneyProject(PROJECT_TILE_TO_JOURNEY[target] || null);
    }, true);

    function openCurrentOutdoorBuildFromLegacyRoute() {
      selectJourneyProject('outdoor');
      originalShow.call(win, 'outdoor-build-live');
    }

    win.show = function(id) {
      const target = String(id);
      if (QUARANTINED_OUTDOOR_TARGETS.has(target)) {
        openCurrentOutdoorBuildFromLegacyRoute();
        return;
      }
      const stage = LEGACY_TARGET_TO_STAGE[target] || null;
      if (activeJourneyProject === 'window-seat') {
        if (stage) { showSeatGuided(stage); return; }
        if (target === 'projects' || target === 'landing' || target === 'my-projects' || target === 'archive') {
          pendingSeatView = {mode:'continuous',stage:null};
        }
      } else if (stage && activeJourneyProject) {
        showMappedProjectStage(activeJourneyProject, stage);
        return;
      }
      const result = originalShow.apply(this, arguments);
      if (target.startsWith('playhouse')) setTimeout(sync, 0);
      if (target.startsWith('alcove') || (activeJourneyProject === 'alcove' && ['store','request','yard','record','terms','recap'].includes(target))) setTimeout(syncAlcoveCommercialSurface, 0);
      return result;
    };
    function installDeveloperBuildGuides() {
      const spec = window.STBBuildGuideSpec || null;
      if (!spec || typeof spec.render !== 'function') {
        doc.documentElement.dataset.buildGuideVersion = 'MISSING';
        return false;
      }
      doc.querySelectorAll('.page').forEach(page => {
        if (!page.id) return;
        let rail = page.querySelector(':scope > aside.rail');
        if (!rail) {
          rail = doc.createElement('aside');
          rail.className = 'rail';
          page.append(rail);
        }
        rail.classList.add('dev-build-guide');
        rail.setAttribute('aria-label','Build guide · developer notes');
        rail.dataset.buildGuidePage = page.id;
        rail.innerHTML = spec.render(page.id);
      });
      doc.documentElement.dataset.buildGuideVersion = spec.version;
      return true;
    }

    installDeveloperBuildGuides();
    annotateJourneyNav();
    if (!canonicalJourneyReady()) return false;
    doc.documentElement.dataset.canonicalJourneyVersion = canonicalJourney.version;
    return true;
  };

  const scheduleApply = () => {
    let attempts = 0;
    const timer = setInterval(() => {
      attempts += 1;
      try {
        if (apply() || attempts > 200) clearInterval(timer);
      } catch (error) {
        if (attempts > 200) clearInterval(timer);
      }
    }, 50);
  };
  shell.addEventListener('load', scheduleApply);
  if (shell.contentDocument?.readyState === 'complete') scheduleApply();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Scan-to-Build</title>
    <link rel="stylesheet" href="/styles.css">
    <style id="stb-donor-presentation-style">
      :root{
        --bg:#faf9f7; --surface:#ffffff; --rail:#f4f2ef; --tint:#f6efe4; --grass:#eef2e6;
        --border:#e3ded7; --border-accent:#d9c3a2;
        --text:#1c1917; --text-2:#57534e; --text-3:#8a8580; --accent:#7a4f22;
        --warn-bg:#fdf6e3; --warn:#8a6d1f; --ok:#5d7f3f;
      }
      @media (prefers-color-scheme: dark){
        :root{--bg:#16150f;--surface:#1e1c16;--rail:#191711;--tint:#262015;--grass:#1b2016;
          --border:#332f26;--border-accent:#4d4130;--text:#f2efe8;--text-2:#b4aea3;--text-3:#847d72;
          --accent:#e0ad74;--warn-bg:#2b2413;--warn:#d4b483;--ok:#8fb36a}
      }
      body{background:var(--bg);color:var(--text);font:15px/1.6 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
      #app{width:min(1040px,100%);margin:0 auto;padding:28px 20px 28px}
      .app-footer{width:min(1040px,100%);border-top:0;padding:0 20px 36px;color:var(--text-3)}
      .app-footer .invariant{border-top:1px solid var(--border);padding-top:14px;color:var(--text);font-size:11px;letter-spacing:.09em}
      .foundation-status{font-size:11px}
      .donor-page{display:grid;grid-template-columns:1fr 172px;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface);margin-bottom:24px}
      .donor-main{padding:28px 26px;border-right:1px solid var(--border);min-width:0}
      .donor-split{display:flex;min-width:0;border-right:1px solid var(--border)}
      .donor-page h1{margin:0 0 12px;font-size:25px;line-height:1.2;letter-spacing:-.01em}
      .donor-page h2{margin:0 0 12px;font-size:18px}.donor-page h3{margin:0 0 5px;font-size:16px}
      .donor-page p{margin:0 0 12px}.donor-sub{margin:0 0 22px;color:var(--text-2)}.donor-dim{color:var(--text-2)}
      .donor-verb b{display:block}.donor-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
      .donor-page button,.donor-page .donor-button{appearance:none;font:inherit;font-size:13px;padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;text-align:left;text-decoration:none;min-height:0;width:auto}
      .donor-page button:hover,.donor-page .donor-button:hover{border-color:var(--text-3)}
      .donor-rail{background:var(--rail);padding:24px 14px 16px;display:flex;flex-direction:column}
      .donor-rail .hd{font-size:10px;font-weight:600;letter-spacing:.08em;color:var(--text-3);margin:0 0 24px}
      .donor-rail .goal{font-size:13px;font-weight:600;margin:0 0 30px}
      .donor-rail .row{margin:0 0 28px}.donor-rail .row:last-of-type{margin-bottom:16px}
      .donor-rail .row b{display:block;font-size:13px;margin-bottom:3px}.donor-rail .row span{font-size:11.5px;line-height:1.45;color:var(--text-2)}
      .donor-rail .foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--border)}.donor-rail .foot button{width:100%;font-size:11.5px}.donor-rail .foot p{margin:8px 0 0;font-size:10px;line-height:1.4;color:var(--text-3)}
      .donor-ribbon{width:128px;flex:none;border-right:1px solid var(--border);background:var(--rail);padding:14px 10px;display:flex;flex-direction:column;gap:12px}
      .donor-tile{display:block;padding:0!important;border:0!important;background:transparent!important;border-radius:0!important;text-align:left!important;width:100%!important;cursor:pointer;color:var(--text)}
      .donor-tile svg{width:100%;display:block;border-radius:9px;border:1px solid var(--border);background:var(--surface)}.donor-tile.first svg{border-color:var(--border-accent)}
      .donor-tile .t1{display:block;margin:5px 0 0;font-size:11px;font-weight:600;line-height:1.2}.donor-tile.first .t1{color:var(--accent)}
      .donor-tile .t2{display:block;margin:1px 0 0;font-size:9.5px;line-height:1.25;color:var(--text-3)}
      .donor-ribbonbody{padding:18px;min-width:0}.donor-ribbonbody ul{margin:0 0 10px;padding-left:18px;color:var(--text-2)}
      .donor-status{background:var(--rail);border-radius:9px;padding:12px 14px;margin:14px 0 0;font-size:12.5px;color:var(--text-2)}
      .primary-nav{font-size:11px;border:0;padding:0 0 10px;gap:6px 12px;color:var(--text-3)}
      .primary-nav a{color:var(--text-2)}.nav-current{color:var(--accent)!important}.nav-pending{display:none}
      .screen-landing,.screen-orientation{max-width:none}.screen-landing>.screen-heading,.screen-orientation>.screen-heading{outline:none}
      .donor-live-config{display:grid!important;grid-template-columns:1fr 172px!important;padding:0!important;border:1px solid var(--border)!important;border-radius:12px!important;overflow:hidden;background:var(--surface)!important;margin:0 0 24px!important}
      .donor-live-config>.donor-config-main{min-width:0;border-right:1px solid var(--border);padding:20px 18px 18px}
      .donor-live-config .narrative-kicker{font-size:11px;font-weight:600;letter-spacing:.09em;color:var(--text-3);margin:0 0 4px}
      .donor-live-config h2{margin:0 0 5px;font-size:22px}.donor-live-config .config-lead{margin:0 0 18px;color:var(--text-2)}
      .donor-config-layout{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:14px;margin-bottom:14px}.donor-config-view{min-width:0}.donor-config-controls{min-width:0}
      .donor-live-config .config-grid{display:grid;grid-template-columns:1fr;gap:7px}.donor-live-config .config-field{border:0;border-bottom:1px solid var(--border);border-radius:0;padding:7px 0;background:transparent}
      .donor-live-config .config-field label{font-size:12px}.donor-live-config .config-field input{padding:6px 8px;background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--text)}
      .donor-live-config .config-actions{margin:10px 0;gap:5px}.donor-live-config .config-actions button{font-size:11px;padding:5px 8px;min-height:0}
      .donor-live-config .project-renderer{margin:0;border:0;padding:0;background:transparent}.donor-live-config .project-renderer h3{display:none}.donor-live-config .project-orthographic-svg{background:var(--grass);border-radius:9px;max-height:330px}
      .donor-live-config .config-engine{border-top:1px solid var(--border);padding-top:14px}.donor-live-config .config-engine-grid{grid-template-columns:1fr 1fr}.donor-live-config .config-engine-card{border:0;border-radius:0;padding:8px 10px;background:transparent;border-right:1px solid var(--border)}
      .donor-live-config .config-engine-card:last-child{border-right:0}.donor-live-config .config-engine-card h3{font-size:11px;color:var(--text-3)}
      .donor-choice-banner{background:var(--tint);border:1px solid var(--border-accent);border-radius:9px;padding:10px 12px;margin:0 0 14px;color:var(--accent);font-size:12.5px}
      .donor-range-label{display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin:0 0 4px}.donor-range{width:100%;accent-color:var(--accent);margin:0 0 7px}.donor-quick{display:flex;gap:4px;margin-bottom:12px}.donor-quick button{font-size:10.5px;padding:3px 7px}
      .donor-price{background:var(--tint);border:1px solid var(--border-accent);border-radius:10px;padding:14px 16px;margin:12px 0}.donor-price .lab{margin:0;font-size:10px;font-weight:600;letter-spacing:.06em;color:var(--accent)}.donor-price .big{margin:2px 0 0;font-size:22px;font-weight:600;color:var(--accent)}
      .donor-review-link{display:inline-block;margin-top:12px}
      .donor-framed-screen{display:grid!important;grid-template-columns:1fr 172px!important;border:1px solid var(--border)!important;border-radius:12px!important;overflow:hidden;background:var(--surface)!important;padding:0!important}.donor-framed-screen>.donor-main{margin:0}.donor-framed-screen .review-section,.donor-framed-screen .record-section,.donor-framed-screen .store-panel{border-color:var(--border);border-radius:9px}
      @media(max-width:760px){#app{padding:16px 12px}.donor-page,.donor-live-config,.donor-framed-screen{grid-template-columns:1fr!important}.donor-main,.donor-split,.donor-live-config>.donor-config-main{border-right:0;border-bottom:1px solid var(--border)}.donor-rail .row,.donor-rail .goal{margin-bottom:16px}.donor-config-layout{grid-template-columns:1fr}.donor-ribbon{width:112px}}
    </style>
  </head>
  <body>
    <div id="app"></div>
    <footer class="app-footer">
      <p class="invariant" id="invariant">NO BLOOD ON WOOD</p>
      <details class="foundation-status"><summary>Local foundation</summary><dl>
        <dt>Origin</dt><dd id="origin-status">checking</dd><dt>IndexedDB</dt><dd id="indexeddb-status">checking</dd>
        <dt>Blob</dt><dd id="blob-status">checking</dd><dt>SHA-256</dt><dd id="sha256-status">checking</dd>
        <dt>Storage origin</dt><dd id="storage-origin-status">checking</dd><dt>Save</dt><dd id="save-status">idle</dd>
        <dt>Source</dt><dd id="source-status">idle</dd><dt>Attempt</dt><dd id="attempt-status">idle</dd><dt>Unapplied</dt><dd id="unapplied-status">none</dd>
      </dl></details>
    </footer>
    <script type="module" src="/app.mjs"></script>
    <script type="module">
      const app=document.getElementById('app'), donorIntentKey='stb-donor-intent';
      const rail=rows=>`<aside class="donor-rail"><p class="hd">BUILD GUIDE</p><p class="goal">Goal</p>${rows.map(([a,b])=>`<div class="row"><b>${a}</b><span>${b}</span></div>`).join('')}<div class="foot"><button type="button" data-donor-notes>Build notes ↗</button><p>Reference build. Input welcome.</p></div></aside>`;
      const landingRail=[['Say what this is','One screen, no scrolling to understand it.'],['Show who does what','Four steps are yours, one is ours.'],['Make the seam visible','The definition reaches the cut unchanged.'],['Offer three ways in','Same road after. Different opening.']];
      const orientation={
        new:{heading:`We don't sell products.`,sub:`We capture what you want and turn it into parts. You tell us. That's what you get.`,body:`<p><b>No catalogue.</b> <span class="donor-dim">Nothing here was made before you asked for it. There's no shelf sitting in a warehouse waiting to almost fit your wall.</span></p><p><b>No reinterpreting.</b> <span class="donor-dim">What you confirm is what gets cut. Not something close. Not something easier. Not something we thought you meant.</span></p><p><b>No returns</b><span class="donor-dim">, because nothing is stock. Your parts are your parts. That's why the confirm step is real, and why we show you everything before you take it.</span></p><p><b>We don't check your numbers.</b> <span class="donor-dim">If the opening is 45½ and you enter 45, you get 45. The measurements are yours, and so is what comes back.</span></p><p class="donor-dim" style="margin-top:18px">Nothing costs anything until you say so. Nothing gets cut today.</p>`,buttons:`<button type="button" data-action="next" data-donor-intent="projects">START</button>`,rail:[['Name the category','Not a store. Not a catalogue.'],['Set expectation once','Made to your numbers, not picked off a shelf.'],['Make confirm mean something','Nothing to return, so the step matters.'],['Hand over responsibility','Your numbers, your parts. No scolding.']]},
        returning:{heading:`Nothing moved while you were gone.`,sub:`Your measurements, your choices, your confirmed version — exactly as you left them.`,body:`<p style="margin-bottom:24px"><b>What changed is outside your project.</b> <span class="donor-dim">What the store had on the rack, what the machine could do that day. Those were true when you asked. We'll ask again.</span></p><h2>Pick up, or do it again</h2><p><b>Resume.</b> <span class="donor-dim">Open it where you stopped.</span></p><p><b>Make another.</b> <span class="donor-dim">Same project, new numbers. The second one takes minutes.</span></p><p><b>Replace a part.</b> <span class="donor-dim">One shelf, one panel. You don't reorder the whole thing.</span></p>`,buttons:`<button type="button" data-action="next" data-donor-intent="resume">OPEN A PROJECT</button><button type="button" data-action="next" data-donor-intent="projects">START SOMETHING NEW</button>`,rail:[["Don't start over",'Everything saved is still saved.'],["Trust what's saved",'Nothing edited in the background.'],['Second one is easy','Same project, new numbers.'],['Parts stay orderable','Replace one, not all.']]},
        professional:{heading:`Send us what you want. Nothing else.`,sub:`We don't need your job file, your client list, or your pricing.`,body:`<p><b>The least that works:</b> <span class="donor-dim">a material, a dimension, an operation. That's a part we can make.</span></p><p style="margin-bottom:26px"><b>Send more if it helps you.</b> <span class="donor-dim">A drawing, a photo, a PDF — we keep it with the job. Held as reference, not read.</span></p><h2>Your customer's copy — your call</h2><p class="donor-dim" style="margin-bottom:14px">Every job can carry a record your customer keeps. You decide what's in it.</p><p><b>Nothing.</b> <span class="donor-dim">The job stays yours.</span></p><p><b>Just the parts.</b> <span class="donor-dim">Names and sizes. Five years out, one shelf breaks — they order that one piece instead of calling you about a whole unit.</span></p><p><b>Everything.</b> <span class="donor-dim">Parts, material, what was made and when.</span></p><p class="donor-dim">Different answer per job. It's your customer.</p>`,buttons:`<button type="button" data-action="next" data-donor-intent="professional-attach">ATTACH A FILE</button><button type="button" data-action="next" data-donor-intent="professional-type">TYPE IT IN</button>`,rail:[['Reduce friction','Send the least that works.'],['Save time','No re-drawing, no re-quoting.'],['Plan end early','Decide the handoff before the job starts.'],['Offer organization tool','Part records his customer keeps.']]}
      };
      const projectSvgs={
        own:`<svg viewBox="0 0 100 72"><defs><linearGradient id="donor-plank" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7d5430"/><stop offset=".5" stop-color="#5e3d1f"/><stop offset="1" stop-color="#432a14"/></linearGradient></defs><rect width="100" height="72" fill="var(--surface)"/><g transform="rotate(-25 50 34)"><rect x="12" y="27" width="20" height="13" rx="3" fill="#3b2412" stroke="#241408"/><path d="M32 27.5 L88 30 L88 37.5 L32 40 Z" fill="#dfe4e9" stroke="#8b959e"/><path d="M34 40 l3.4-3.4 3.4 3.4 3.4-3.4 3.4 3.4 3.4-3.4 3.4 3.4 3.4-3.4 3.4 3.4 3.4-3.4 3.4 3.4 3.4-3.4 3.4 3.4 3.4-3.4 3.4 3.4" fill="none" stroke="#7c868f"/></g><g transform="rotate(25 50 34)"><rect x="12" y="28" width="76" height="12" rx="2.5" fill="#efa919" stroke="#9c6c0a"/><rect x="40" y="31" width="20" height="6" rx="3" fill="#fbf7ec" stroke="#9c6c0a"/><circle cx="50" cy="34" r="2.2" fill="#8ed15a" stroke="#4e8a26"/></g><rect x="4" y="59" width="92" height="10" rx="2" fill="url(#donor-plank)"/></svg>`,
        alcove:`<svg viewBox="0 0 100 72"><rect width="100" height="72" fill="#f3ece1"/><g transform="skewY(-7) translate(0 9)"><rect x="16" y="6" width="68" height="54" fill="#c89b62"/><rect x="20" y="10" width="60" height="46" fill="#e8d4b4"/><g fill="#c89b62"><rect x="20" y="22" width="60" height="3.5"/><rect x="20" y="36" width="60" height="3.5"/><rect x="20" y="50" width="60" height="3.5"/></g><g><rect x="24" y="12" width="4" height="10" fill="#8c4b3f"/><rect x="29" y="13" width="3" height="9" fill="#41618a"/><rect x="33" y="11" width="4" height="11" fill="#c2a03a"/><rect x="66" y="14" width="10" height="8" fill="#7fa05c"/><rect x="62" y="28" width="14" height="8" fill="#b9743f"/></g><rect x="16" y="6" width="68" height="54" fill="none" stroke="#9a7343" stroke-width="1.4"/></g></svg>`,
        window:`<svg viewBox="0 0 100 72"><rect width="100" height="72" fill="#efe6d8"/><rect x="4" y="4" width="92" height="64" fill="#dcbd8c"/><rect x="8" y="8" width="16" height="56" fill="#f0e2ca"/><rect x="76" y="8" width="16" height="56" fill="#f0e2ca"/><rect x="26" y="8" width="48" height="42" fill="#f5eee0"/><path d="M50 12 L70 24 L70 42 L50 48 L30 42 L30 24 Z" fill="#7ec0e8" stroke="#c89b62" stroke-width="3"/><g fill="#6fa03f"><ellipse cx="40" cy="38" rx="9" ry="7"/><ellipse cx="58" cy="36" rx="10" ry="8"/></g><rect x="28" y="50" width="44" height="8" rx="2.5" fill="#c0392b"/><rect x="26" y="58" width="48" height="6" fill="#e8d4b4"/><rect x="4" y="4" width="92" height="64" fill="none" stroke="#a87f4b"/></svg>`,
        picnic:`<svg viewBox="0 0 100 72"><rect width="100" height="72" fill="#e7eddd"/><ellipse cx="50" cy="64" rx="44" ry="6" fill="#c3d3a8"/><path d="M27 27 L13 63 L20 63 L32 27 Z" fill="#a97c47" stroke="#7d5a30"/><path d="M33 27 L47 63 L40 63 L28 27 Z" fill="#b98b52" stroke="#7d5a30"/><path d="M67 27 L53 63 L60 63 L72 27 Z" fill="#a97c47" stroke="#7d5a30"/><path d="M73 27 L87 63 L80 63 L68 27 Z" fill="#b98b52" stroke="#7d5a30"/><rect x="23" y="44" width="54" height="4" fill="#9d7241"/><rect x="4" y="45" width="30" height="6" rx="1" fill="#c89b62" stroke="#8f6733"/><rect x="66" y="45" width="30" height="6" rx="1" fill="#c89b62" stroke="#8f6733"/><rect x="6" y="22" width="88" height="8" rx="1.5" fill="#dcae72" stroke="#8f6733"/></svg>`
      };
      const picnicSvg=(form,scope)=>{const frames=scope==='frame-kit',c='#C9A227';let g=`<rect width="96" height="60" fill="#eef2e6"/><ellipse cx="48" cy="50" rx="41" ry="4" fill="#cfdcbb"/>`;if(form==='attached-bench'){if(frames)g+=`<rect x="8" y="19" width="80" height="6" rx="1" fill="none" stroke="${c}" stroke-dasharray="4 3" opacity=".6"/><rect x="10" y="35" width="76" height="4" fill="none" stroke="${c}" stroke-dasharray="4 3" opacity=".6"/>`;g+=`<path d="M30 22 L20 50 L25 50 L34 22 Z" fill="${c}"/><path d="M34 22 L44 50 L39 50 L30 22 Z" fill="#B8931F"/><path d="M62 22 L52 50 L57 50 L66 22 Z" fill="${c}"/><path d="M66 22 L76 50 L71 50 L62 22 Z" fill="#B8931F"/><rect x="20" y="36" width="24" height="3" fill="${c}"/><rect x="52" y="36" width="24" height="3" fill="${c}"/>`;if(!frames)g+=`<rect x="10" y="35" width="76" height="4" fill="#D9B43C"/><rect x="8" y="19" width="80" height="6" fill="#E0BC55"/>`}else{if(frames)g+=`<rect x="26" y="19" width="44" height="6" fill="none" stroke="${c}" stroke-dasharray="4 3"/><rect x="4" y="36" width="18" height="4" fill="none" stroke="${c}" stroke-dasharray="3 2"/><rect x="74" y="36" width="18" height="4" fill="none" stroke="${c}" stroke-dasharray="3 2"/>`;else g+=`<rect x="26" y="19" width="44" height="6" fill="#E0BC55"/><rect x="4" y="36" width="18" height="4" fill="#D9B43C"/><rect x="74" y="36" width="18" height="4" fill="#D9B43C"/>`;g+=`<rect x="31" y="25" width="3.5" height="25" fill="#B8931F"/><rect x="61" y="25" width="3.5" height="25" fill="#B8931F"/><rect x="7" y="40" width="2.5" height="10" fill="#B8931F"/><rect x="17" y="40" width="2.5" height="10" fill="#B8931F"/><rect x="77" y="40" width="2.5" height="10" fill="#B8931F"/><rect x="87" y="40" width="2.5" height="10" fill="#B8931F"/>`}return `<svg viewBox="0 0 96 60">${g}</svg>`};
      function renderLanding(screen){if(screen.dataset.donorRendered==='landing')return;screen.dataset.donorRendered='landing';screen.className='screen screen-landing donor-page';screen.innerHTML=`<div class="donor-main"><h1 class="screen-heading" id="screen-heading" tabindex="-1">SCAN TO BUILD</h1><p class="donor-sub">Your idea. Your measurements. Your parts.</p><p class="donor-verb"><b>YOU SCAN</b><span class="donor-dim">Capture the space with laser, AR, or tape. The measurements are yours.</span></p><p class="donor-verb"><b>YOU DEFINE</b><span class="donor-dim">One part, several parts, or a need we don't offer yet.</span></p><p class="donor-verb"><b>YOU SELECT</b><span class="donor-dim">Set the material, size, doors, and other available options.</span></p><p class="donor-verb"><b>YOU CONFIRM</b><span class="donor-dim">Approve exactly what you want built—and nothing else.</span></p><p class="donor-verb"><b>YOUR DEFINITION REACHES THE CUT</b><span class="donor-dim">Your confirmed dimensions guide the work without being redrawn, retyped, or reinterpreted along the way.</span></p><p class="donor-verb"><b>WE CUT · MILL · DRILL · LABEL</b><span class="donor-dim">Within stated limits. Staged for pickup. We tell you when they're ready.</span></p><p style="font-weight:600;font-size:16px;margin:0 0 24px">YOU BUILD.</p><p style="font-size:13px;font-weight:600;letter-spacing:.05em;color:var(--text-2);margin:0">HOW ARE YOU STARTING?</p><div class="donor-btns"><button type="button" data-action="choose-actor" data-actor="new">NEW USER</button><button type="button" data-action="choose-actor" data-actor="returning">RETURNING USER</button><button type="button" data-action="choose-actor" data-actor="professional">PROFESSIONAL</button></div></div>${rail(landingRail)}`}
      function renderOrientation(screen){const actor=screen.dataset.actor,d=orientation[actor];if(!d||screen.dataset.donorRendered===actor)return;screen.dataset.donorRendered=actor;screen.className='screen screen-orientation donor-page';screen.innerHTML=`<div class="donor-main"><h1 class="screen-heading" id="screen-heading" tabindex="-1">${d.heading}</h1><p class="donor-sub">${d.sub}</p>${d.body}<div class="donor-btns">${d.buttons}</div></div>${rail(d.rail)}`}
      const tile=(kind,title,sub,attrs,first='')=>`<button type="button" class="donor-tile ${first}" ${attrs}>${projectSvgs[kind]}<span class="t1">${title}</span><span class="t2">${sub}</span></button>`;
      function renderResume(screen){if(screen.dataset.donorRendered==='resume')return;const saved=screen.querySelector('.saved-projects');screen.dataset.donorRendered='resume';screen.innerHTML=`<section class="donor-page"><div class="donor-main"><h1 class="screen-heading" id="screen-heading" tabindex="-1">Open a project</h1><p class="donor-sub">Everything saved is still saved. External Store and capability facts may need a fresh answer.</p><div data-donor-resume-host></div><div class="donor-btns"><button type="button" data-donor-new-from-resume>START SOMETHING NEW</button></div></div>${rail([["Don't start over",'Everything saved is still saved.'],['Trust what is saved','Nothing is edited in the background.'],['Refresh external facts','Store and capability may have changed.']])}</section>`;const host=screen.querySelector('[data-donor-resume-host]');if(saved){saved.querySelector('h2')?.remove();host.append(saved)}}
      function renderProjects(screen){if(screen.dataset.donorRendered==='projects')return;screen.dataset.donorRendered='projects';screen.innerHTML=`<section class="donor-page"><div class="donor-split"><div class="donor-ribbon">${tile('own','Start your own','Board, sketch, or file','data-action="start-own"','first')}${tile('alcove','Critical fit','Shelf insert','data-action="choose-mapped" data-class-id="alcove-shelf-blanks"')}${tile('window','Space utilization','Window seat','data-front-door="window-seat"')}${tile('picnic','Outdoor build','To fit your space','data-front-door="picnic"')}</div><div class="donor-ribbonbody"><h1 class="screen-heading" id="screen-heading" tabindex="-1" style="font-size:21px;margin-bottom:14px">What are you making?</h1><p><b>A bounded project is one somebody already worked out.</b> <span class="donor-dim">How the parts go together, what thickness holds up, where the fasteners land — that's settled. It doesn't get asked again.</span></p><p class="donor-dim">What's left is the part only you can answer: <span style="color:var(--text)">how big is your space, and what should it look like.</span> Answer about ten questions and you get a list of parts, cut to your numbers.</p><p class="donor-dim">You're not designing furniture. If a question needs a woodworker to answer it, we shouldn't be asking you.</p><p style="margin-bottom:20px"><b>That's why the list is worth a look first.</b> <span class="donor-dim">Not because your idea has to fit it — because when it does, you skip everything except the choices that are actually yours.</span></p><h3>Some answers open more questions</h3><p class="donor-dim" style="margin-bottom:7px">Doors on the bottom of the shelving, say. There's more than one way to do doors.</p><ul><li>Cut from flat stock, hinge cutouts machined, hardware pack to match</li><li>Picked from a catalogue, our parts cut to suit them</li><li>Just the machining — you already have the hinges you want</li><li>No doors. You looked, you changed your mind.</li></ul><p class="donor-dim" style="margin-bottom:20px">Say no and none of it appears.</p><h3>If nothing here is your thing</h3><p class="donor-dim" style="margin-bottom:0">Tell us anyway. We'd rather keep the record of what you wanted than push it into the closest thing on the list. Some of what's on this ribbon got here that way.</p></div></div>${rail([['Name the problem','Critical fit, not “shelving.”'],['Make it want touching','Color and character earn the click.'],['Keep the door open','Start your own is first and never moves.'],['Capture the miss','A need we do not offer is worth keeping.']])}</section>`}
      function picnicTile(form,scope,title,sub){return `<button type="button" class="donor-tile" data-picnic-form="${form}" data-picnic-scope="${scope}">${picnicSvg(form,scope)}<span class="t1">${title}</span><span class="t2">${sub}</span></button>`}
      function renderPicnicChooser(screen){const chooser=screen.querySelector('[data-stb-picnic-chooser]');if(!chooser||screen.dataset.donorRendered==='picnic')return false;screen.dataset.donorRendered='picnic';screen.innerHTML=`<section class="donor-page"><div class="donor-split"><div class="donor-ribbon">${picnicTile('attached-bench','complete-part-set','Attached bench','The classic one')}${picnicTile('attached-bench','frame-kit','Attached · frames','You bring boards')}${picnicTile('separate-benches','complete-part-set','Separate benches','Three pieces')}${picnicTile('separate-benches','frame-kit','Separate · frames','You bring boards')}</div><div class="donor-ribbonbody"><p style="font-size:12px;color:var(--text-3);margin:0 0 10px"><button type="button" data-front-door-back style="padding:0;border:0;background:transparent;color:var(--accent)">Begin</button> › Picnic tables</p><h1 class="screen-heading" id="screen-heading" tabindex="-1">Picnic tables</h1><p class="donor-sub">Off the shelf, three choices. You have a tape measure.</p><p><b>Attached bench.</b> <span class="donor-dim">The one everybody pictures. Seats hang off the same A-frames as the top, so it's one object — sit down and the whole thing stays put. Nothing to line up on assembly.</span></p><p><b>Separate benches.</b> <span class="donor-dim">A table and two benches. Each stands on its own, so you can pull a bench out, put one against a wall, or seat someone in a wheelchair at the end. Costs more — three sets of legs instead of two.</span></p><p style="margin-bottom:16px"><b>Frames only.</b> <span class="donor-dim">Either shape, minus the boards. We cut the frames — the angled legs, the rails, the cleats, the braces, everything that's hard. You supply straight 2×6 and cut it to the list we send.</span></p><div style="background:var(--rail);border-radius:9px;padding:12px 14px;margin-bottom:16px"><p style="margin:0 0 5px;font-size:13px;font-weight:600">Why anyone picks frames only</p><p style="margin:0 0 6px;font-size:12.5px;color:var(--text-2)">A long table can exceed what a local rack or fulfillment path can reasonably provide as finished straight boards.</p><p style="margin:0;font-size:12.5px;color:var(--text-2)"><b style="color:var(--text)">Frames don't care how long the table is.</b> The hard geometry can remain local while the long straight members stay explicitly on your supply list.</p></div><p class="donor-dim" style="margin:0;font-size:12.5px">The form and the fulfillment scope are separate choices. Structural, Store, price, machine and commercial answers remain separate facts.</p></div></div>${rail([['Four doors, two classes','Form is a class. Scope is a flag.'],['Name the tradeoff','Separate benches use a different parts structure.'],['Frames-only has a reason','Not a discount. A way past the local rack.'],['Structure is never a choice','Not silently invented here.']])}</section>`;return true}
      function frameLiveScreen(screen,rows){if(screen.dataset.donorFrame==='true')return;screen.dataset.donorFrame='true';const kids=[...screen.childNodes],main=document.createElement('div');main.className='donor-main';kids.forEach(k=>main.append(k));screen.classList.add('donor-framed-screen');screen.append(main);screen.insertAdjacentHTML('beforeend',rail(rows))}
      function enhancePicnicConfig(screen){const panel=screen.querySelector('[data-project-configurator="classic-picnic-table-fixture"]');if(!panel||panel.dataset.donorEnhanced==='true')return;panel.dataset.donorEnhanced='true';panel.classList.add('donor-live-config');const kicker=panel.querySelector('.narrative-kicker'),title=panel.querySelector('h2'),lead=panel.querySelector('.config-lead'),grid=panel.querySelector('.config-grid'),actions=panel.querySelector('.config-actions'),note=panel.querySelector('.config-fixture'),status=panel.querySelector('[data-config-status]'),engine=panel.querySelector('.config-engine'),renderer=panel.querySelector('.project-renderer');const main=document.createElement('div');main.className='donor-config-main';[kicker,title,lead].forEach(x=>x&&main.append(x));const banner=document.createElement('div');banner.className='donor-choice-banner';const form=panel.querySelector('[data-config-field="tableForm"]')?.value||'—',scope=panel.querySelector('[data-config-field="requestedScope"]')?.value||'—';banner.innerHTML=`<b>${form==='attached-bench'?'Attached bench':'Separate benches'} · ${scope==='frame-kit'?'frames only':'complete cut-kit'}</b><span>This selection is part of the candidate definition. Store, structural, price and production authority remain separate.</span>`;main.append(banner);const layout=document.createElement('div');layout.className='donor-config-layout';const view=document.createElement('div');view.className='donor-config-view';if(renderer)view.append(renderer);const controls=document.createElement('div');controls.className='donor-config-controls';const lengthInput=panel.querySelector('[data-config-field="productLength"]');if(lengthInput){const lab=document.createElement('div');lab.className='donor-range-label';lab.innerHTML='<span>Length</span><span data-donor-length-value></span>';const range=document.createElement('input');range.type='range';range.className='donor-range';range.min='60';range.max='216';range.step='2';range.value=lengthInput.value||'88';const sync=()=>{lengthInput.value=range.value;lab.querySelector('[data-donor-length-value]').textContent=`${range.value} in`};range.addEventListener('input',sync);sync();controls.append(lab,range);const quick=document.createElement('div');quick.className='donor-quick';[[72,'6 ft'],[96,'8 ft'],[144,'12 ft']].forEach(([v,t])=>{const b=document.createElement('button');b.type='button';b.textContent=t;b.addEventListener('click',()=>{range.value=String(v);sync()});quick.append(b)});controls.append(quick)}if(grid)controls.append(grid);if(actions)controls.append(actions);layout.append(view,controls);main.append(layout);if(note)main.append(note);if(status)main.append(status);if(engine)main.append(engine);const price=document.createElement('div');price.className='donor-price';price.innerHTML='<p class="lab">STORE / PRICE</p><p class="big">UNRESOLVED</p><p style="margin:4px 0 0;font-size:11.5px;color:var(--text-2)">No donor placeholder price has been imported into the current system.</p>';main.append(price);const id=screen.dataset.localRecordId;if(id){const a=document.createElement('a');a.className='donor-button donor-review-link';a.href=`/project?id=${encodeURIComponent(id)}&view=confirm`;a.textContent='REVIEW AND CONFIRM';main.append(a)}panel.replaceChildren(main);panel.insertAdjacentHTML('beforeend',rail([['One number drives it','Length changes the candidate geometry.'],['Structure is not a choice','Unsupported structural claims remain unresolved.'],['Show the rule firing','Derived parts stay inspectable.'],['Keep authority separate','Definition is not production release.']]))}
      function render(){document.getElementById('stb-front-door-visual-style')?.remove();const landing=app.querySelector('[data-screen="landing"]');if(landing){renderLanding(landing);return}const orient=app.querySelector('[data-screen="orientation"]');if(orient){renderOrientation(orient);return}const begin=app.querySelector('[data-screen="begin"]');if(begin){if(renderPicnicChooser(begin))return;const actor=begin.closest('[data-shell]')?.dataset.actor,intent=sessionStorage.getItem(donorIntentKey);if(actor==='returning'&&intent==='resume')renderResume(begin);else renderProjects(begin);return}const q=app.querySelector('[data-screen="questions"]');if(q){enhancePicnicConfig(q);return}const confirm=app.querySelector('[data-screen="confirm"]');if(confirm)frameLiveScreen(confirm,[['Show the exact version','Review the definition being frozen.'],['Confirm ≠ contract','Commercial and production steps remain separate.'],['Leave a way back','Editing creates a new revision.']]);const store=app.querySelector('[data-screen="store"]');if(store)frameLiveScreen(store,[['Store answers Store questions','Supportability does not authorize a cut.'],['Keep the basis visible','Material and availability facts stay inspectable.']]);const result=app.querySelector('[data-screen="result"]');if(result)frameLiveScreen(result,[['Tell the truth about state','Result is not physical completion unless evidence says so.'],['Preserve unresolved facts','No green check silently upgrades authority.']]);const record=app.querySelector('[data-screen="record"]');if(record)frameLiveScreen(record,[['The owner keeps the thread','Revision and outcome history remain exportable.'],['Do not rewrite history','New facts append; old facts remain.']])}
      app.addEventListener('click',e=>{const intent=e.target.closest('[data-donor-intent]')?.dataset.donorIntent;if(intent)sessionStorage.setItem(donorIntentKey,intent);if(e.target.closest('[data-donor-new-from-resume]')){sessionStorage.setItem(donorIntentKey,'projects');renderProjects(app.querySelector('[data-screen="begin"]'))}if(e.target.closest('[data-donor-notes]'))alert('Build notes are collaborator guidance. They do not change project state.')},true);
      const observer=new MutationObserver(()=>queueMicrotask(render));observer.observe(app,{childList:true,subtree:true});queueMicrotask(render);
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Scan-to-Build</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
      .rx-context-back {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin: 0 0 14px;
        padding: 4px 0;
        border: 0;
        background: transparent;
        color: #7a4f22;
        font: inherit;
        font-size: 12.5px;
        font-weight: 650;
        cursor: pointer;
      }
      .rx-context-back:hover,
      .rx-context-back:focus-visible {
        text-decoration: underline;
        outline: none;
      }
      .rx-readme-pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        width: 100%;
        box-sizing: border-box;
        margin-top: 12px;
        padding: 7px 11px;
        border: 2px solid #12286f;
        border-radius: 999px;
        background: #fff;
        color: #12286f;
        font-size: 11.5px;
        font-weight: 700;
        line-height: 1;
        text-decoration: none;
      }
      .rx-readme-pill:hover,
      .rx-readme-pill:focus-visible {
        background: #f7f8fc;
        outline: 2px solid rgba(18, 40, 111, .16);
        outline-offset: 2px;
      }
      .rx-readme-pill svg {
        width: 16px;
        height: 16px;
        flex: none;
        fill: currentColor;
      }
      .rx-host [data-stb-project-doors],
      .rx-host [data-stb-picnic-chooser] {
        display: none !important;
      }
      @media (prefers-color-scheme: dark) {
        .rx-context-back { color: #d9c3a2; }
        .rx-readme-pill {
          border-color: #9fb0ff;
          background: #181613;
          color: #c9d2ff;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <footer class="app-footer">
      <p class="invariant" id="invariant">NO BLOOD ON WOOD</p>
      <details class="foundation-status">
        <summary>Local foundation</summary>
        <dl>
          <dt>Origin</dt>
          <dd id="origin-status">checking</dd>
          <dt>IndexedDB</dt>
          <dd id="indexeddb-status">checking</dd>
          <dt>Blob</dt>
          <dd id="blob-status">checking</dd>
          <dt>SHA-256</dt>
          <dd id="sha256-status">checking</dd>
          <dt>Storage origin</dt>
          <dd id="storage-origin-status">checking</dd>
          <dt>Save</dt>
          <dd id="save-status">idle</dd>
          <dt>Source</dt>
          <dd id="source-status">idle</dd>
          <dt>Attempt</dt>
          <dd id="attempt-status">idle</dd>
          <dt>Unapplied</dt>
          <dd id="unapplied-status">none</dd>
        </dl>
      </details>
    </footer>
    <script>
      (() => {
        const root = document.getElementById('app');
        const README_URL = 'https://github.com/GeorgePlattDemo/scan-to-build-system#readme';
        const WINDOW_REFERENCE_VIEW = 'stb-restored-page1-view';

        const navigate = (path) => {
          window.history.pushState({ path }, '', path);
          window.dispatchEvent(new PopStateEvent('popstate'));
        };

        const screenName = (main) =>
          main?.getAttribute('data-screen')
          ?? main?.closest('.app-shell')?.getAttribute('data-screen')
          ?? '';

        const fallbackBackPath = (main) => {
          const screen = screenName(main);
          if (screen === 'orientation' || screen === 'begin') return '/';
          return '/begin';
        };

        const exposeBeginMain = () => {
          const begin = root.querySelector('.app-shell[data-screen="begin"] > main.screen-begin');
          if (begin && !begin.hasAttribute('data-screen')) {
            begin.setAttribute('data-screen', 'begin');
          }
        };

        const ensureBackButton = (main) => {
          if (!main || screenName(main) === 'landing' || main.classList.contains('screen-landing')) return;

          const restored = main.querySelector(':scope > [data-restored-surface]');
          const host = restored?.querySelector('.rx-main, .rx-ribbonbody') ?? restored ?? main;
          if (!host) return;

          let button = main.querySelector('[data-rx-back-nav]');
          if (!button) {
            button = document.createElement('button');
            button.type = 'button';
            button.className = 'rx-context-back';
            button.dataset.rxBackNav = 'true';
            button.setAttribute('aria-label', 'Back');
            button.textContent = '← Back';
          }

          if (!host.contains(button)) host.prepend(button);
        };

        const ensureReadmePills = () => {
          for (const foot of root.querySelectorAll('.rx-rail .foot')) {
            if (foot.querySelector('[data-rx-readme]')) continue;
            const link = document.createElement('a');
            link.className = 'rx-readme-pill';
            link.dataset.rxReadme = 'true';
            link.href = README_URL;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.setAttribute('aria-label', 'Open the Scan-to-Build system README on GitHub');
            link.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .7a11.5 11.5 0 0 0-3.64 22.4c.58.1.79-.25.79-.56v-2.2c-3.22.7-3.9-1.37-3.9-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.71 1.26 3.37.97.1-.75.4-1.26.73-1.55-2.57-.29-5.27-1.28-5.27-5.69 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.47.11-3.05 0 0 .97-.31 3.16 1.18a10.9 10.9 0 0 1 5.76 0c2.2-1.49 3.16-1.18 3.16-1.18.63 1.58.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.42-2.71 5.39-5.29 5.68.42.36.79 1.07.79 2.16v3.2c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7Z"/></svg><span>Readme</span>';
            foot.append(link);
          }
        };

        const refreshPresentationControls = () => {
          exposeBeginMain();
          for (const main of root.querySelectorAll('main')) ensureBackButton(main);
          ensureReadmePills();
        };

        root.addEventListener('click', (event) => {
          const back = event.target.closest('[data-rx-back-nav]');
          if (!back) return;

          event.preventDefault();
          event.stopPropagation();
          const main = back.closest('main');

          if (window.sessionStorage.getItem(WINDOW_REFERENCE_VIEW) === 'window-seat') {
            const close = main?.querySelector('[data-rx-window-close]');
            if (close) {
              close.click();
              return;
            }
            window.sessionStorage.removeItem(WINDOW_REFERENCE_VIEW);
          }

          if (window.history.state?.path && window.history.length > 1) {
            window.history.back();
            return;
          }

          navigate(fallbackBackPath(main));
        }, true);

        new MutationObserver(refreshPresentationControls).observe(root, { childList: true, subtree: true });
        window.addEventListener('popstate', refreshPresentationControls);
        refreshPresentationControls();
      })();
    </script>
    <script type="module" src="/app.mjs"></script>
  </body>
</html>

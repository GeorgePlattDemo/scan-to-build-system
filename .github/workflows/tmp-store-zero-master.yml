name: Temporary Store Zero master install

on:
  push:
    branches:
      - work/store-zero-master-0.1

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/store-zero-master-0.1
      - name: Restore validated Store Zero master
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/store
          cat .tmp-store-master/part00 .tmp-store-master/part01 .tmp-store-master/part02 .tmp-store-master/part03 .tmp-store-master/part04 .tmp-store-master/part05 > /tmp/stb-master.b64
          base64 -d /tmp/stb-master.b64 | gzip -d > work/store/stb-store-zero-master-0.1.html
          test "$(sha256sum work/store/stb-store-zero-master-0.1.html | awk '{print $1}')" = "33404fb04c1727689adb29b83f293ba8fe2de32af49751b83be6152e09a7df69"
      - name: Commit master and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/store/stb-store-zero-master-0.1.html
          git rm -r .tmp-store-master .github/workflows/tmp-store-zero-master.yml
          git commit -m "Add reconciled Store Zero master 0.1"
          git push origin HEAD:work/store-zero-master-0.1

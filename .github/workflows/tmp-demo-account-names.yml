name: Temporary demo account name alignment

on:
  push:
    branches:
      - build/multi-account-project-ownership-0.1

permissions:
  contents: write

jobs:
  align:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/multi-account-project-ownership-0.1

      - name: Align demo account names
        run: python .tmp-demo-account-names.py

      - name: Syntax and diff guards
        run: |
          set -euo pipefail
          node --check apps/stb/shared/contracts.mjs
          node --check apps/stb/test/browser/multi-account.spec.mjs
          node --check apps/stb/test/unit/account-commerce.test.mjs
          git diff --check
          git diff --name-only
          test -z "$(git diff --name-only | grep -Ev '^(apps/stb/|\.tmp-demo-account-names\.py|\.github/workflows/tmp-demo-account-names\.yml)$' || true)"

      - name: Install app dependencies
        working-directory: apps/stb
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        working-directory: apps/stb
        run: npm run test:unit

      - name: Browser multi-account test
        working-directory: apps/stb
        run: npx playwright install --with-deps chromium && npx playwright test --config test/playwright.config.mjs test/browser/multi-account.spec.mjs

      - name: Commit aligned demo account names and remove temporary machinery
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/stb
          git rm -f .tmp-demo-account-names.py .github/workflows/tmp-demo-account-names.yml
          git commit -m "Align demo account names"
          git push origin HEAD:build/multi-account-project-ownership-0.1

name: D-001 Travel Integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  user1-travel-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout System
        uses: actions/checkout@v4

      - name: Checkout exact tested Store
        uses: actions/checkout@v4
        with:
          repository: GeorgePlattDemo/scan-to-build-store
          ref: fc3f555b8f1f329bcf2dd81fa26995230d12a527
          path: store-zero

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"

      - name: Governing boundary tests
        working-directory: apps/stb
        run: >-
          node --test --test-concurrency=1
          test/unit/store-calculation-identity.test.mjs
          test/unit/dimensional-store-governance.test.mjs
          test/unit/store-wire.test.mjs

      - name: User 1 pinned Store integration
        working-directory: apps/stb
        env:
          STB_STORE_ZERO_ROOT: ${{ github.workspace }}/store-zero
        run: >-
          node --test --test-concurrency=1
          --test-name-pattern="USER_DEFINED_BOARD_V1 re-evaluates every formal Store request and preserves a fresh receipt|USER_DEFINED_BOARD_V1 18-in same-span demand preserves definition and receives Store 72|user-defined X-brace keeps project truth and uses the pinned Store as sole dimensional Q authority|user-defined 18-in same-span demand falls through 60 and selects Store 72|user-defined miter boundary is Store-owned|offering lookup passes any Store SKU through"
          test/store/wrapper.test.mjs
          test/store/pinned.test.mjs

      - name: Alcove pinned Store integration
        working-directory: apps/stb
        env:
          STB_STORE_ZERO_ROOT: ${{ github.workspace }}/store-zero
        run: node --test --test-concurrency=1 test/store/alcove.test.mjs

      - name: Cut packages and item lines through the pinned Store
        working-directory: apps/stb
        env:
          STB_STORE_ZERO_ROOT: ${{ github.workspace }}/store-zero
        run: node --test --test-concurrency=1 test/store/cut-package.test.mjs

      - name: User 1 cached reference equals pinned Store
        working-directory: apps/stb
        env:
          STB_STORE_ZERO_ROOT: ${{ github.workspace }}/store-zero
        run: node --test --test-concurrency=1 test/store/user1-reference-guard.test.mjs

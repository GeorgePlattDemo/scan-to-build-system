name: App candidate checks

on:
  push:
    branches:
      - build/app-configurator-engine-0.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/stb
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: apps/stb/.node-version
          cache: npm
          cache-dependency-path: apps/stb/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        run: npm run test:unit

      - name: Boundary tests
        run: npm run test:boundaries

      - name: Store source and adapter fail-closed tests
        run: npm run test:store

      # Two browser tests exercise the real pinned Store checkout rather than the
      # browser-side mock transport. This workflow has no cross-repository Store
      # checkout or STB_STORE_ZERO_ROOT, so running those two here would only
      # prove that the adapter correctly fails closed. The Store test suite above
      # covers that condition explicitly. The complete browser suite remains the
      # local/pinned-Store integration check when STB_STORE_ZERO_ROOT is present.
      - name: Browser tests (Store checkout not mounted)
        run: >-
          npx playwright test --config test/playwright.config.mjs
          --grep-invert "P5-01 valid committed 45 auto-asks once and Board/Page 5 copy the actual Store answer|incomplete Board and unapplied buffer do not auto-ask"

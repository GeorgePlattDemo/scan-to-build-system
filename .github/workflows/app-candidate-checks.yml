name: App baseline checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/stb
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: apps/stb/.node-version
          cache: npm
          cache-dependency-path: apps/stb/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        run: npm run test:unit

      - name: Boundary tests
        run: npm run test:boundaries

      - name: Store fail-closed tests (no external checkout)
        run: >-
          node --test --test-concurrency=1
          --test-name-pattern="missing STB_STORE_ZERO_ROOT|nonexistent Store root|wrong Store pin|unavailable Store source"
          test/store/source-gate.test.mjs

      - name: Browser tests (Store checkout not mounted)
        run: >-
          npx playwright test --config test/playwright.config.mjs
          --grep-invert "P5-01 valid committed 45 auto-asks once and Board/Page 5 copy the actual Store answer|incomplete Board and unapplied buffer do not auto-ask"

      - name: Checkout exact Stage-2 Store source
        uses: actions/checkout@v4
        with:
          repository: GeorgePlattDemo/scan-to-build-store
          ref: b40cdc60a405d6c2a63d846f2c2e89cddc5bb95d
          path: .stb-store-stage2
          fetch-depth: 1

      - name: Exact Stage-2 Store tests
        env:
          STB_STORE_ZERO_ROOT: ${{ github.workspace }}/.stb-store-stage2
          STB_STAGE2_STORE_PIN: b40cdc60a405d6c2a63d846f2c2e89cddc5bb95d
        run: |
          test "$(git -C "$STB_STORE_ZERO_ROOT" rev-parse HEAD)" = "$STB_STAGE2_STORE_PIN"
          npm run test:store

      - name: Exact Stage-2 vertical
        env:
          STB_STORE_ZERO_ROOT: ${{ github.workspace }}/.stb-store-stage2
          STB_STAGE2_STORE_PIN: b40cdc60a405d6c2a63d846f2c2e89cddc5bb95d
        run: |
          test "$(git -C "$STB_STORE_ZERO_ROOT" rev-parse HEAD)" = "$STB_STAGE2_STORE_PIN"
          npm run test:vertical

      - name: Checkout exact Start Own miter Store source
        uses: actions/checkout@v4
        with:
          repository: GeorgePlattDemo/scan-to-build-store
          ref: c66363597ed9b5ed355220d5599e726730cd2802
          path: .stb-store-start-own
          fetch-depth: 1

      - name: Exact Start Own Store tests
        env:
          STB_STORE_START_OWN_ROOT: ${{ github.workspace }}/.stb-store-start-own
          STB_START_OWN_STORE_PIN: c66363597ed9b5ed355220d5599e726730cd2802
        run: |
          test "$(git -C "$STB_STORE_START_OWN_ROOT" rev-parse HEAD)" = "$STB_START_OWN_STORE_PIN"
          node "$STB_STORE_START_OWN_ROOT/d001-stage2-envelope.test.mjs"
          node "$STB_STORE_START_OWN_ROOT/d001-five-tool.test.mjs"
          npm run test:start-own-store

      - name: Exact Start Own browser proof
        env:
          STB_STORE_START_OWN_ROOT: ${{ github.workspace }}/.stb-store-start-own
          STB_START_OWN_STORE_PIN: c66363597ed9b5ed355220d5599e726730cd2802
        run: |
          test "$(git -C "$STB_STORE_START_OWN_ROOT" rev-parse HEAD)" = "$STB_START_OWN_STORE_PIN"
          npm run test:start-own-browser

      - name: Checkout exact published-jobs Store source
        uses: actions/checkout@v4
        with:
          repository: GeorgePlattDemo/scan-to-build-store
          ref: 4402abeb6b0299a5b6db2eec85ed04c3b0236bcc
          path: .stb-store-published
          fetch-depth: 1

      - name: Exact published-jobs trial
        env:
          STB_STORE_PUBLISHED_JOBS_ROOT: ${{ github.workspace }}/.stb-store-published
          STB_PUBLISHED_STORE_PIN: 4402abeb6b0299a5b6db2eec85ed04c3b0236bcc
        run: |
          test "$(git -C "$STB_STORE_PUBLISHED_JOBS_ROOT" rev-parse HEAD)" = "$STB_PUBLISHED_STORE_PIN"
          npm run trial:published-jobs

      - name: Upload bounded app source for integration proof
        uses: actions/upload-artifact@v4
        with:
          name: stb-app-source
          path: |
            apps/stb/ops
            apps/stb/shared
            apps/stb/server
          if-no-files-found: error
          retention-days: 7

name: Temporary System Build cache bump

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Point System Build button to deployed build-guide revision
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text()
          old = 'system-build-current.html?v=e2dc9c8'
          new = 'system-build-current.html?v=303bcc6'
          assert s.count(old) == 1, f'expected one old cache token, found {s.count(old)}'
          assert new not in s
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit README only and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git rm .github/workflows/tmp-readme-build-guide-cache.yml
          git commit -m "Point System Build button to Store build-guide revision"
          git push origin HEAD:main

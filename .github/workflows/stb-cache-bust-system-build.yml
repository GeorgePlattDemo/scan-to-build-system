name: STB cache-bust system build

on:
  push:
    branches: [fix/system-build-cache-bust-use-this-0.1]

permissions:
  contents: write

jobs:
  update-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/system-build-cache-bust-use-this-0.1
      - name: Update only the System Build URL
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text()
          old = 'https://georgeplattdemo.github.io/scan-to-build-review/system-build-current.html'
          new = 'https://georgeplattdemo.github.io/scan-to-build-review/system-build-current.html?v=7a840e2'
          if new in s:
              print('Versioned URL already present')
          elif old in s:
              if s.count(old) != 1:
                  raise SystemExit(f'Expected exactly one System Build URL, found {s.count(old)}')
              p.write_text(s.replace(old, new, 1))
          else:
              raise SystemExit('Expected System Build URL not found')
          PY
      - name: Commit only if README changed
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name 'Scan-to-Build bounded edit'
          git config user.email 'actions@users.noreply.github.com'
          git add README.md
          git commit -m 'Cache-bust visible System Build link'
          git push origin HEAD:fix/system-build-cache-bust-use-this-0.1

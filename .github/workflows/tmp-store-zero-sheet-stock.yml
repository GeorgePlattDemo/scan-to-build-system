name: Temporary Store Zero sheet shelf extension

on:
  push:
    branches:
      - work/store-zero-sheet-stock-0.1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/store-zero-sheet-stock-0.1

      - name: Add Menards reference sheet shelf only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('work/store/stb-store-zero-master-0.1.html')
          before = p.read_text()

          html_old = '''  <h2 class="lab">DECLARED STOCK — STATED FIGURES, NOT PHYSICAL COUNTS</h2>
  <div id="sz-stock"></div>

  <h2 class="lab">THE NON-CLAIM</h2>'''
          html_new = '''  <h2 class="lab">DECLARED STOCK — STATED FIGURES, NOT PHYSICAL COUNTS</h2>
  <div id="sz-stock"></div>

  <h2 class="lab">MENARDS REFERENCE SHEET SHELF — MERCHANT PRICE × 1.05</h2>
  <div class="band calm"><b>Reference merchant shelf, not live Store inventory.</b> Menards Everyday Low Price is retained as the merchant basis and Store Zero derives its reference shelf price by applying the declared 5% mark-on. Expired rebate values are not used. Store Zero on-hand remains unresolved until a Store declaration establishes it.</div>
  <div id="sz-sheet-stock"></div>

  <h2 class="lab">THE NON-CLAIM</h2>'''
          assert before.count(html_old) == 1, f'Part 01 insertion anchor count={before.count(html_old)}'
          s = before.replace(html_old, html_new, 1)

          data_old = '''  stock: [
    ['STB-ZERO-PINE-1X6-96-001', 'Pine 1×6×96 select S4S',    20.99, 36, 10],
    ['STB-ZERO-PINE-1X6-72-001', 'Pine 1×6×72 select S4S',    15.74, 30,  4],
    ['STB-ZERO-POP-1X6-96-001',  'Poplar 1×6×96 select S4S',  32.18, 12,  0],
    ['STB-ZERO-OAK-1X6-96-001',  'Red oak 1×6×96 select S4S', 34.99,  8,  0],
    ['STB-ZERO-CHR-1X6-96-001',  'Cherry 1×6×96 select S4S',  55.98,  6,  0]
  ],

  owner:''' 
          data_new = '''  stock: [
    ['STB-ZERO-PINE-1X6-96-001', 'Pine 1×6×96 select S4S',    20.99, 36, 10],
    ['STB-ZERO-PINE-1X6-72-001', 'Pine 1×6×72 select S4S',    15.74, 30,  4],
    ['STB-ZERO-POP-1X6-96-001',  'Poplar 1×6×96 select S4S',  32.18, 12,  0],
    ['STB-ZERO-OAK-1X6-96-001',  'Red oak 1×6×96 select S4S', 34.99,  8,  0],
    ['STB-ZERO-CHR-1X6-96-001',  'Cherry 1×6×96 select S4S',  55.98,  6,  0]
  ],

  /* Reference merchant sheet shelf. Merchant price is retained; Store price is derived at render. */
  sheetStock: {
    merchant:   'Menards',
    sourceDate: '2026-09-15',
    priceBasis: 'Everyday Low Price · expired rebate offers excluded',
    markOn:     1.05,
    items: [
      ['STB-ZERO-SHEET-PLY-B2-12-4X8-001', '1252015', '1/2 × 4 × 8 Sanded Utility Plywood', '.453 × 48 × 95-7/8 · B2 · Meranti/Okoume · veneer core · sanded 2 sides · moisture-resistant glue', 43.99, null, 'better-looking hardwood backing / utility veneer · NOT exterior grade'],
      ['STB-ZERO-SHEET-ACX-34-4X8-001', '1251064 · model 690053', '3/4 × 4 × 8 Premium ACX Sanded Plywood', '.703 × 48 × 96 · Pine · AC · PS1 · exterior grade · sanded 2 sides', 52.59, null, 'verified exterior-grade panel · thicker than the roughly 1/2 in target'],
      ['STB-ZERO-MDF-12-49X97-001', '1272002', '1/2 × 49 × 97 MDF Panel', '1/2 × 49 × 97 · Uniboard · standard MDF · smooth paintable surface', 45.00, null, 'full-sheet low-cost backing / paintable panel'],
      ['STB-ZERO-MDF-12-2X4-001', '1272032', '1/2 × 2 × 4 MDF Handi-Panel', 'nominal 1/2 × 2 × 4 · Uniboard MDF', 12.99, null, 'small low-cost backing / trial panel'],
      ['STB-ZERO-MDF-34-4X4-001', '1272049', '3/4 × 4 × 4 MDF Handi-Panel', 'nominal 3/4 × 4 × 4 · Uniboard MDF', 29.99, null, 'thicker low-cost panel / fixture or backing option']
    ],
    gaps: [
      ['1/2 × 4 × 8 Premium ACX Sanded Plywood', 'model 690051', 'Exact target-family product exists, but the current merchant page does not expose a supported price.', 'PRICE UNRESOLVED'],
      ['1/4 × 4 × 8 UV Prefinished Birch Veneer Core Plywood', 'Menards SKU 1251610', 'Strong decorative-backing candidate; current merchant page hides price behind JavaScript.', 'PRICE UNRESOLVED']
    ]
  },

  owner:'''
          assert s.count(data_old) == 1, f'STORE_ZERO stock anchor count={s.count(data_old)}'
          s = s.replace(data_old, data_new, 1)

          render_old = '''    '<p style="margin:7px 0 0;font-size:10.5px;color:var(--text-3)">On-hand is a declared figure. It is not a physical count, and the estimate does not check it — price and availability are different questions with different answers.</p>';
}'''
          render_new = '''    '<p style="margin:7px 0 0;font-size:10.5px;color:var(--text-3)">On-hand is a declared figure. It is not a physical count, and the estimate does not check it — price and availability are different questions with different answers.</p>';

  var sh = STORE_ZERO.sheetStock;
  $('sz-sheet-stock').innerHTML =
    '<table><thead><tr><th>Store Zero SKU</th><th>Menards item</th><th>Description / supported spec</th>' +
    '<th class="n">Menards</th><th class="n">Store Zero</th><th>On hand</th><th>Role</th></tr></thead><tbody>' +
    sh.items.map(function(i){
      var storePrice = Math.round(i[4] * sh.markOn * 100) / 100;
      return '<tr><td>' + i[0] + '</td><td>' + i[1] + '</td><td><b style="color:var(--text)">' + i[2] + '</b><br>' + i[3] +
        '</td><td class="n">' + money(i[4]) + '</td><td class="n">' + money(storePrice) +
        '</td><td><span class="chip wn">UNRESOLVED</span></td><td>' + i[6] + '</td></tr>';
    }).join('') + '</tbody></table>' +
    '<p style="margin:7px 0 9px;font-size:10.5px;color:var(--text-3)">Merchant source — ' + sh.merchant + ' · observed ' + sh.sourceDate + ' · basis: ' + sh.priceBasis + '. Store Zero price = merchant price × ' + sh.markOn.toFixed(2) + '. Merchant availability and Store Zero declared on-hand are separate facts.</p>' +
    '<div class="band warn" style="margin-bottom:0"><b>Useful candidates not promoted to priced stock.</b><br>' +
    sh.gaps.map(function(g){ return '<span class="chip wn">' + g[3] + '</span><b>' + g[0] + '</b> · ' + g[1] + ' — ' + g[2]; }).join('<br>') + '</div>';
}'''
          assert s.count(render_old) == 1, f'renderStore anchor count={s.count(render_old)}'
          s = s.replace(render_old, render_new, 1)

          assert s != before
          assert s.count('MENARDS REFERENCE SHEET SHELF — MERCHANT PRICE × 1.05') == 1
          assert s.count("sheetStock: {") == 1
          assert s.count("'STB-ZERO-MDF-") == 3
          assert s.count("'STB-ZERO-SHEET-") == 2
          assert s.count('PRICE UNRESOLVED') == 2
          p.write_text(s)
          PY

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('work/store/stb-store-zero-master-0.1.html').read_text()
          ids = re.findall(r'\bid="([^"]+)"', s)
          assert len(ids) == len(set(ids)), 'duplicate HTML ids'
          assert 'sz-sheet-stock' in ids
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, flags=re.S)
          Path('/tmp/store-master-scripts.js').write_text('\n;\n'.join(scripts))
          expected = [(43.99,46.19),(52.59,55.22),(45.00,47.25),(12.99,13.64),(29.99,31.49)]
          for merchant, store in expected:
              got = round(merchant * 1.05 + 1e-9, 2)
              assert got == store, (merchant, got, store)
          print(f'ids={len(ids)} unique={len(set(ids))} scripts={len(scripts)} priced_sheet_items=5 unresolved_candidates=2')
          PY
          node --check /tmp/store-master-scripts.js
          git diff --check

      - name: Commit shelf and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/store/stb-store-zero-master-0.1.html
          git rm .github/workflows/tmp-store-zero-sheet-stock.yml
          git commit -m "Add Menards reference sheet shelf to Store Zero"
          git push origin HEAD:work/store-zero-sheet-stock-0.1

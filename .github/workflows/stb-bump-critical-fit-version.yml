name: STB bump critical fit visible build version

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bump:
    if: ${{ github.event.head_commit.message == 'chore: stage critical-fit visible-build version bump' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Advance only the System Build cache token
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text()
          old = 'system-build-current.html?v=411444e'
          new = 'system-build-current.html?v=84b70f3'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one old token, found {s.count(old)}')
          s = s.replace(old, new, 1)
          if s.count(new) != 1:
              raise SystemExit('new token verification failed')
          p.write_text(s)
          PY
          git diff --check -- README.md
          git diff -- README.md
      - name: Commit README only and remove temporary workflow
        run: |
          git rm .github/workflows/stb-bump-critical-fit-version.yml
          git config user.name 'Scan-to-Build bounded edit'
          git config user.email 'actions@users.noreply.github.com'
          git add README.md
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/stb-bump-critical-fit-version.yml README.md "
          git commit -m 'Point System Build button to critical-fit configurator revision'
          git push origin HEAD:main

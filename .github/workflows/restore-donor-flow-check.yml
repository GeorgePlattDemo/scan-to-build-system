name: Restored donor flow check

on:
  push:
    branches:
      - fix/restore-donor-flow-0.1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restore-donor-flow-check
  cancel-in-progress: true

jobs:
  restored-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/stb
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply bounded presentation repair
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/stb/browser/ui/future-chain.mjs')
          text = path.read_text()

          old_window = "function windowSeat(screen){const [tag,title,narrative,resolves]=WINDOW_STEPS[windowStep];screen.dataset.rx=`window-${windowStep}`;mount("
          new_window = "function windowSeat(screen){const key=`window-${windowStep}`;if(screen.dataset.rx===key)return;const [tag,title,narrative,resolves]=WINDOW_STEPS[windowStep];screen.dataset.rx=key;mount("
          if old_window in text:
              text = text.replace(old_window, new_window, 1)
          elif new_window not in text:
              raise SystemExit('window-seat guard target not found')

          old_observer = "new MutationObserver(schedule).observe(root,{childList:true,subtree:true});window.addEventListener('popstate',schedule);schedule();"
          new_observer = "new MutationObserver(schedule).observe(root,{childList:true,subtree:true,attributes:true,attributeFilter:['data-class-id','data-child']});window.addEventListener('popstate',schedule);schedule();"
          if old_observer in text:
              text = text.replace(old_observer, new_observer, 1)
          elif new_observer not in text:
              raise SystemExit('presentation observer target not found')

          path.write_text(text)
          PY

          if ! git diff --quiet -- apps/stb/browser/ui/future-chain.mjs; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/stb/browser/ui/future-chain.mjs
            git commit -m "Stabilize restored presentation routing"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: apps/stb/.node-version
          cache: npm
          cache-dependency-path: apps/stb/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Unit tests
        run: npm run test:unit
      - name: Boundary tests
        run: npm run test:boundaries
      - name: Diagnose picnic transition
        shell: bash
        run: |
          cat > test/browser/_picnic-diagnostic.spec.mjs <<'EOF'
          import { test } from '@playwright/test';

          test('diagnose picnic final DOM', async ({ page }) => {
            await page.goto('/');
            await page.getByRole('button', { name: 'NEW USER', exact: true }).click();
            await page.getByRole('heading', { name: 'We don’t sell products.', exact: true }).waitFor();
            await page.getByRole('button', { name: 'START', exact: true }).click();
            const begin = page.locator('main[data-screen="begin"]');
            await begin.locator('.rx-ribbon [data-front-door="picnic"]').click();
            await page.getByRole('heading', { name: 'Picnic tables', exact: true }).waitFor();
            await page.locator('.rx-ribbon [data-picnic-form="attached-bench"][data-picnic-scope="frame-kit"]').click();
            const questions = page.locator('main[data-screen="questions"][data-class-id="classic-picnic-table-fixture"]');
            await questions.waitFor();
            await page.locator('[data-project-configurator="classic-picnic-table-fixture"]').waitFor();
            await page.waitForTimeout(700);
            const state = await questions.evaluate((el) => ({
              dataset: { ...el.dataset },
              className: el.className,
              restored: Boolean(el.querySelector(':scope > [data-restored-surface]')),
              back: Boolean(el.querySelector('[data-rx-back-nav]')),
              banner: Boolean(el.querySelector('.rx-banner')),
              configuratorParent: el.querySelector('[data-project-configurator]')?.parentElement?.className ?? null,
              childSummary: [...el.children].map((child) => ({
                tag: child.tagName,
                className: child.className,
                restored: child.hasAttribute('data-restored-surface'),
                text: child.textContent?.slice(0, 120),
              })),
              htmlStart: el.innerHTML.slice(0, 3500),
            }));
            console.log('PICNIC_DIAGNOSTIC=' + JSON.stringify(state));
          });
          EOF
          npx playwright test --config test/playwright.config.mjs test/browser/_picnic-diagnostic.spec.mjs
          rm test/browser/_picnic-diagnostic.spec.mjs
      - name: Restored human-path browser tests
        run: npx playwright test --config test/playwright.config.mjs test/browser/restored-experience.spec.mjs

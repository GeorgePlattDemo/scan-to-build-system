name: Temporary Store Zero sheet shelf patch

on:
  push:
    branches:
      - work/store-zero-sheet-stock-0.1

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/store-zero-sheet-stock-0.1
      - name: Apply bounded patch
        run: python .tmp-store-sheet-patch.py
      - name: Validate scripts and diff
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('work/store/stb-store-zero-master-0.1.html').read_text()
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, flags=re.S)
          Path('/tmp/store-master-scripts.js').write_text('\n;\n'.join(scripts))
          print('scripts=', len(scripts))
          PY
          node --check /tmp/store-master-scripts.js
          git diff --check
      - name: Commit master only and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/store/stb-store-zero-master-0.1.html
          git rm .tmp-store-sheet-patch.py .github/workflows/tmp-store-zero-sheet-stock.yml .github/workflows/tmp-store-zero-sheet-stock-2.yml
          git commit -m "Add Menards reference sheet shelf to Store Zero"
          git push origin HEAD:work/store-zero-sheet-stock-0.1

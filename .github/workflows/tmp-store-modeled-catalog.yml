name: Temporary Store Zero modeled catalog patch

on:
  push:
    branches:
      - work/store-zero-modeled-catalog-0.1

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/store-zero-modeled-catalog-0.1

      - name: Apply bounded catalog patch
        run: python .tmp-store-modeled-catalog-patch.py

      - name: Normalize one source apostrophe
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('work/store/stb-store-zero-master-0.1.html')
          s = p.read_text().replace("Lowe's", "Lowe’s")
          p.write_text(s)
          PY

      - name: Validate modeled catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('work/store/stb-store-zero-master-0.1.html').read_text()
          ids = re.findall(r'\bid="([^"]+)"', s)
          assert len(ids) == len(set(ids)), 'duplicate HTML ids'
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, flags=re.S)
          Path('/tmp/store-master-scripts.js').write_text('\n;\n'.join(scripts))
          expected = {
              19.50:20.48, 14.00:14.70, 31.50:33.08, 48.92:51.37, 51.96:54.56,
              43.99:46.19, 52.59:55.22, 45.00:47.25, 12.99:13.64, 29.99:31.49, 48.00:50.40
          }
          for basis, store in expected.items():
              got = int(basis * 1.05 * 100 + 0.5 + 1e-7) / 100
              assert got == store, (basis, got, store)
          assert round(20.48*10 + 14.70*4 + 83.56 + 18.00, 2) == 365.16
          assert s.count(' 200,') >= 5
          assert s.count(', 60,') >= 7
          assert 'PRICE UNRESOLVED' not in s
          print(f'ids={len(ids)} unique={len(set(ids))} scripts={len(scripts)} modeled_material_skus=12 base_fabrication=$365.16')
          PY
          node --check /tmp/store-master-scripts.js
          git diff --check

      - name: Commit master only and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/store/stb-store-zero-master-0.1.html
          git rm .tmp-store-modeled-catalog-patch.py .github/workflows/tmp-store-modeled-catalog.yml
          git commit -m "Model Store Zero catalog for clean baseline runs"
          git push origin HEAD:work/store-zero-modeled-catalog-0.1
